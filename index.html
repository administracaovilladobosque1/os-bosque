<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Sistema de OS - Villa do Bosque</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Calibri', 'Segoe UI', Tahoma, sans-serif; }
        body { background: #e8f5e9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px 15px; }
        .container { background: #fff; padding: 30px 25px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,80,0,0.15); width: 100%; max-width: 450px; border: 1px solid #a5d6a7; }
        .logo-area { text-align: center; margin-bottom: 25px; }
        .logo-area img { max-width: 180px; height: auto; display: block; margin: 0 auto 10px; }
        .logo-area .main-title { font-size: 28px; font-weight: 700; color: #1b5e20; line-height: 1.2; margin-top: 5px; }
        .logo-area .main-title span { background: #c8e6c9; padding: 6px 18px; border-radius: 30px; display: inline-block; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 5px; color: #1b5e20; }
        input { width: 100%; padding: 14px 15px; border: 1px solid #a5d6a7; border-radius: 10px; font-size: 16px; background: #fafffe; }
        input:focus { outline: none; border-color: #2e7d32; box-shadow: 0 0 0 3px rgba(46,125,50,0.2); }
        .btn { width: 100%; padding: 14px; background: #2e7d32; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #1b5e20; }
        .btn-danger { background: #c62828; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-success { background: #388e3c; }
        .btn-success:hover { background: #2e7d32; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .message { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; }
        .message.error { display: block; background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
        .message.success { display: block; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
        .hidden { display: none !important; }

        #dashboard { display: none; }
        .user-info { background: #e8f5e9; padding: 15px; border-radius: 12px; margin: 20px 0; text-align: center; border: 1px solid #a5d6a7; }
        .user-info strong { color: #1b5e20; }
        .logout-area { text-align: center; margin-top: 20px; }
        .logout-area .btn { width: auto; padding: 12px 40px; display: inline-block; }
        .timeout-warning { font-size: 13px; color: #558b2f; text-align: right; margin-top: 10px; }

        .master-panel { background: #f1f8e9; border-radius: 16px; padding: 20px; margin-top: 20px; border: 1px solid #a5d6a7; }
        h2 { font-size: 20px; margin: 25px 0 15px; color: #2e7d32; border-bottom: 2px solid #c8e6c9; padding-bottom: 10px; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-group .btn {
            text-decoration: none;
            text-align: center;
        }
        @media (max-width: 600px) {
            body { padding: 10px 8px; }
            .container { padding: 20px 15px; max-width: 100%; }
            .logo-area img { max-width: 120px; }
            .logo-area .main-title { font-size: 22px; }
            .btn-group .btn { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- TELA DE LOGIN -->
    <div id="loginScreen">
        <div class="logo-area">
            <img src="logo.png" alt="Logo Villa do Bosque">
            <div class="main-title"><span>SISTEMA<br>ORDEM DE SERVIÇO</span></div>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Entrar</button>
        </form>
        <div id="loginMessage" class="message"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <div class="logo-area" style="margin-bottom:10px;">
            <img src="logo.png" alt="Logo Villa do Bosque" style="max-width:100px;">
            <div class="main-title" style="font-size:22px;"><span>SISTEMA<br>ORDEM DE SERVIÇO</span></div>
        </div>
        <h1 style="font-size:26px; color:#1b5e20; text-align:center;">📋 Painel de Controle</h1>
        <div class="user-info">
            <p>👋 Olá, <strong id="userName">Usuário</strong>!</p>
            <p style="font-size:13px; color:#2e7d32;" id="userEmail"></p>
            <p style="font-size:13px; color:#2e7d32;" id="userRoleDisplay"></p>
            <p style="font-size:12px; color:#558b2f; margin-top:5px;">⏳ Sessão ativa por <span id="timerDisplay">4h00</span></p>
        </div>

        <!-- ÁREA DO MASTER (só para Master) -->
        <div id="masterArea" class="hidden">
            <div class="master-panel">
                <h2>👑 Painel do Master</h2>
                <div class="btn-group">
                    <a href="personagens.html" class="btn btn-success">👥 Gerenciar Personagens</a>
                    <a href="os-list.html" class="btn btn-secondary">📋 Listar Ordens de Serviço</a>
                    <a href="os-abrir.html" class="btn btn-secondary">📝 Nova OS</a>
                </div>
            </div>
        </div>

        <!-- ÁREA GERAL (para Admin e Diretor) -->
        <div id="generalArea" class="hidden">
            <div class="master-panel" style="background:#fafffe;">
                <h2>📋 Ações</h2>
                <div class="btn-group">
                    <a href="os-list.html" class="btn btn-secondary">📋 Listar Ordens de Serviço</a>
                    <a href="os-abrir.html" class="btn btn-success">📝 Nova OS</a>
                </div>
            </div>
        </div>

        <div class="logout-area">
            <button class="btn btn-danger" id="logoutBtn">Sair</button>
        </div>
        <div class="timeout-warning">⏱️ Sessão expira após 4 horas de inatividade.</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDx_6oWO30Drh8GkuQA9jk2Oym7H8J3ABg",
        authDomain: "villa-bosque1.firebaseapp.com",
        projectId: "villa-bosque1",
        storageBucket: "villa-bosque1.firebasestorage.app",
        messagingSenderId: "372474036025",
        appId: "1:372474036025:web:bbbee10723469d77cbb2e8"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const MASTER_EMAIL = 'administracaovilladobosque@gmail.com';
    const TIMEOUT_MS = 4 * 60 * 60 * 1000;
    let timeoutId = null, timerInterval = null;

    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboard');
    const masterArea = document.getElementById('masterArea');
    const generalArea = document.getElementById('generalArea');
    const userRoleDisplay = document.getElementById('userRoleDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const loginForm = document.getElementById('loginForm');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginMessage = document.getElementById('loginMessage');
    const userName = document.getElementById('userName');
    const userEmail = document.getElementById('userEmail');

    let currentUserRole = 'tecnico'; // padrão

    function resetTimeout() {
        if (timeoutId) clearTimeout(timeoutId);
        if (timerInterval) clearInterval(timerInterval);
        timeoutId = setTimeout(() => auth.signOut().then(() => alert('Sessão expirada por inatividade.')), TIMEOUT_MS);
        let remaining = TIMEOUT_MS;
        timerInterval = setInterval(() => {
            remaining = Math.max(0, remaining - 1000);
            const h = String(Math.floor(remaining/3600000)).padStart(2,'0');
            const m = String(Math.floor((remaining%3600000)/60000)).padStart(2,'0');
            const s = String(Math.floor((remaining%60000)/1000)).padStart(2,'0');
            timerDisplay.textContent = `${h}h${m}m${s}s`;
            if (remaining <= 0) clearInterval(timerInterval);
        }, 1000);
    }
    function setupActivityListeners() {
        ['click','mousemove','keydown','scroll','touchstart'].forEach(ev => document.addEventListener(ev, resetTimeout));
    }

    function showLoginScreen() {
        loginScreen.classList.remove('hidden');
        dashboardScreen.style.display = 'none';
        loginMessage.className = 'message';
        loginMessage.textContent = '';
        if (timerInterval) clearInterval(timerInterval);
        if (timeoutId) clearTimeout(timeoutId);
    }

    function showDashboard(user) {
        loginScreen.classList.add('hidden');
        dashboardScreen.style.display = 'block';
        userName.textContent = user.displayName || 'Usuário';
        userEmail.textContent = user.email;

        // Verifica se é Master
        if (user.email === MASTER_EMAIL) {
            masterArea.classList.remove('hidden');
            generalArea.classList.add('hidden');
            userRoleDisplay.textContent = '👑 Função: Master (Controle Total)';
        } else {
            masterArea.classList.add('hidden');
            // Busca a função do usuário no Firestore
            db.collection('usuarios').doc(user.uid).get()
                .then(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        currentUserRole = data.funcao || 'tecnico';
                        const roleMap = { 'admin':'Administrador', 'diretor':'Diretor', 'master':'Master', 'tecnico':'Técnico' };
                        userRoleDisplay.textContent = `🔹 Função: ${roleMap[currentUserRole] || currentUserRole}`;
                        // Mostra área geral se for admin ou diretor
                        if (currentUserRole === 'admin' || currentUserRole === 'diretor') {
                            generalArea.classList.remove('hidden');
                        } else {
                            generalArea.classList.add('hidden');
                        }
                    } else {
                        // Se não tem documento, assume técnico e esconde área geral
                        currentUserRole = 'tecnico';
                        userRoleDisplay.textContent = '🔹 Função: Técnico';
                        generalArea.classList.add('hidden');
                    }
                })
                .catch(() => {
                    currentUserRole = 'tecnico';
                    userRoleDisplay.textContent = '🔹 Função: Técnico';
                    generalArea.classList.add('hidden');
                });
        }

        resetTimeout();
        setupActivityListeners();
    }

    function showMessage(el, text, type) {
        el.textContent = text;
        el.className = 'message ' + type;
    }

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = loginEmail.value.trim();
        const password = loginPassword.value;
        if (!email || !password) { showMessage(loginMessage, 'Preencha todos os campos.', 'error'); return; }
        auth.signInWithEmailAndPassword(email, password)
            .then(() => showMessage(loginMessage, 'Login realizado!', 'success'))
            .catch((error) => {
                let msg = 'Erro ao fazer login.';
                if (error.code === 'auth/user-not-found') msg = 'Usuário não encontrado.';
                else if (error.code === 'auth/wrong-password') msg = 'Senha incorreta.';
                else if (error.code === 'auth/invalid-email') msg = 'E-mail inválido.';
                showMessage(loginMessage, msg, 'error');
            });
    });

    logoutBtn.addEventListener('click', () => { if (timerInterval) clearInterval(timerInterval); if (timeoutId) clearTimeout(timeoutId); auth.signOut(); });

    auth.onAuthStateChanged((user) => {
        if (user) {
            db.collection('usuarios').doc(user.uid).get()
                .then(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        userName.textContent = data.nome || user.displayName || 'Usuário';
                        currentUserRole = data.funcao || 'tecnico';
                    } else {
                        userName.textContent = user.displayName || 'Usuário';
                        currentUserRole = 'tecnico';
                    }
                    userEmail.textContent = user.email;
                    showDashboard(user);
                })
                .catch(() => {
                    userName.textContent = user.displayName || 'Usuário';
                    userEmail.textContent = user.email;
                    showDashboard(user);
                });
        } else {
            showLoginScreen();
            loginForm.reset();
            loginMessage.className = 'message';
            loginMessage.textContent = '';
            masterArea.classList.add('hidden');
            generalArea.classList.add('hidden');
            if (timerInterval) clearInterval(timerInterval);
            if (timeoutId) clearTimeout(timeoutId);
        }
    });

    showLoginScreen();
</script>
</body>
</html>
