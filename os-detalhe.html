<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Detalhe da OS - Villa do Bosque</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Calibri', 'Segoe UI', Tahoma, sans-serif; }
        body { background: #e8f5e9; padding: 16px 12px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: #fff; max-width: 900px; width: 100%; padding: 20px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,80,0,0.12); border: 1px solid #a5d6a7; }

        .user-header {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #1b5e20;
        }
        .user-header .uh-label { font-weight: 500; color: #558b2f; }
        .uh-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #000;
            white-space: nowrap;
        }
        .uh-badge.master { background: #ffcc80; }
        .uh-badge.admin { background: #ffe082; }
        .uh-badge.diretor { background: #a5d6a7; }
        .uh-badge.tecnico { background: #ced4da; }

        .page-title { font-size: 24px; color: #1b5e20; background: #c8e6c9; display: inline-block; padding: 4px 18px; border-radius: 30px; margin-bottom: 12px; }
        .btn { padding: 8px 16px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn:hover { background: #1b5e20; }
        .btn-success { background: #388e3c; }
        .btn-success:hover { background: #2e7d32; }
        .btn-danger { background: #c62828; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-warning { background: #f0ad4e; color: #000; }
        .btn-warning:hover { background: #ec971f; }
        .btn-voltar { background: #558b2f; }
        .btn-voltar:hover { background: #33691e; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-edit { background: transparent; border: 1px solid #2e7d32; color: #2e7d32; padding: 2px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .btn-edit:hover { background: #e8f5e9; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }

        .os-info { background: #f8f9fa; border-radius: 12px; padding: 16px; margin-bottom: 20px; border: 1px solid #c8e6c9; }
        .os-info .info-row { display: flex; flex-wrap: wrap; padding: 4px 0; border-bottom: 1px solid #e8f5e9; align-items: center; }
        .os-info .info-row:last-child { border-bottom: none; }
        .os-info .info-label { font-weight: 600; color: #1b5e20; width: 140px; flex-shrink: 0; }
        .os-info .info-value { flex: 1; word-break: break-word; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .os-info .info-value .edit-field { margin-left: auto; flex-shrink: 0; }
        .os-info .info-value .badge, .card .badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 600; white-space: nowrap;
        }
        .badge-grupo { background: #ced4da; color: #000; }
        .badge-admin { background: #ffe082; color: #000; }
        .badge-diretor { background: #a5d6a7; color: #000; }
        .badge-master { background: #ffcc80; color: #000; }
        .badge-aberta { background: #e3f2fd; color: #0d47a1; }
        .badge-em_andamento { background: #fff3e0; color: #e65100; }
        .badge-concluida { background: #c8e6c9; color: #1b5e20; }
        .badge-cancelada { background: #e0e0e0; color: #424242; }
        .badge-emergencial { background: #ffcdd2; color: #b71c1c; font-weight: bold; }
        .badge-urgente { background: #fff9c4; color: #f57f17; font-weight: bold; }
        .badge-normal { background: #c8e6c9; color: #1b5e20; font-weight: bold; }
        .edit-historico { font-size: 12px; color: #888; font-style: italic; margin-left: 6px; }

        select option.grupo { background-color: #ced4da; }
        select option.admin { background-color: #ffe082; }
        select option.diretor { background-color: #a5d6a7; }

        .historico-container { margin: 20px 0; display: flex; flex-direction: column; gap: 12px; }
        .historico-container .card {
            border-radius: 8px; padding: 12px 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid #e8f5e9;
            border-left-width: 4px; border-left-style: solid;
        }
        .card-admin { background: #fffde7; border-left-color: #ffe082; }
        .card-diretor { background: #f1f8e9; border-left-color: #a5d6a7; }
        .card-master { background: #fff8e1; border-left-color: #ffcc80; }
        .card-outros { background: #f8f9fa; border-left-color: #ced4da; }
        .card-ultimo { background: #ffebee; border-left-color: #c62828; border: 2px solid #ef9a9a; }
        .card-concluida { background: #e8f5e9; border-left-color: #2e7d32; border: 2px solid #a5d6a7; }
        .aviso-concluida { font-size: 14px; color: #1b5e20; margin: 4px 0; }

        .card .card-header { display: flex; justify-content: space-between; font-size: 13px; color: #555; margin-bottom: 4px; flex-wrap: wrap; align-items: center; gap: 6px; }
        .card .card-header .usuario { font-weight: 600; color: #1b5e20; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .card .card-header .header-right { display: flex; align-items: center; gap: 8px; }
        .card .card-header .tempo { font-size: 12px; color: #888; }
        .card .card-body { font-size: 14px; }
        .card .card-body .direcionado { font-size: 13px; color: #555; margin-top: 4px; }
        .card .card-body .mensagem { margin-top: 4px; }

        .btn-delete-card {
            background: #fff;
            border: 1px solid #c62828;
            color: #c62828;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
            font-weight: 700;
        }
        .btn-delete-card:hover {
            background: #c62828;
            color: #fff;
        }

        .nova-acao .form-group { margin-bottom: 10px; }
        .nova-acao label { font-weight: 600; font-size: 13px; color: #1b5e20; display: block; margin-bottom: 2px; }
        .nova-acao textarea, .nova-acao select {
            width: 100%; padding: 6px 10px; border: 1px solid #a5d6a7;
            border-radius: 6px; font-size: 14px; background: #fafffe;
        }
        .nova-acao textarea { resize: vertical; min-height: 50px; }
        .acoes-rodape { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
        .acoes-rodape .btn { margin-right: 0; }
        .message { margin-top: 8px; padding: 6px 10px; border-radius: 6px; display: none; font-size: 13px; }
        .message.error { display: block; background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
        .message.success { display: block; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }

        .edit-field { display: inline-flex; align-items: center; gap: 4px; }
        .edit-field input, .edit-field select { padding: 2px 6px; border: 1px solid #a5d6a7; border-radius: 4px; font-size: 14px; }

        @media (max-width: 600px) {
            .container { padding: 14px; }
            .page-title { font-size: 20px; }
            .os-info .info-label { width: 100px; }
            .os-info .info-value { font-size: 13px; flex-wrap: wrap; }
            .acoes-rodape { flex-direction: column; align-items: stretch; }
            .acoes-rodape .btn { width: 100%; text-align: center; }
            .card .card-header { flex-direction: column; align-items: flex-start; gap: 4px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="user-header" id="userHeader">
        <span class="uh-label">Logado como:</span>
        <span class="uh-badge tecnico" id="userHeaderBadge">—</span>
    </div>

    <div class="header-actions">
        <a href="os-list.html" class="btn btn-voltar">← Voltar</a>
        <span style="flex:1;"></span>
        <span id="osStatusBadge" class="badge badge-aberta" style="font-size:16px; padding:6px 16px;">Aberta</span>
    </div>

    <h1 class="page-title" id="osTitulo">📋 OS #<span id="osNumero">---</span></h1>

    <div class="os-info" id="osInfoContainer"></div>
    <div id="historicoContainer" class="historico-container"><p>Carregando...</p></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDx_6oWO30Drh8GkuQA9jk2Oym7H8J3ABg",
        authDomain: "villa-bosque1.firebaseapp.com",
        projectId: "villa-bosque1",
        storageBucket: "villa-bosque1.firebasestorage.app",
        messagingSenderId: "372474036025",
        appId: "1:372474036025:web:bbbee10723469d77cbb2e8"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    db.enablePersistence({ synchronizeTabs: true }).catch(err => {
        if (err.code === 'failed-precondition') console.warn('Persistência: múltiplas abas abertas.');
        else if (err.code === 'unimplemented') console.warn('Persistência: navegador não suporta.');
    });

    const MASTER_EMAIL = 'administracaovilladobosque@gmail.com';
    const TIMEOUT_MS = 4 * 60 * 60 * 1000;
    const TIMEOUT_KEY = 'vb_lastActivity';
    const TIMEOUT_CHECK_INTERVAL = 30 * 1000;

    const USER_CACHE_KEY = 'vb_userMapCache';
    const USER_CACHE_TTL = 10 * 60 * 1000;

    const GRUPO_ADMIN_TEXTO = 'Administração';
    const GRUPO_DIRETOR_TEXTO = 'Diretores';

    function salvarUserMapNoCache(map) {
        try {
            sessionStorage.setItem(USER_CACHE_KEY, JSON.stringify({
                dados: map,
                expiraEm: Date.now() + USER_CACHE_TTL
            }));
        } catch(e) {}
    }
    function lerUserMapDoCache() {
        try {
            const raw = sessionStorage.getItem(USER_CACHE_KEY);
            if (!raw) return null;
            const obj = JSON.parse(raw);
            if (!obj || !obj.expiraEm || obj.expiraEm < Date.now()) {
                sessionStorage.removeItem(USER_CACHE_KEY);
                return null;
            }
            return obj.dados || null;
        } catch(e) { return null; }
    }

    function registrarAtividade() { try { localStorage.setItem(TIMEOUT_KEY, Date.now().toString()); } catch(e) {} }
    function fazerLogoutTimeout() {
        if (window.__fazendoLogout) return;
        window.__fazendoLogout = true;
        try { localStorage.removeItem(TIMEOUT_KEY); localStorage.removeItem('vb_userLoggedIn'); sessionStorage.clear(); } catch(e) {}
        auth.signOut().finally(() => {
            alert('Sessão expirada por inatividade. Faça login novamente.');
            window.location.href = 'index.html';
        });
    }
    function verificarTimeoutAgora() {
        const last = parseInt(localStorage.getItem(TIMEOUT_KEY) || '0', 10);
        if (!last) return false;
        if ((Date.now() - last) > TIMEOUT_MS) { fazerLogoutTimeout(); return true; }
        return false;
    }
    function iniciarMonitorTimeout() {
        if (verificarTimeoutAgora()) return;
        if (!localStorage.getItem(TIMEOUT_KEY)) registrarAtividade();
        ['click','mousemove','keydown','scroll','touchstart'].forEach(ev => {
            document.addEventListener(ev, registrarAtividade, { passive: true });
        });
        setInterval(verificarTimeoutAgora, TIMEOUT_CHECK_INTERVAL);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') verificarTimeoutAgora();
        });
    }

    let currentUser = null;
    let currentUserData = null;
    let osId = null;
    let osData = null;
    let userMap = {};
    let editando = { campo: null, original: null };

    const osNumero = document.getElementById('osNumero');
    const osTitulo = document.getElementById('osTitulo');
    const osStatusBadge = document.getElementById('osStatusBadge');
    const osInfoContainer = document.getElementById('osInfoContainer');
    const historicoContainer = document.getElementById('historicoContainer');
    const userHeaderBadge = document.getElementById('userHeaderBadge');

    function removerAcentos(str) { return str.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
    function formatarDataHora(dataISO) {
        if (!dataISO) return '—';
        const d = new Date(dataISO);
        if (isNaN(d)) return '—';
        const dia = String(d.getDate()).padStart(2, '0');
        const mes = String(d.getMonth()+1).padStart(2, '0');
        const ano = d.getFullYear();
        const hora = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${dia}/${mes}/${ano} ${hora}:${min}`;
    }
    function getFuncao(uid) { return (uid && userMap[uid]) ? userMap[uid].funcao : null; }
    function getNome(uid) { return (uid && userMap[uid]) ? userMap[uid].nome : (uid || '—'); }
    function formatarLote(valor) {
        if (!valor) return '';
        const num = parseInt(valor.trim(), 10);
        if (isNaN(num) || num < 1) return valor.trim();
        return String(Math.min(num, 99)).padStart(2, '0');
    }

    function atualizarHeader(nome, funcao) {
        const f = funcao || 'tecnico';
        userHeaderBadge.className = 'uh-badge ' + f;
        userHeaderBadge.textContent = `${nome || 'Usuário'} (${f})`;
    }

    // ============================================================
    // HELPERS DE DETECÇÃO E CLASSIFICAÇÃO
    // ============================================================
    function limparSufixoFuncao(nome) {
        if (!nome) return '';
        return String(nome).replace(/\s*\([^)]*\)\s*$/, '').trim();
    }

    function detectarFuncao(nome, uid, funcaoDireta) {
        if (funcaoDireta) return funcaoDireta;
        if (uid && userMap[uid]) return userMap[uid].funcao;
        const n = (limparSufixoFuncao(nome) || '').toLowerCase();
        if (n === 'admin' || n === 'administrador' || n === 'administradores') return 'admin';
        if (n === 'diretor' || n === 'diretores' || n === 'diretoria') return 'diretor';
        if (n === 'master' || n === 'masters') return 'master';
        if (n.includes('admin')) return 'admin';
        if (n.includes('diretor')) return 'diretor';
        if (n.includes('master')) return 'master';
        return null;
    }

    // Classifica um destino: grupo vs pessoa. Centraliza a lógica para
    // os-list, os-detalhe e para o contador anti-jeitinho.
    function classificarDestino(alvo, nome, funcao) {
        const nomeLimpo = limparSufixoFuncao(nome);
        const base = (nomeLimpo || '').toLowerCase();

        if (alvo === 'group:admin') {
            return { tipo: 'grupo', subtipo: 'admin', texto: GRUPO_ADMIN_TEXTO, cor: '#ffe082' };
        }
        if (alvo === 'group:diretor') {
            return { tipo: 'grupo', subtipo: 'diretor', texto: GRUPO_DIRETOR_TEXTO, cor: '#a5d6a7' };
        }

        // UID real → pessoa
        if (alvo && typeof alvo === 'string' && !alvo.startsWith('group:')) {
            const f = (userMap[alvo] && userMap[alvo].funcao) || funcao || detectarFuncao(nomeLimpo, alvo, null);
            let cor = '#ced4da';
            if (f === 'admin') cor = '#ffe082';
            else if (f === 'diretor') cor = '#a5d6a7';
            else if (f === 'master') cor = '#ffcc80';
            let texto = nomeLimpo || '—';
            if (f && !texto.includes('(')) texto = `${texto} (${f})`;
            return { tipo: 'pessoa', funcao: f, texto, cor };
        }

        // Alvo vazio → decide pelo nome
        if (base === 'admin' || base === 'administrador' || base === 'administradores' ||
            base === 'administração' || base === 'administracao') {
            return { tipo: 'grupo', subtipo: 'admin', texto: GRUPO_ADMIN_TEXTO, cor: '#ffe082' };
        }
        if (base === 'diretor' || base === 'diretores' || base === 'diretoria') {
            return { tipo: 'grupo', subtipo: 'diretor', texto: GRUPO_DIRETOR_TEXTO, cor: '#a5d6a7' };
        }
        if (base === 'master' || base === 'masters') {
            return { tipo: 'grupo', subtipo: 'master', texto: 'Masters', cor: '#ffcc80' };
        }

        // Fallback — trata como pessoa
        const f = funcao || detectarFuncao(nomeLimpo, alvo, null);
        let cor = '#ced4da';
        if (f === 'admin') cor = '#ffe082';
        else if (f === 'diretor') cor = '#a5d6a7';
        else if (f === 'master') cor = '#ffcc80';
        let texto = nomeLimpo || '—';
        if (f && !texto.includes('(')) texto = `${texto} (${f})`;
        return { tipo: 'pessoa', funcao: f, texto, cor };
    }

    function getCategoriaDestino(direcionadoPara, direcionadoFuncao, direcionadoNome) {
        const c = classificarDestino(direcionadoPara, direcionadoNome, direcionadoFuncao);
        if (c.tipo === 'grupo') {
            if (c.subtipo === 'diretor') return 'diretor';
            if (c.subtipo === 'admin') return 'admin';
            if (c.subtipo === 'master') return 'master';
            return 'outros';
        }
        return c.funcao || 'outros';
    }

    function recalcularEstado(historico, osAtual) {
        const abertura = historico.find(h => h.acao === 'abertura');
        let dirPara = (abertura && abertura.direcionado_para)
            || osAtual.direcionado_para_original
            || osAtual.direcionado_para
            || null;
        let dirNome = (abertura && abertura.direcionado_para_nome)
            || osAtual.direcionado_para_nome_original
            || osAtual.direcionado_para_nome
            || null;
        let dirFuncao = osAtual.direcionado_para_funcao_original
            || osAtual.direcionado_para_funcao
            || '';
        let dirEm = osAtual.criado_em || null;
        let catAtual = getCategoriaDestino(dirPara, dirFuncao, dirNome);

        const acoes = (historico || [])
            .filter(h => h.acao && h.acao !== 'abertura' && h.acao !== 'edicao')
            .sort((a, b) => (a.data || '').localeCompare(b.data || ''));

        acoes.forEach(acao => {
            if (!acao.direcionado_para) return;
            const catNova = getCategoriaDestino(
                acao.direcionado_para,
                acao.direcionado_para_funcao,
                acao.direcionado_para_nome
            );
            dirPara = acao.direcionado_para;
            dirNome = acao.direcionado_para_nome || dirNome;
            dirFuncao = acao.direcionado_para_funcao || dirFuncao;
            if (catNova !== catAtual) {
                dirEm = acao.data;
                catAtual = catNova;
            }
        });

        return { dirPara, dirNome, dirFuncao: dirFuncao || '', dirEm };
    }

    // Badge de autor (sempre pessoa)
    function getBadgePerfil(uid, nome) {
        const nomeLimpo = limparSufixoFuncao(nome);
        const f = detectarFuncao(nomeLimpo, uid, null);
        let classe = 'badge-grupo';
        if (f === 'admin') classe = 'badge-admin';
        else if (f === 'diretor') classe = 'badge-diretor';
        else if (f === 'master') classe = 'badge-master';

        let texto = nomeLimpo || '—';
        if (f && !texto.includes('(')) {
            texto = `${texto} (${f})`;
        }
        return `<span class="badge ${classe}">${texto}</span>`;
    }

    // Badge de direcionamento — grupo mostra só o texto fixo, pessoa mostra "Nome (função)"
    function getBadgeDirecionado(data) {
        const c = classificarDestino(data.direcionado_para, data.direcionado_para_nome, data.direcionado_para_funcao);
        let classe = 'badge-grupo';
        if (c.tipo === 'grupo') {
            if (c.subtipo === 'diretor') classe = 'badge-diretor';
            else if (c.subtipo === 'admin') classe = 'badge-admin';
            else if (c.subtipo === 'master') classe = 'badge-master';
        } else {
            if (c.funcao === 'admin') classe = 'badge-admin';
            else if (c.funcao === 'diretor') classe = 'badge-diretor';
            else if (c.funcao === 'master') classe = 'badge-master';
        }
        return `<span class="badge ${classe}">${c.texto}</span>`;
    }

    function getHistoricoEdicoes(campo) {
        if (!osData.edicoes) return null;
        const e = osData.edicoes[campo];
        if (!e || e.length === 0) return null;
        return e;
    }
    function exibirHistoricoEdicao(campo) {
        const ed = getHistoricoEdicoes(campo);
        if (!ed) return '';
        const ultima = ed[ed.length - 1];
        if (!ultima) return '';
        return `<span class="edit-historico">(edit ${formatarDataHora(ultima.data)}: ${ultima.valor_antigo || ''})</span>`;
    }
    const prioridadeMap = { 'emergencial': '🔴 Emergencial', 'urgente': '🟡 Urgente', 'normal': '🟢 Normal' };
    function getValorExibicao(campo, valor) {
        if (campo === 'prioridade' && valor && prioridadeMap[valor]) return prioridadeMap[valor];
        return valor;
    }

    function podeEditarOS() {
        if (!osData) return false;
        const s = osData.status ? removerAcentos(osData.status.toLowerCase()) : '';
        if (s === 'concluida') return false;
        if (!currentUser) return false;
        if (currentUser.email === MASTER_EMAIL) return true;
        return false;
    }
    function isMaster() { return currentUser && currentUser.email === MASTER_EMAIL; }
    function podeConcluir() {
        if (!currentUserData) return false;
        const f = currentUserData.funcao;
        return f === 'diretor' || isMaster();
    }
    function podeReabrir() {
        if (!currentUserData) return false;
        const f = currentUserData.funcao;
        return f === 'diretor' || f === 'admin' || isMaster();
    }

    function extrairUidsDaOS(os) {
        const uids = new Set();
        if (os.aberto_por) uids.add(os.aberto_por);
        if (os.direcionado_para && !os.direcionado_para.startsWith('group:')) uids.add(os.direcionado_para);
        if (os.direcionado_para_original && !os.direcionado_para_original.startsWith('group:')) uids.add(os.direcionado_para_original);
        (os.historico || []).forEach(h => {
            if (h.usuario_uid) uids.add(h.usuario_uid);
            if (h.direcionado_para && !h.direcionado_para.startsWith('group:')) uids.add(h.direcionado_para);
        });
        return Array.from(uids).filter(Boolean);
    }

    async function buscarUsuariosPorUids(uids) {
        const resultado = {};
        if (!uids || uids.length === 0) return resultado;
        const lotes = [];
        for (let i = 0; i < uids.length; i += 10) {
            lotes.push(uids.slice(i, i + 10));
        }
        for (const lote of lotes) {
            const snap = await db.collection('usuarios')
                .where(firebase.firestore.FieldPath.documentId(), 'in', lote)
                .get();
            snap.forEach(doc => {
                const d = doc.data();
                resultado[doc.id] = { nome: d.nome, funcao: d.funcao };
            });
        }
        return resultado;
    }

    async function buscarAdminsEDiretores() {
        const resultado = {};
        const snap = await db.collection('usuarios').where('status', '==', 'ativo').get();
        snap.forEach(doc => {
            const d = doc.data();
            if (d.funcao === 'admin' || d.funcao === 'diretor') {
                resultado[doc.id] = { nome: d.nome, funcao: d.funcao };
            }
        });
        return resultado;
    }

    async function prepararUserMap(os) {
        const cache = lerUserMapDoCache();
        if (cache) {
            userMap = cache;
            return;
        }
        const uidsRelevantes = extrairUidsDaOS(os);
        const [relevantes, adminsDiretores] = await Promise.all([
            buscarUsuariosPorUids(uidsRelevantes),
            buscarAdminsEDiretores()
        ]);
        userMap = { ...relevantes, ...adminsDiretores };
        salvarUserMapNoCache(userMap);
    }

    function carregarOS() {
        if (!osId) return;
        historicoContainer.innerHTML = '<p>Carregando...</p>';
        db.collection('ordens_servico').doc(osId).get()
            .then(async (doc) => {
                if (!doc.exists) {
                    historicoContainer.innerHTML = '<p style="color:red;">OS não encontrada.</p>';
                    return;
                }
                osData = { id: doc.id, ...doc.data() };
                if (!osData.edicoes) osData.edicoes = {};
                await prepararUserMap(osData);
                renderizarDetalhe();
            })
            .catch(err => {
                console.error(err);
                historicoContainer.innerHTML = `<p style="color:red;">Erro ao carregar: ${err.message}</p>`;
            });
    }

    async function apagarAcao(dataISO) {
        if (!isMaster()) {
            alert('Apenas o master pode apagar ações.');
            return;
        }
        if (!confirm('Apagar esta ação? Esta operação não pode ser desfeita.')) return;

        const docRef = db.collection('ordens_servico').doc(osId);
        try {
            await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(docRef);
                if (!doc.exists) throw new Error('OS não encontrada.');
                const osAtual = doc.data();
                const historico = osAtual.historico || [];
                const idx = historico.findIndex(h => h.data === dataISO);
                if (idx === -1) throw new Error('Ação não encontrada.');
                historico.splice(idx, 1);

                const recalc = recalcularEstado(historico, osAtual);

                const upd = {
                    historico,
                    atualizado_em: new Date().toISOString(),
                    direcionado_para: recalc.dirPara,
                    direcionado_para_nome: recalc.dirNome,
                    direcionado_para_funcao: recalc.dirFuncao || '',
                    direcionado_em: recalc.dirEm
                };
                transaction.update(docRef, upd);
            });
            carregarOS();
        } catch (err) {
            console.error(err);
            alert('Erro ao apagar: ' + err.message);
        }
    }

    function iniciarEdicao(campo, campo2, valorAtual, btn) {
        if (editando.campo) cancelarEdicao();
        editando.campo = campo;
        editando.campo2 = campo2;
        editando.original = valorAtual;

        const displayEl = btn.closest('.info-value').querySelector('span[id^="display-"]');
        if (!displayEl) return;
        const container = displayEl.parentElement;
        displayEl.style.display = 'none';
        btn.style.display = 'none';

        let wrapper = document.createElement('span');
        wrapper.className = 'edit-field-wrapper';

        if (campo2) {
            const i1 = document.createElement('input');
            i1.type = 'text'; i1.placeholder = 'Quadra'; i1.value = osData[campo] || ''; i1.style.width = '60px';
            const i2 = document.createElement('input');
            i2.type = 'text'; i2.placeholder = 'Lote'; i2.value = osData[campo2] || ''; i2.style.width = '60px';
            const sb = document.createElement('button'); sb.textContent = 'Salvar'; sb.className = 'btn btn-sm btn-success';
            const cb = document.createElement('button'); cb.textContent = 'Cancelar'; cb.className = 'btn btn-sm btn-secondary';
            wrapper.appendChild(i1); wrapper.appendChild(i2); wrapper.appendChild(sb); wrapper.appendChild(cb);
            container.appendChild(wrapper);
            sb.addEventListener('click', () => {
                let n1 = i1.value.trim().toUpperCase();
                let n2 = i2.value.trim();
                if (n2) n2 = formatarLote(n2);
                if (n1 === osData[campo] && n2 === osData[campo2]) { cancelarEdicao(); return; }
                salvarEdicaoDupla(campo, campo2, osData[campo], osData[campo2], n1, n2);
            });
            cb.addEventListener('click', cancelarEdicao);
        } else {
            let input;
            if (campo === 'prioridade') {
                input = document.createElement('select');
                ['emergencial','urgente','normal'].forEach(opt => {
                    const o = document.createElement('option');
                    o.value = opt; o.textContent = opt;
                    if (opt === valorAtual) o.selected = true;
                    input.appendChild(o);
                });
            } else if (campo === 'tipo') {
                input = document.createElement('select');
                ['serviço','reclamação','infração','análise'].forEach(opt => {
                    const o = document.createElement('option');
                    o.value = opt; o.textContent = opt.charAt(0).toUpperCase() + opt.slice(1);
                    if (opt === valorAtual) o.selected = true;
                    input.appendChild(o);
                });
            } else if (campo === 'direcionado_para') {
                const sel = document.getElementById('acaoDirecionar');
                if (sel) {
                    input = document.createElement('select');
                    input.innerHTML = sel.innerHTML;
                    const opt = input.querySelector(`option[value="${osData.direcionado_para || ''}"]`);
                    if (opt) opt.selected = true;
                } else {
                    input = document.createElement('select');
                    input.innerHTML = `<option value="">Manter destino atual</option>
                        <option value="group:admin">${GRUPO_ADMIN_TEXTO}</option>
                        <option value="group:diretor">${GRUPO_DIRETOR_TEXTO}</option>`;
                }
            } else {
                input = document.createElement('input');
                input.type = 'text';
                input.value = valorAtual || '';
            }
            input.className = 'edit-field-input';
            input.style.minWidth = '150px';
            const sb = document.createElement('button'); sb.textContent = 'Salvar'; sb.className = 'btn btn-sm btn-success';
            const cb = document.createElement('button'); cb.textContent = 'Cancelar'; cb.className = 'btn btn-sm btn-secondary';
            wrapper.appendChild(input); wrapper.appendChild(sb); wrapper.appendChild(cb);
            container.appendChild(wrapper);

            sb.addEventListener('click', () => {
                let nv = input.tagName === 'SELECT' ? input.value : input.value.trim();
                if (campo === 'tipo' && nv) nv = nv.charAt(0).toUpperCase() + nv.slice(1);
                if (nv === '' && campo !== 'tipo' && campo !== 'prioridade' && campo !== 'direcionado_para') {
                    alert('O campo não pode ficar vazio.'); return;
                }
                if (nv === editando.original) { cancelarEdicao(); return; }
                salvarEdicao(campo, editando.original, nv);
            });
            cb.addEventListener('click', cancelarEdicao);
        }
        if (input && input.focus) input.focus();
    }

    function cancelarEdicao() {
        if (!editando.campo && !editando.campo2) return;
        const displayEl = document.getElementById(`display-${editando.campo || editando.campo2 || 'static'}`);
        if (displayEl) {
            displayEl.style.display = 'inline';
            const c = displayEl.parentElement;
            const w = c.querySelector('.edit-field-wrapper');
            if (w) w.remove();
            const b = c.querySelector('.btn-edit');
            if (b) b.style.display = 'inline-block';
        }
        editando = { campo: null, original: null };
    }

    function salvarEdicao(campo, valorAntigo, valorNovo) {
        if (campo === 'tipo' && valorNovo) valorNovo = valorNovo.charAt(0).toUpperCase() + valorNovo.slice(1);
        const upd = {};
        upd[campo] = valorNovo;

        if (campo === 'direcionado_para') {
            let nome = '', funcao = '';
            if (valorNovo === 'group:admin') { nome = GRUPO_ADMIN_TEXTO; funcao = 'admin'; }
            else if (valorNovo === 'group:diretor') { nome = GRUPO_DIRETOR_TEXTO; funcao = 'diretor'; }
            else {
                const u = userMap[valorNovo];
                if (u) { nome = u.nome; funcao = u.funcao; }
            }
            upd.direcionado_para_nome = nome || valorNovo;
            upd.direcionado_para_funcao = funcao || '';

            const catAtual = getCategoriaDestino(
                osData.direcionado_para,
                osData.direcionado_para_funcao,
                osData.direcionado_para_nome
            );
            const catNova = getCategoriaDestino(valorNovo, funcao, nome);
            if (catAtual !== catNova) {
                upd.direcionado_em = new Date().toISOString();
            }
        }

        const ed = osData.edicoes || {};
        if (!ed[campo]) ed[campo] = [];
        ed[campo].push({ data: new Date().toISOString(), valor_antigo: valorAntigo, valor_novo: valorNovo });
        upd.edicoes = ed;
        upd.atualizado_em = new Date().toISOString();

        db.collection('ordens_servico').doc(osId).update(upd)
            .then(() => {
                osData[campo] = valorNovo;
                osData.edicoes = ed;
                osData.atualizado_em = upd.atualizado_em;
                if (campo === 'direcionado_para') {
                    osData.direcionado_para_nome = upd.direcionado_para_nome;
                    osData.direcionado_para_funcao = upd.direcionado_para_funcao;
                    if (upd.direcionado_em) osData.direcionado_em = upd.direcionado_em;
                }
                cancelarEdicao();
                renderizarDetalhe();
            })
            .catch(err => alert('Erro ao salvar: ' + err.message));
    }

    function salvarEdicaoDupla(campo1, campo2, antigo1, antigo2, novo1, novo2) {
        if (novo2) novo2 = formatarLote(novo2);
        const upd = {};
        upd[campo1] = novo1;
        upd[campo2] = novo2;
        const ed = osData.edicoes || {};
        if (!ed[campo1]) ed[campo1] = [];
        ed[campo1].push({ data: new Date().toISOString(), valor_antigo: antigo1, valor_novo: novo1 });
        if (!ed[campo2]) ed[campo2] = [];
        ed[campo2].push({ data: new Date().toISOString(), valor_antigo: antigo2, valor_novo: novo2 });
        upd.edicoes = ed;
        upd.atualizado_em = new Date().toISOString();

        db.collection('ordens_servico').doc(osId).update(upd)
            .then(() => {
                osData[campo1] = novo1;
                osData[campo2] = novo2;
                osData.edicoes = ed;
                osData.atualizado_em = upd.atualizado_em;
                cancelarEdicao();
                renderizarDetalhe();
            })
            .catch(err => alert('Erro ao salvar: ' + err.message));
    }

    function popularDirecionamento() {
        const select = document.getElementById('acaoDirecionar');
        if (!select) return;
        select.innerHTML = '';
        const optDef = document.createElement('option');
        optDef.value = ''; optDef.textContent = 'Manter destino atual'; select.appendChild(optDef);

        const optGA = document.createElement('option');
        optGA.value = 'group:admin'; optGA.textContent = `GRUPO: ${GRUPO_ADMIN_TEXTO}`;
        optGA.style.backgroundColor = '#ffe082'; select.appendChild(optGA);

        const optGD = document.createElement('option');
        optGD.value = 'group:diretor'; optGD.textContent = `GRUPO: ${GRUPO_DIRETOR_TEXTO}`;
        optGD.style.backgroundColor = '#a5d6a7'; select.appendChild(optGD);

        const admins = [], diretores = [];
        Object.keys(userMap).forEach(uid => {
            const u = userMap[uid];
            if (u.funcao === 'admin') admins.push({ uid, nome: u.nome });
            else if (u.funcao === 'diretor') diretores.push({ uid, nome: u.nome });
        });
        admins.sort((a,b) => a.nome.localeCompare(b.nome));
        diretores.sort((a,b) => a.nome.localeCompare(b.nome));

        admins.forEach(a => {
            const o = document.createElement('option');
            o.value = a.uid; o.textContent = `${a.nome} (admin)`;
            o.style.backgroundColor = '#ffe082'; select.appendChild(o);
        });
        diretores.forEach(d => {
            const o = document.createElement('option');
            o.value = d.uid; o.textContent = `${d.nome} (diretor)`;
            o.style.backgroundColor = '#a5d6a7'; select.appendChild(o);
        });
    }

    async function adicionarAcao(descricao, direcionarPara) {
        const agora = new Date().toISOString();
        const docRef = db.collection('ordens_servico').doc(osId);

        try {
            const resultado = await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(docRef);
                if (!doc.exists) throw new Error('OS não encontrada.');
                const dataAtual = doc.data();
                const historico = dataAtual.historico || [];

                const novaAcao = {
                    data: agora, acao: 'ação',
                    usuario_uid: currentUser.uid,
                    usuario: currentUserData?.nome || 'Usuário',
                    mensagem: descricao
                };

                let mudouCategoria = false;
                if (direcionarPara) {
                    novaAcao.direcionado_para = direcionarPara;
                    if (direcionarPara === 'group:admin') {
                        novaAcao.direcionado_para_nome = GRUPO_ADMIN_TEXTO;
                        novaAcao.direcionado_para_funcao = 'admin';
                    } else if (direcionarPara === 'group:diretor') {
                        novaAcao.direcionado_para_nome = GRUPO_DIRETOR_TEXTO;
                        novaAcao.direcionado_para_funcao = 'diretor';
                    } else if (userMap[direcionarPara]) {
                        novaAcao.direcionado_para_nome = userMap[direcionarPara].nome;
                        novaAcao.direcionado_para_funcao = userMap[direcionarPara].funcao;
                    }

                    const catAtual = getCategoriaDestino(
                        dataAtual.direcionado_para,
                        dataAtual.direcionado_para_funcao,
                        dataAtual.direcionado_para_nome
                    );
                    const catNova = getCategoriaDestino(
                        direcionarPara,
                        novaAcao.direcionado_para_funcao,
                        novaAcao.direcionado_para_nome
                    );
                    mudouCategoria = (catAtual !== catNova);
                }

                historico.push(novaAcao);

                const upd = { historico, atualizado_em: agora };
                if (direcionarPara) {
                    upd.direcionado_para = direcionarPara;
                    upd.direcionado_para_nome = novaAcao.direcionado_para_nome;
                    upd.direcionado_para_funcao = novaAcao.direcionado_para_funcao || '';
                    if (mudouCategoria) {
                        upd.direcionado_em = agora;
                    }
                }
                transaction.update(docRef, upd);
                return { historico, upd, mudouCategoria };
            });

            osData.historico = resultado.historico;
            if (direcionarPara) {
                osData.direcionado_para = resultado.upd.direcionado_para;
                osData.direcionado_para_nome = resultado.upd.direcionado_para_nome;
                osData.direcionado_para_funcao = resultado.upd.direcionado_para_funcao;
                if (resultado.mudouCategoria && resultado.upd.direcionado_em) {
                    osData.direcionado_em = resultado.upd.direcionado_em;
                }
            }
            osData.atualizado_em = agora;

            document.getElementById('acaoDescricao').value = '';
            document.getElementById('acaoDirecionar').value = '';
            mostrarMensagemAcao('✅ Ação adicionada com sucesso!', 'success');
            renderizarDetalhe();
            setTimeout(esconderMensagemAcao, 3000);
        } catch (err) {
            console.error(err);
            mostrarMensagemAcao('Erro: ' + err.message, 'error');
        }
    }

    function mostrarMensagemAcao(texto, tipo) {
        const el = document.getElementById('acaoMessage');
        if (!el) return;
        el.textContent = texto;
        el.className = 'message ' + tipo;
        el.style.display = 'block';
    }
    function esconderMensagemAcao() {
        const el = document.getElementById('acaoMessage');
        if (el) el.style.display = 'none';
    }

    async function concluirOS() {
        if (!confirm('Deseja concluir esta OS?')) return;
        const agora = new Date().toISOString();
        const docRef = db.collection('ordens_servico').doc(osId);
        try {
            const resultado = await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(docRef);
                if (!doc.exists) throw new Error('OS não encontrada.');
                const historico = doc.data().historico || [];
                historico.push({
                    data: agora, acao: 'conclusão',
                    usuario_uid: currentUser.uid,
                    usuario: currentUserData?.nome || 'Usuário',
                    mensagem: 'OS concluída'
                });
                transaction.update(docRef, { status: 'concluida', historico, atualizado_em: agora });
                return historico;
            });
            osData.status = 'concluida';
            osData.historico = resultado;
            osData.atualizado_em = agora;
            renderizarDetalhe();
        } catch (err) { alert('Erro: ' + err.message); }
    }

    async function reabrirOS() {
        if (!confirm('Deseja reabrir esta OS?')) return;
        const agora = new Date().toISOString();
        const docRef = db.collection('ordens_servico').doc(osId);
        try {
            const resultado = await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(docRef);
                if (!doc.exists) throw new Error('OS não encontrada.');
                const historico = doc.data().historico || [];
                historico.push({
                    data: agora, acao: 'reabertura',
                    usuario_uid: currentUser.uid,
                    usuario: currentUserData?.nome || 'Usuário',
                    mensagem: 'OS reaberta'
                });
                transaction.update(docRef, { status: 'em_andamento', historico, atualizado_em: agora });
                return historico;
            });
            osData.status = 'em_andamento';
            osData.historico = resultado;
            osData.atualizado_em = agora;
            renderizarDetalhe();
        } catch (err) { alert('Erro: ' + err.message); }
    }

    function init() {
        const params = new URLSearchParams(window.location.search);
        osId = params.get('id');
        if (!osId) {
            historicoContainer.innerHTML = '<p style="color:red;">ID da OS não fornecido.</p>';
            return;
        }
        auth.onAuthStateChanged((user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            currentUser = user;
            registrarAtividade();
            iniciarMonitorTimeout();

            db.collection('usuarios').doc(user.uid).get()
                .then(doc => {
                    if (doc.exists) currentUserData = doc.data();
                    else currentUserData = { nome: user.displayName || 'Usuário', funcao: 'tecnico' };

                    let f = currentUserData.funcao || 'tecnico';
                    if (user.email === MASTER_EMAIL) f = 'master';
                    atualizarHeader(currentUserData.nome || user.displayName || user.email, f);

                    carregarOS();
                })
                .catch(() => {
                    currentUserData = { nome: user.displayName || 'Usuário', funcao: 'tecnico' };
                    const f = user.email === MASTER_EMAIL ? 'master' : 'tecnico';
                    atualizarHeader(user.displayName || user.email, f);
                    carregarOS();
                });
        });
    }

    init();
</script>
