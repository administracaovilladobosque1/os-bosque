<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .header {
      background: #2e7d32;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .logo {
      max-width: 120px;
      display: block;
      margin: 0 auto 10px;
    }

    .container {
      padding: 15px;
    }

    .user {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    .voltar {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      border: none;
      background: #555;
      color: white;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="header">
    <img src="assets/logo.png" class="logo">
    <h2>Usuários</h2>
  </div>

  <div class="container">
    <div id="lista">Carregando usuários...</div>

    <button class="voltar" onclick="voltar()">Voltar</button>
  </div>

  <script type="module">

    import { auth, db } from "/js/firebase-config-bosque.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    import {
      collection,
      getDocs,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const lista = document.getElementById("lista");

    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      try {

        const snapshot = await getDocs(collection(db, "users"));

        lista.innerHTML = "";

        snapshot.forEach(docSnap => {

          const data = docSnap.data();

          lista.innerHTML += `
            <div class="user">
              <b>${data.nome}</b><br>
              ${data.email}<br><br>

              Perfil:
              <select onchange="alterarPerfil('${docSnap.id}', this.value)">
                <option value="morador" ${data.perfil === "morador" ? "selected" : ""}>Morador</option>
                <option value="diretor" ${data.perfil === "diretor" ? "selected" : ""}>Diretor</option>
                <option value="admin" ${data.perfil === "admin" ? "selected" : ""}>Admin</option>
                <option value="master" ${data.perfil === "master" ? "selected" : ""}>Master</option>
              </select>
            </div>
          `;
        });

      } catch (error) {
        console.error(error);
        lista.innerHTML = "Erro ao carregar usuários.";
      }

    });

    window.alterarPerfil = async function(id, perfil) {
      try {
        await updateDoc(doc(db, "users", id), { perfil });
        alert("Perfil atualizado");
      } catch (error) {
        console.error(error);
        alert("Erro ao atualizar perfil");
      }
    };

    window.voltar = function() {
      window.location.href = "dashboard.html";
    };

  </script>

</body>
</html>
