<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Gerenciar Personagens - Villa do Bosque</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Calibri', 'Segoe UI', Tahoma, sans-serif; }
        body { background: #e8f5e9; padding: 16px 12px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: #fff; max-width: 1000px; width: 100%; padding: 18px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,80,0,0.12); border: 1px solid #a5d6a7; }

        .user-header {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #1b5e20;
        }
        .user-header .uh-label { font-weight: 500; color: #558b2f; }
        .uh-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #000;
            white-space: nowrap;
        }
        .uh-badge.master { background: #ffcc80; }
        .uh-badge.admin { background: #ffe082; }
        .uh-badge.diretor { background: #a5d6a7; }
        .uh-badge.tecnico { background: #ced4da; }

        .page-title { font-size: 24px; color: #1b5e20; background: #c8e6c9; display: inline-block; padding: 4px 18px; border-radius: 30px; margin-bottom: 12px; }
        .btn { padding: 8px 16px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn:hover { background: #1b5e20; }
        .btn-success { background: #388e3c; }
        .btn-success:hover { background: #2e7d32; }
        .btn-danger { background: #c62828; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-warning { background: #f0ad4e; color: #000; }
        .btn-warning:hover { background: #ec971f; }
        .btn-voltar { background: #558b2f; }
        .btn-voltar:hover { background: #33691e; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; font-size: 13px; color: #1b5e20; margin-bottom: 2px; }
        input, select { width: 100%; padding: 6px 10px; border: 1px solid #a5d6a7; border-radius: 6px; font-size: 14px; background: #fafffe; }
        input:focus, select:focus { outline: none; border-color: #2e7d32; box-shadow: 0 0 0 2px rgba(46,125,50,0.15); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .message { margin-top: 12px; padding: 8px; border-radius: 6px; display: none; font-size: 13px; }
        .message.error { display: block; background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
        .message.success { display: block; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
        .table-responsive { overflow-x: auto; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 500px; }
        th { background: #c8e6c9; padding: 8px; text-align: left; color: #1b5e20; border-bottom: 2px solid #81c784; }
        td { padding: 8px; border-bottom: 1px solid #c8e6c9; vertical-align: middle; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .badge-master { background: #ffcc80; color: #4e342e; }
        .badge-admin { background: #ffe082; color: #4e342e; }
        .badge-diretor { background: #a5d6a7; color: #1b5e20; }
        .badge-ativo { background: #c8e6c9; color: #1b5e20; }
        .badge-inativo { background: #ffcdd2; color: #b71c1c; }
        @media (max-width: 600px) {
            .container { padding: 14px; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .page-title { font-size: 20px; }
            table { font-size: 13px; min-width: 400px; }
            th, td { padding: 6px; }
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff; max-width: 450px; width: 90%;
            padding: 25px; border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            border: 1px solid #a5d6a7;
        }
        .modal-box h2 { color: #1b5e20; margin-bottom: 16px; font-size: 22px; border-bottom: 2px solid #c8e6c9; padding-bottom: 8px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
        .modal-actions .btn { width: auto; }
    </style>
</head>
<body>
<div class="container">
    <div class="user-header" id="userHeader">
        <span class="uh-label">Logado como:</span>
        <span class="uh-badge master" id="userHeaderBadge">—</span>
    </div>

    <h1 class="page-title">👥 Gerenciar Personagens</h1>
    <a href="index.html" class="btn btn-voltar" style="margin-bottom:12px;">← Voltar ao Painel</a>

    <h2 style="color:#2e7d32; margin:12px 0 10px;">➕ Novo Personagem</h2>
    <form id="personagemForm">
        <div class="form-row">
            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" id="nome" placeholder="Nome" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="email@dominio.com" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Posição</label>
                <select id="funcao" required>
                    <option value="admin">Administrador</option>
                    <option value="diretor">Diretor</option>
                    <option value="master">Master</option>
                </select>
            </div>
            <div class="form-group">
                <label>Senha (mínimo 6 caracteres)</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>
        </div>
        <div class="form-group">
            <label>Status</label>
            <select id="status" required>
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Cadastrar Personagem</button>
        <div id="formMessage" class="message"></div>
    </form>

    <h2 style="color:#2e7d32; margin-top:30px;">📋 Personagens Cadastrados</h2>
    <div id="listaContainer"><p>Carregando...</p></div>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <h2>✏️ Editar Personagem</h2>
        <form id="editForm">
            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" id="editNome" required>
            </div>
            <div class="form-group">
                <label>Função</label>
                <select id="editFuncao" required>
                    <option value="admin">Administrador</option>
                    <option value="diretor">Diretor</option>
                    <option value="master">Master</option>
                </select>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="editStatus" required>
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                <button type="submit" class="btn btn-success">Salvar</button>
            </div>
            <div id="editMessage" class="message"></div>
        </form>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDx_6oWO30Drh8GkuQA9jk2Oym7H8J3ABg",
        authDomain: "villa-bosque1.firebaseapp.com",
        projectId: "villa-bosque1",
        storageBucket: "villa-bosque1.firebasestorage.app",
        messagingSenderId: "372474036025",
        appId: "1:372474036025:web:bbbee10723469d77cbb2e8"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    db.enablePersistence({ synchronizeTabs: true }).catch(err => {
        if (err.code === 'failed-precondition') console.warn('Persistência: múltiplas abas abertas.');
        else if (err.code === 'unimplemented') console.warn('Persistência: navegador não suporta.');
    });

    const MASTER_EMAIL = 'administracaovilladobosque@gmail.com';
    const TIMEOUT_MS = 4 * 60 * 60 * 1000;
    const TIMEOUT_KEY = 'vb_lastActivity';
    const TIMEOUT_CHECK_INTERVAL = 30 * 1000;

    const USER_CACHE_KEY = 'vb_userMapCache';

    let currentUser = null;
    let currentUserData = null;

    function limparCacheUserMap() {
        try { sessionStorage.removeItem(USER_CACHE_KEY); } catch(e) {}
    }

    function registrarAtividade() { try { localStorage.setItem(TIMEOUT_KEY, Date.now().toString()); } catch(e) {} }
    function fazerLogoutTimeout() {
        if (window.__fazendoLogout) return;
        window.__fazendoLogout = true;
        try { localStorage.removeItem(TIMEOUT_KEY); localStorage.removeItem('vb_userLoggedIn'); sessionStorage.clear(); } catch(e) {}
        auth.signOut().finally(() => {
            alert('Sessão expirada por inatividade. Faça login novamente.');
            window.location.href = 'index.html';
        });
    }
    function fazerLogoutInativo() {
        if (window.__fazendoLogout) return;
        window.__fazendoLogout = true;
        try { localStorage.removeItem(TIMEOUT_KEY); localStorage.removeItem('vb_userLoggedIn'); sessionStorage.clear(); } catch(e) {}
        auth.signOut().finally(() => {
            alert('Sua conta está inativa. Entre em contato com o administrador.');
            window.location.href = 'index.html';
        });
    }
    function verificarTimeoutAgora() {
        const last = parseInt(localStorage.getItem(TIMEOUT_KEY) || '0', 10);
        if (!last) return false;
        if ((Date.now() - last) > TIMEOUT_MS) { fazerLogoutTimeout(); return true; }
        return false;
    }
    function iniciarMonitorTimeout() {
        if (verificarTimeoutAgora()) return;
        if (!localStorage.getItem(TIMEOUT_KEY)) registrarAtividade();
        ['click','mousemove','keydown','scroll','touchstart'].forEach(ev => {
            document.addEventListener(ev, registrarAtividade, { passive: true });
        });
        setInterval(verificarTimeoutAgora, TIMEOUT_CHECK_INTERVAL);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') verificarTimeoutAgora();
        });
    }

    const form = document.getElementById('personagemForm');
    const nomeInput = document.getElementById('nome');
    const emailInput = document.getElementById('email');
    const funcaoSelect = document.getElementById('funcao');
    const senhaInput = document.getElementById('senha');
    const statusSelect = document.getElementById('status');
    const formMsg = document.getElementById('formMessage');
    const listaDiv = document.getElementById('listaContainer');

    const modal = document.getElementById('editModal');
    const editNome = document.getElementById('editNome');
    const editFuncao = document.getElementById('editFuncao');
    const editStatus = document.getElementById('editStatus');
    const editForm = document.getElementById('editForm');
    const editMsg = document.getElementById('editMessage');
    let editUid = null;

    const userHeaderBadge = document.getElementById('userHeaderBadge');

    function atualizarHeader(nome, funcao) {
        const f = funcao || 'master';
        userHeaderBadge.className = 'uh-badge ' + f;
        userHeaderBadge.textContent = `${nome || 'Usuário'} (${f})`;
    }

    function ehMaster(user, userData) {
        if (!user) return false;
        if (user.email === MASTER_EMAIL) return true;
        if (userData && userData.funcao === 'master') return true;
        return false;
    }

    function abrirModal(uid, nome, funcao, status) {
        editUid = uid;
        editNome.value = nome || '';
        editFuncao.value = funcao || 'admin';
        editStatus.value = status || 'ativo';
        editMsg.className = 'message';
        editMsg.textContent = '';
        modal.classList.add('active');
    }
    function fecharModal() {
        modal.classList.remove('active');
        editUid = null;
        editForm.reset();
    }

    editForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!editUid) return;
        const nome = editNome.value.trim();
        const funcao = editFuncao.value;
        const status = editStatus.value;
        if (!nome) { showMessage(editMsg, 'O nome não pode ficar vazio.', 'error'); return; }
        db.collection('usuarios').doc(editUid).update({ nome, funcao, status })
            .then(() => {
                limparCacheUserMap();
                showMessage(editMsg, '✅ Personagem atualizado com sucesso!', 'success');
                fecharModal();
                carregarLista();
            })
            .catch(err => showMessage(editMsg, 'Erro: ' + err.message, 'error'));
    });

    // ============================================================
    // ORDENAÇÃO DA LISTA
    // ============================================================
    // 1º critério: status (ativo antes de inativo)
    // 2º critério: função (alfabética)
    // 3º critério: nome (alfabético)
    function ordenarLista(lista) {
        return lista.sort((a, b) => {
            // 1) Status — ativo antes de inativo
            const statusA = (a.status || 'ativo').toLowerCase();
            const statusB = (b.status || 'ativo').toLowerCase();
            if (statusA !== statusB) {
                if (statusA === 'ativo') return -1;
                if (statusB === 'ativo') return 1;
                return statusA.localeCompare(statusB);
            }

            // 2) Função — alfabética
            const funcaoA = (a.funcao || 'tecnico').toLowerCase();
            const funcaoB = (b.funcao || 'tecnico').toLowerCase();
            if (funcaoA !== funcaoB) return funcaoA.localeCompare(funcaoB);

            // 3) Nome — alfabético
            const nomeA = (a.nome || '').toLowerCase();
            const nomeB = (b.nome || '').toLowerCase();
            return nomeA.localeCompare(nomeB);
        });
    }

    function carregarLista() {
        listaDiv.innerHTML = '<p>Carregando...</p>';
        db.collection('usuarios').get()
            .then(snapshot => {
                if (snapshot.empty) { listaDiv.innerHTML = '<p>Nenhum personagem cadastrado.</p>'; return; }

                const lista = [];
                snapshot.forEach(doc => {
                    lista.push({ id: doc.id, ...doc.data() });
                });

                ordenarLista(lista);

                let html = `<div class="table-responsive"><table>
                    <thead><tr><th>Nome</th><th>E-mail</th><th>Função</th><th>Status</th><th>Ações</th></tr></thead><tbody>`;

                lista.forEach(data => {
                    const uid = data.id;
                    const isMasterHardcoded = (data.email === MASTER_EMAIL);
                    const funcao = data.funcao || 'tecnico';
                    const rc = funcao === 'master' ? 'badge-master' : (funcao === 'admin' ? 'badge-admin' : 'badge-diretor');
                    const sc = data.status === 'ativo' ? 'badge-ativo' : 'badge-inativo';
                    html += `
                        <tr>
                            <td><strong>${data.nome || 'Sem nome'}</strong></td>
                            <td>${data.email}</td>
                            <td><span class="badge ${rc}">${funcao}</span></td>
                            <td><span class="badge ${sc}">${data.status || 'ativo'}</span></td>
                            <td>
                                ${!isMasterHardcoded ? `
                                    <button class="btn btn-sm btn-warning" onclick="abrirModal('${uid}','${data.nome || ''}','${funcao}','${data.status || 'ativo'}')">✏️ Editar</button>
                                    <button class="btn btn-sm btn-secondary" onclick="toggleStatus('${uid}','${data.status}')">
                                        ${data.status === 'ativo' ? 'Inativar' : 'Ativar'}
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="excluir('${uid}')">Excluir</button>
                                ` : '<span style="color:#6c757d;">Protegido</span>'}
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div>`;
                listaDiv.innerHTML = html;
            })
            .catch(err => { listaDiv.innerHTML = `<p style="color:red;">Erro ao carregar: ${err.message}</p>`; });
    }

    window.toggleStatus = function(uid, currentStatus) {
        const novo = currentStatus === 'ativo' ? 'inativo' : 'ativo';
        if (!confirm(`Deseja ${novo === 'ativo' ? 'ativar' : 'inativar'} este usuário?`)) return;
        db.collection('usuarios').doc(uid).update({ status: novo })
            .then(() => {
                limparCacheUserMap();
                alert(`Status alterado para ${novo}.`);
                carregarLista();
            })
            .catch(err => alert('Erro: ' + err.message));
    };
    window.excluir = function(uid) {
        if (!confirm('Excluir este personagem do sistema? (A conta de autenticação continuará, mas o vínculo será removido)')) return;
        db.collection('usuarios').doc(uid).delete()
            .then(() => {
                limparCacheUserMap();
                alert('Personagem removido do Firestore.');
                carregarLista();
            })
            .catch(err => alert('Erro: ' + err.message));
    };

    // ============================================================
    // CADASTRAR PERSONAGEM — via REST API do Firebase Auth
    // ============================================================
    async function criarContaAuth(email, senha) {
        const url = `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${firebaseConfig.apiKey}`;
        const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password: senha, returnSecureToken: true })
        });
        const data = await resp.json();
        if (data.error) {
            const erro = new Error(data.error.message || 'Erro ao criar conta');
            erro.code = data.error.message || 'unknown';
            throw erro;
        }
        return data.localId;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nome = nomeInput.value.trim();
        const email = emailInput.value.trim();
        const funcao = funcaoSelect.value;
        const senha = senhaInput.value;
        const status = statusSelect.value;

        if (!nome || !email || !senha) {
            showMessage(formMsg, 'Preencha todos os campos.', 'error'); return;
        }
        if (senha.length < 6) {
            showMessage(formMsg, 'A senha do novo personagem deve ter pelo menos 6 caracteres.', 'error'); return;
        }

        if (!ehMaster(currentUser, currentUserData)) {
            showMessage(formMsg, 'Apenas o Master pode cadastrar personagens.', 'error'); return;
        }

        const btnSubmit = form.querySelector('button[type="submit"]');
        const textoOriginal = btnSubmit.textContent;
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Cadastrando...';

        try {
            const novoUid = await criarContaAuth(email, senha);
            await db.collection('usuarios').doc(novoUid).set({
                nome, email, funcao, status,
                criado_por: currentUser.uid,
                criado_em: firebase.firestore.FieldValue.serverTimestamp()
            });

            limparCacheUserMap();
            showMessage(formMsg, 'Personagem cadastrado com sucesso!', 'success');
            form.reset();
            carregarLista();
        } catch (error) {
            console.error('Erro ao cadastrar personagem:', error);

            let msg = 'Erro ao cadastrar personagem.';
            const code = (error.code || error.message || '').toString().toUpperCase();

            if (code.includes('EMAIL_EXISTS')) msg = 'E-mail já em uso.';
            else if (code.includes('WEAK_PASSWORD')) msg = 'A senha do novo personagem é muito fraca (mínimo 6 caracteres).';
            else if (code.includes('INVALID_EMAIL')) msg = 'E-mail inválido.';
            else if (code.includes('TOO_MANY_ATTEMPTS')) msg = 'Muitas tentativas. Aguarde um momento.';
            else if (code.includes('OPERATION_NOT_ALLOWED')) msg = 'O cadastro por e-mail/senha está desabilitado no Firebase.';
            else if (error.message) msg = 'Erro: ' + error.message;

            showMessage(formMsg, msg, 'error');
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.textContent = textoOriginal;
        }
    });

    function showMessage(el, text, type) { el.textContent = text; el.className = 'message ' + type; }

    // ============================================================
    // AUTENTICAÇÃO E GATE DE ACESSO
    // ============================================================
    auth.onAuthStateChanged((user) => {
        if (!user) { window.location.href = 'index.html'; return; }

        currentUser = user;
        registrarAtividade();
        iniciarMonitorTimeout();

        db.collection('usuarios').doc(user.uid).get()
            .then(doc => {
                const data = doc.exists ? doc.data() : {};

                if (user.email !== MASTER_EMAIL && data.status && data.status !== 'ativo') {
                    fazerLogoutInativo();
                    return;
                }

                if (!ehMaster(user, data)) {
                    alert('Apenas o Master pode acessar esta página.');
                    window.location.href = 'index.html';
                    return;
                }

                currentUserData = data;
                const nomeExib = data.nome || user.displayName || 'Master';
                atualizarHeader(nomeExib, 'master');
                carregarLista();
            })
            .catch(() => {
                if (user.email !== MASTER_EMAIL) {
                    alert('Apenas o Master pode acessar esta página.');
                    window.location.href = 'index.html';
                    return;
                }
                atualizarHeader('Master', 'master');
                carregarLista();
            });
    });
</script>
</body>
</html>
