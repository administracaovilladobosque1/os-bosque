<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>
</head>

<body>

<h2>Cadastro</h2>

<input id="email" placeholder="Email"><br><br>
<input id="senha" type="password" placeholder="Senha"><br><br>

<button id="cadastrar">Cadastrar</button>

<script type="module">

import { auth, db } from "./js/firebase-config-bosque.js";

import {
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  collection,
  query,
  where,
  getDocs,
  setDoc,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

cadastrar.onclick = async () => {

  const q = query(
    collection(db, "convites"),
    where("email", "==", email.value),
    where("usado", "==", false)
  );

  const snap = await getDocs(q);

  if (snap.empty) {
    alert("Sem autorização");
    return;
  }

  const convite = snap.docs[0];

  const user = await createUserWithEmailAndPassword(auth, email.value, senha.value);

  await setDoc(doc(db, "users", user.user.uid), {
    email: email.value,
    roles: ["morador"],
    createdAt: new Date()
  });

  await updateDoc(convite.ref, { usado: true });

  alert("Cadastro concluído");
  location.href = "login.html";

};

</script>

</body>
</html>
