<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Abrir OS - Villa do Bosque</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Calibri', 'Segoe UI', Tahoma, sans-serif; }
        body { background: #e8f5e9; padding: 20px 15px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: #fff; max-width: 800px; width: 100%; padding: 30px 25px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,80,0,0.15); border: 1px solid #a5d6a7; }
        .logo-area { text-align: center; margin-bottom: 20px; }
        .logo-area img { max-width: 120px; height: auto; }
        .logo-area h1 { font-size: 28px; color: #1b5e20; background: #c8e6c9; display: inline-block; padding: 6px 20px; border-radius: 30px; }
        .btn { padding: 12px 20px; background: #2e7d32; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #1b5e20; }
        .btn-success { background: #388e3c; }
        .btn-success:hover { background: #2e7d32; }
        .btn-voltar { background: #558b2f; margin-bottom: 20px; }
        .btn-voltar:hover { background: #33691e; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; font-size: 14px; color: #1b5e20; margin-bottom: 4px; }
        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #a5d6a7;
            border-radius: 10px;
            font-size: 16px;
            background: #fafffe;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46,125,50,0.2);
        }
        textarea { resize: vertical; min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .message { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; }
        .message.error { display: block; background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
        .message.success { display: block; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }

        /* Diferenciação visual para os grupos no select */
        select option.grupo {
            background-color: #fff3cd;  /* amarelo claro */
            font-weight: 600;
        }
        select option.personagem {
            background-color: #ffffff;
        }

        @media (max-width: 600px) {
            .container { padding: 20px 15px; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-area">
        <img src="logo.png" alt="Logo Villa do Bosque" style="max-width:100px;">
        <h1>📝 Nova Ordem de Serviço</h1>
        <a href="index.html" class="btn btn-voltar" style="display:inline-block; margin-top:10px; text-decoration:none;">← Voltar ao Painel</a>
    </div>

    <form id="osForm">
        <div class="form-group">
            <label>Título da OS</label>
            <input type="text" id="titulo" placeholder="Ex: Excesso velocidade" required>
        </div>
        <div class="form-group">
            <label>Descrição / Relato</label>
            <textarea id="descricao" placeholder="Descreva o problema ou solicitação..." required></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Quadra (opcional)</label>
                <input type="text" id="quadra" placeholder="Ex: C">
            </div>
            <div class="form-group">
                <label>Lote (opcional)</label>
                <input type="text" id="lote" placeholder="Ex: 09">
            </div>
        </div>
        <div class="form-group">
            <label>Direcionar para</label>
            <select id="direcionarPara" required>
                <option value="">Selecione...</option>
                <!-- Os grupos serão inseridos com a classe "grupo" -->
                <option value="grupo_admin" class="grupo">👥 Grupo: Administradores</option>
                <option value="grupo_diretor" class="grupo">👥 Grupo: Diretores</option>
                <!-- Os personagens serão inseridos dinamicamente com a classe "personagem" -->
            </select>
        </div>
        <div class="form-group">
            <label>Prioridade</label>
            <select id="prioridade" required>
                <option value="emergencial">🔴 Emergencial (resolver hoje)</option>
                <option value="urgente">🟠 Urgente (resolver logo)</option>
                <option value="normal">🟢 Normal (resolver)</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Abrir OS</button>
        <div id="formMessage" class="message"></div>
    </form>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDx_6oWO30Drh8GkuQA9jk2Oym7H8J3ABg",
        authDomain: "villa-bosque1.firebaseapp.com",
        projectId: "villa-bosque1",
        storageBucket: "villa-bosque1.firebasestorage.app",
        messagingSenderId: "372474036025",
        appId: "1:372474036025:web:bbbee10723469d77cbb2e8"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const form = document.getElementById('osForm');
    const titulo = document.getElementById('titulo');
    const descricao = document.getElementById('descricao');
    const quadra = document.getElementById('quadra');
    const lote = document.getElementById('lote');
    const direcionarPara = document.getElementById('direcionarPara');
    const prioridade = document.getElementById('prioridade');
    const formMsg = document.getElementById('formMessage');

    let personagens = [];

    // Carregar personagens ativos para o select
    function carregarPersonagens() {
        db.collection('usuarios')
            .where('status', '==', 'ativo')
            .get()
            .then(snapshot => {
                personagens = [];
                // Remove opções antigas de personagens (mantém os grupos)
                document.querySelectorAll('option.personagem').forEach(el => el.remove());

                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Não adicionar o próprio Master como opção de direcionamento (opcional)
                    // Se quiser incluir o Master, remova o filtro abaixo.
                    if (data.email === 'administracaovilladobosque@gmail.com') return;
                    personagens.push({
                        uid: doc.id,
                        nome: data.nome,
                        email: data.email,
                        funcao: data.funcao
                    });
                });

                // Adiciona os personagens com a classe "personagem"
                personagens.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.uid;
                    opt.textContent = `👤 ${p.nome} (${p.funcao})`;
                    opt.className = 'personagem';
                    direcionarPara.appendChild(opt);
                });
            })
            .catch(err => console.error('Erro ao carregar personagens:', err));
    }

    // Gerar número sequencial da OS
    async function gerarNumeroOS() {
        const snapshot = await db.collection('ordens_servico')
            .orderBy('numero', 'desc')
            .limit(1)
            .get();
        if (snapshot.empty) return 1;
        const last = snapshot.docs[0].data().numero || 0;
        return last + 1;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const tituloVal = titulo.value.trim();
        const descricaoVal = descricao.value.trim();
        const quadraVal = quadra.value.trim();
        const loteVal = lote.value.trim();
        const direcionarVal = direcionarPara.value;
        const prioridadeVal = prioridade.value;

        if (!tituloVal || !descricaoVal || !direcionarVal) {
            showMessage(formMsg, 'Preencha todos os campos obrigatórios.', 'error');
            return;
        }

        const user = auth.currentUser;
        if (!user) {
            showMessage(formMsg, 'Você precisa estar logado.', 'error');
            return;
        }

        // Buscar nome do usuário atual
        let nomeAbertoPor = user.displayName || 'Usuário';
        try {
            const doc = await db.collection('usuarios').doc(user.uid).get();
            if (doc.exists) nomeAbertoPor = doc.data().nome || nomeAbertoPor;
        } catch (e) {}

        // Determinar direcionamento
        let direcionadoPara = '';
        let direcionadoParaTipo = '';
        let direcionadoParaId = '';
        if (direcionarVal === 'grupo_admin') {
            direcionadoPara = 'Administradores';
            direcionadoParaTipo = 'grupo';
        } else if (direcionarVal === 'grupo_diretor') {
            direcionadoPara = 'Diretores';
            direcionadoParaTipo = 'grupo';
        } else {
            const p = personagens.find(p => p.uid === direcionarVal);
            if (p) {
                direcionadoPara = p.nome;
                direcionadoParaTipo = 'personagem';
                direcionadoParaId = p.uid;
            } else {
                showMessage(formMsg, 'Personagem não encontrado.', 'error');
                return;
            }
        }

        const numero = await gerarNumeroOS();

        const dadosOS = {
            numero: numero,
            titulo: tituloVal,
            descricao: descricaoVal,
            quadra: quadraVal || null,
            lote: loteVal || null,
            prioridade: prioridadeVal,
            status: 'aberta',
            aberto_por: user.uid,
            aberto_por_nome: nomeAbertoPor,
            direcionado_para: direcionadoPara,
            direcionado_para_tipo: direcionadoParaTipo,
            direcionado_para_id: direcionadoParaId,
            criado_em: firebase.firestore.FieldValue.serverTimestamp(),
            historico: [{
                tipo: 'abertura',
                data: firebase.firestore.FieldValue.serverTimestamp(),
                autor: user.uid,
                autor_nome: nomeAbertoPor,
                acao: 'abertura',
                descricao: `OS aberta por ${nomeAbertoPor}. Relato: ${descricaoVal}`
            }],
            tempo_aberto: 0,
            tempo_parado: 0
        };

        try {
            await db.collection('ordens_servico').add(dadosOS);
            showMessage(formMsg, `OS #${numero} aberta com sucesso!`, 'success');
            form.reset();
            setTimeout(() => {
                window.location.href = 'os-list.html';
            }, 2000);
        } catch (error) {
            showMessage(formMsg, 'Erro ao abrir OS: ' + error.message, 'error');
        }
    });

    function showMessage(el, text, type) { el.textContent = text; el.className = 'message ' + type; }

    auth.onAuthStateChanged((user) => {
        if (user) {
            carregarPersonagens();
        } else {
            window.location.href = 'index.html';
        }
    });
</script>
</body>
</html>
