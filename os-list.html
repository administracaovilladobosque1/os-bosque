<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Ordens de Serviço - Villa do Bosque</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Calibri', 'Segoe UI', Tahoma, sans-serif; }
        body { background: #e8f5e9; padding: 16px 12px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: #fff; max-width: 1400px; width: 100%; padding: 18px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,80,0,0.12); border: 1px solid #a5d6a7; }
        .page-title { font-size: 24px; color: #1b5e20; background: #c8e6c9; display: inline-block; padding: 4px 18px; border-radius: 30px; margin-bottom: 12px; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
        .btn { padding: 8px 16px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn:hover { background: #1b5e20; }
        .btn-success { background: #388e3c; }
        .btn-success:hover { background: #2e7d32; }
        .btn-voltar { background: #558b2f; }
        .btn-voltar:hover { background: #33691e; }
        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0 16px;
            align-items: center;
        }
        .filtros select, .filtros input {
            padding: 6px 10px;
            border: 1px solid #a5d6a7;
            border-radius: 6px;
            font-size: 14px;
            background: #fafffe;
            flex: 0 1 auto;
            min-width: 120px;
        }
        .filtros input[type="text"] {
            flex: 1 1 150px;
            min-width: 100px;
        }
        .filtros .btn-filtrar {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .filtros .grupo-filtro {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .filtros .grupo-filtro label {
            font-size: 12px;
            font-weight: 600;
            color: #1b5e20;
            margin-right: 2px;
        }
        .filtros .grupo-filtro input {
            min-width: 70px;
            flex: 0 1 80px;
        }
        .table-responsive { overflow-x: auto; margin-top: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 1000px; }
        th { background: #c8e6c9; padding: 10px 8px; text-align: left; color: #1b5e20; border-bottom: 2px solid #81c784; white-space: nowrap; cursor: pointer; user-select: none; position: relative; }
        th:hover { background: #b8d9b9; }
        th .sorter { display: inline-block; margin-left: 4px; font-size: 12px; }
        td { padding: 10px 8px; border-bottom: 1px solid #c8e6c9; vertical-align: middle; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .badge-aberta { background: #e3f2fd; color: #0d47a1; }
        .badge-em_andamento { background: #fff3e0; color: #e65100; }
        .badge-concluida { background: #c8e6c9; color: #1b5e20; }
        .badge-cancelada { background: #e0e0e0; color: #424242; }
        .badge-emergencial { background: #ffcdd2; color: #b71c1c; font-weight: bold; }
        .badge-urgente { background: #fff9c4; color: #f57f17; font-weight: bold; }
        .badge-normal { background: #c8e6c9; color: #1b5e20; font-weight: bold; }
        .badge-grupo { background: #e3f2fd; color: #0d47a1; font-weight: bold; }
        .badge-personagem { background: #e8f5e9; color: #1b5e20; font-weight: bold; }
        .badge .icone { margin-right: 4px; }
        .dias-numero { font-weight: 700; color: #1b5e20; }
        .dias-hoje { color: #558b2f; }
        .empty-message { text-align: center; color: #555; padding: 30px 0; }
        @media (max-width: 600px) {
            .container { padding: 14px; }
            .filtros { flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
            .filtros select, .filtros input { flex: 0 0 auto; min-width: 100px; font-size: 13px; padding: 5px 8px; }
            .filtros input[type="text"] { flex: 1 1 120px; min-width: 80px; }
            .filtros .grupo-filtro input { min-width: 60px; flex: 0 1 70px; }
            .filtros .btn-filtrar { padding: 5px 12px; font-size: 13px; flex-shrink: 0; }
            table { font-size: 13px; min-width: 700px; }
            th, td { padding: 6px 6px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="page-title">📋 Ordens de Serviço</h1>
    <div class="header-actions">
        <a href="index.html" class="btn btn-voltar">← Voltar ao Painel</a>
        <a href="os-abrir.html" class="btn btn-success">📝 Nova OS</a>
    </div>

    <div class="filtros">
        <!-- Status e Pendente -->
        <select id="filtroStatus">
            <option value="todos">Status: Todos</option>
            <option value="aberto" selected>Aberto</option>
            <option value="fechado">Fechado</option>
        </select>
        <select id="filtroPendente">
            <option value="todos">Pendente: Todos</option>
            <option value="diretoria">Diretoria</option>
            <option value="admin">Admin</option>
        </select>

        <!-- Reclamante -->
        <span class="grupo-filtro">
            <label>Reclamante:</label>
            <input type="text" id="filtroQuadraReclamante" placeholder="Quadra">
            <input type="text" id="filtroLoteReclamante" placeholder="Lote">
        </span>

        <!-- Reclamado -->
        <span class="grupo-filtro">
            <label>Reclamado:</label>
            <input type="text" id="filtroQuadraReclamada" placeholder="Quadra">
            <input type="text" id="filtroLoteReclamada" placeholder="Lote">
        </span>

        <!-- Busca geral -->
        <input type="text" id="filtroBusca" placeholder="Buscar...">
        <button class="btn-filtrar" id="btnFiltrar">Filtrar</button>
    </div>

    <div id="listaContainer"><p class="empty-message">Carregando ordens de serviço...</p></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDx_6oWO30Drh8GkuQA9jk2Oym7H8J3ABg",
        authDomain: "villa-bosque1.firebaseapp.com",
        projectId: "villa-bosque1",
        storageBucket: "villa-bosque1.firebasestorage.app",
        messagingSenderId: "372474036025",
        appId: "1:372474036025:web:bbbee10723469d77cbb2e8"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const listaDiv = document.getElementById('listaContainer');
    const filtroStatus = document.getElementById('filtroStatus');
    const filtroPendente = document.getElementById('filtroPendente');
    const filtroBusca = document.getElementById('filtroBusca');
    const btnFiltrar = document.getElementById('btnFiltrar');
    const filtroQuadraReclamante = document.getElementById('filtroQuadraReclamante');
    const filtroLoteReclamante = document.getElementById('filtroLoteReclamante');
    const filtroQuadraReclamada = document.getElementById('filtroQuadraReclamada');
    const filtroLoteReclamada = document.getElementById('filtroLoteReclamada');

    let sortField = 'numero';
    let sortAsc = false;
    let userMap = {}; // uid -> { nome, funcao }

    const priorityMap = {
        'emergencial': { label: 'Emergencial', class: 'badge-emergencial', icon: '🔴' },
        'urgente': { label: 'Urgente', class: 'badge-urgente', icon: '🟡' },
        'normal': { label: 'Normal', class: 'badge-normal', icon: '🟢' }
    };

    function calcularDias(dataISO) {
        if (!dataISO) return '—';
        const data = new Date(dataISO);
        const agora = new Date();
        const diffMs = agora - data;
        const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        if (diffDias === 0) return '<span class="dias-hoje">Hoje</span>';
        if (diffDias === 1) return '1 dia';
        return `${diffDias} dias`;
    }

    function getUltimaDataHistorico(data) {
        if (data.historico && data.historico.length > 0) {
            const ultimo = data.historico[data.historico.length - 1];
            return ultimo.data || data.criado_em;
        }
        return data.criado_em;
    }

    // Função que retorna a categoria do destino atual
    function getPendenteCategoria(data) {
        // Caso 1: grupo
        if (data.direcionado_para === 'group:admin') return 'admin';
        if (data.direcionado_para === 'group:diretor') return 'diretoria';

        // Caso 2: personagem individual
        const uid = data.direcionado_para;
        if (uid && userMap[uid]) {
            const funcao = userMap[uid].funcao;
            if (funcao === 'admin') return 'admin';
            if (funcao === 'diretor') return 'diretoria';
        }

        // Caso 3: fallback pelo nome (para dados muito antigos)
        const nome = (data.direcionado_para_nome || '').toLowerCase();
        if (nome.includes('admin')) return 'admin';
        if (nome.includes('diretor')) return 'diretoria';

        return 'outros';
    }

    // --- Ordenação ---
    function ordenarDados(docs) {
        docs.sort((a, b) => {
            let valA, valB;
            switch (sortField) {
                case 'numero': valA = a.numero || 0; valB = b.numero || 0; break;
                case 'titulo': valA = (a.titulo || '').toLowerCase(); valB = (b.titulo || '').toLowerCase(); break;
                case 'aberto_por_nome': valA = (a.aberto_por_nome || '').toLowerCase(); valB = (b.aberto_por_nome || '').toLowerCase(); break;
                case 'prioridade': {
                    const prioOrder = { 'emergencial': 0, 'urgente': 1, 'normal': 2 };
                    valA = prioOrder[a.prioridade] !== undefined ? prioOrder[a.prioridade] : 99;
                    valB = prioOrder[b.prioridade] !== undefined ? prioOrder[b.prioridade] : 99;
                    break;
                }
                case 'status': valA = (a.status || '').toLowerCase(); valB = (b.status || '').toLowerCase(); break;
                case 'criado_em': valA = a.criado_em ? new Date(a.criado_em).getTime() : 0; valB = b.criado_em ? new Date(b.criado_em).getTime() : 0; break;
                case 'pendente_em': valA = (a.direcionado_para_nome || '').toLowerCase(); valB = (b.direcionado_para_nome || '').toLowerCase(); break;
                case 'dias_pendente': {
                    valA = getUltimaDataHistorico(a); valB = getUltimaDataHistorico(b);
                    valA = valA ? new Date(valA).getTime() : 0; valB = valB ? new Date(valB).getTime() : 0;
                    break;
                }
                case 'dias_aberto': valA = a.criado_em ? new Date(a.criado_em).getTime() : 0; valB = b.criado_em ? new Date(b.criado_em).getTime() : 0; break;
                default: valA = 0; valB = 0;
            }
            if (typeof valA === 'string') {
                return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
            }
            return sortAsc ? valA - valB : valB - valA;
        });
        return docs;
    }

    // --- Renderização ---
    function renderizarTabela(docs) {
        if (!docs || docs.length === 0) {
            listaDiv.innerHTML = '<p class="empty-message">Nenhuma ordem encontrada com os filtros atuais.</p>';
            return;
        }

        docs = ordenarDados(docs);

        let html = `<div class="table-responsive"><table>
            <thead><tr>
                <th data-sort="numero">Nº <span class="sorter">${sortField === 'numero' ? (sortAsc ? '▲' : '▼') : '⇅'}</span></th>
                <th data-sort="titulo">Título <span class="sorter">${sortField === 'titulo' ? (sortAsc ? '▲' : '▼') : '⇅'}</span></th>
                <th data-sort="aberto_por_nome">Aberto por <span class="sorter">${sortField === 'aberto_por_nome' ? (sortAsc ? '▲' : '▼') : '⇅'}</span></th>
                <th data-sort="prioridade">Prioridade <span class="sorter">${sortField === 'prioridade' ? (sortAsc ? '▲' : '▼') : '⇅'}</span></th>
                <th data-sort="status">Status <span class="sorter">${sortField === 'status' ? (sortAsc ? '▲' : '▼') : '⇅'}</span></th>
                <th data-sort="criado_em">Data/Hora <span class="sorter">${sortField === 'criado_em' ? (sortAsc ? '▲' : '▼') : '⇅'}</span></th>
                <th data-sort="pendente_em">Pendente em <span class="sorter">${sortField === 'pendente_em' ? (sortAsc ? '▲' : '▼') : '⇅'}</span></th>
                <th data-sort="dias_pendente">Dias pendente <span class="sorter">${sortField === 'dias_pendente' ? (sortAsc ? '▲' : '▼') : '⇅'}</span></th>
                <th data-sort="dias_aberto">Dias aberto <span class="sorter">${sortField === 'dias_aberto' ? (sortAsc ? '▲' : '▼') : '⇅'}</span></th>
            </tr></thead><tbody>`;

        docs.forEach(data => {
            const id = data.id;
            const statusClass = `badge-${data.status || 'aberta'}`;
            const statusLabel = data.status || 'aberta';

            const p = data.prioridade || 'normal';
            const pData = priorityMap[p] || priorityMap['normal'];
            const prioridadeHtml = `<span class="badge ${pData.class}"><span class="icone">${pData.icon}</span> ${pData.label}</span>`;

            let pendenteHtml = '';
            if (data.direcionado_para && data.direcionado_para.startsWith('group:')) {
                pendenteHtml = `<span class="badge badge-grupo"><span class="icone">👥</span> ${data.direcionado_para_nome || 'Grupo'}</span>`;
            } else {
                pendenteHtml = `<span class="badge badge-personagem"><span class="icone">👤</span> ${data.direcionado_para_nome || '—'}</span>`;
            }

            const dataHora = data.criado_em ? new Date(data.criado_em).toLocaleString('pt-BR') : '—';
            const diasAberto = data.criado_em ? calcularDias(data.criado_em) : '—';
            let diasPendente = '—';
            const ultData = getUltimaDataHistorico(data);
            if (ultData) diasPendente = calcularDias(ultData);

            html += `
                <tr onclick="window.location.href='os-detalhe.html?id=${id}'" style="cursor:pointer;">
                    <td><strong>${data.numero || 'N/A'}</strong></td>
                    <td>${data.titulo || 'Sem título'}</td>
                    <td>${data.aberto_por_nome || '—'}</td>
                    <td>${prioridadeHtml}</td>
                    <td><span class="badge ${statusClass}">${statusLabel.replace('_',' ').toUpperCase()}</span></td>
                    <td>${dataHora}</td>
                    <td>${pendenteHtml}</td>
                    <td><span class="dias-numero">${diasPendente}</span></td>
                    <td><span class="dias-numero">${diasAberto}</span></td>
                </tr>
            `;
        });
        html += `</tbody></table></div>`;
        listaDiv.innerHTML = html;

        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const field = th.dataset.sort;
                if (sortField === field) sortAsc = !sortAsc;
                else { sortField = field; sortAsc = false; }
                aplicarFiltros();
            });
        });
    }

    // --- Aplicar filtros ---
    function aplicarFiltros() {
        let docs = window.allDocs || [];

        // Filtro Status
        const statusFiltro = filtroStatus.value;
        if (statusFiltro === 'aberto') {
            docs = docs.filter(d => d.status === 'aberta' || d.status === 'em_andamento');
        } else if (statusFiltro === 'fechado') {
            docs = docs.filter(d => d.status === 'concluida' || d.status === 'cancelada');
        }

        // Filtro Pendente em
        const pendenteFiltro = filtroPendente.value;
        if (pendenteFiltro === 'diretoria') {
            docs = docs.filter(d => getPendenteCategoria(d) === 'diretoria');
        } else if (pendenteFiltro === 'admin') {
            docs = docs.filter(d => getPendenteCategoria(d) === 'admin');
        }

        // Filtros de Reclamante (quadra e lote)
        const qReclamante = filtroQuadraReclamante.value.trim().toLowerCase();
        const lReclamante = filtroLoteReclamante.value.trim().toLowerCase();
        if (qReclamante) docs = docs.filter(d => (d.quadra_reclamante || '').toLowerCase().includes(qReclamante));
        if (lReclamante) docs = docs.filter(d => (d.lote_reclamante || '').toLowerCase().includes(lReclamante));

        // Filtros de Reclamado (quadra e lote)
        const qReclamada = filtroQuadraReclamada.value.trim().toLowerCase();
        const lReclamada = filtroLoteReclamada.value.trim().toLowerCase();
        if (qReclamada) docs = docs.filter(d => (d.quadra_reclamada || '').toLowerCase().includes(qReclamada));
        if (lReclamada) docs = docs.filter(d => (d.lote_reclamada || '').toLowerCase().includes(lReclamada));

        // Busca geral
        const busca = filtroBusca.value.trim().toLowerCase();
        if (busca) {
            docs = docs.filter(d => {
                const num = d.numero ? String(d.numero) : '';
                const tit = (d.titulo || '').toLowerCase();
                const resp = (d.aberto_por_nome || '').toLowerCase();
                return num.includes(busca) || tit.includes(busca) || resp.includes(busca);
            });
        }

        renderizarTabela(docs);
    }

    // --- Carregar dados ---
    function carregarOS() {
        listaDiv.innerHTML = '<p class="empty-message">Carregando ordens de serviço...</p>';

        // Primeiro, carregar os usuários para o mapa de funções
        db.collection('usuarios').where('status', '==', 'ativo').get()
            .then(snapshot => {
                userMap = {};
                snapshot.forEach(doc => {
                    const data = doc.data();
                    userMap[doc.id] = { nome: data.nome, funcao: data.funcao };
                });
                // Agora carregar as OS
                return db.collection('ordens_servico').get();
            })
            .then(snapshot => {
                if (snapshot.empty) {
                    window.allDocs = [];
                    listaDiv.innerHTML = '<p class="empty-message">Nenhuma ordem de serviço encontrada.</p>';
                    return;
                }
                let docs = [];
                snapshot.forEach(doc => {
                    docs.push({ id: doc.id, ...doc.data() });
                });
                window.allDocs = docs;
                aplicarFiltros();
            })
            .catch(err => {
                console.error('Erro ao carregar OS:', err);
                listaDiv.innerHTML = `<p style="color:red;">Erro ao carregar: ${err.message}</p>`;
            });
    }

    // --- Event listeners ---
    btnFiltrar.addEventListener('click', aplicarFiltros);
    [filtroStatus, filtroPendente].forEach(el => el.addEventListener('change', aplicarFiltros));
    // Inputs com delay
    const inputsDelay = [filtroQuadraReclamante, filtroLoteReclamante, filtroQuadraReclamada, filtroLoteReclamada, filtroBusca];
    let timeoutBusca;
    inputsDelay.forEach(input => {
        input.addEventListener('input', () => {
            clearTimeout(timeoutBusca);
            timeoutBusca = setTimeout(aplicarFiltros, 300);
        });
    });

    auth.onAuthStateChanged((user) => {
        if (user) carregarOS();
        else window.location.href = 'index.html';
    });
</script>
</body>
</html>
