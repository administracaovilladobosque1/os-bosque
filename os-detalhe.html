<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Detalhe da OS - Villa do Bosque</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        /* ... estilos mantidos iguais ao anterior ... */
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Calibri', 'Segoe UI', Tahoma, sans-serif; }
        body { background: #e8f5e9; padding: 16px 12px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: #fff; max-width: 900px; width: 100%; padding: 20px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,80,0,0.12); border: 1px solid #a5d6a7; }
        .page-title { font-size: 24px; color: #1b5e20; background: #c8e6c9; display: inline-block; padding: 4px 18px; border-radius: 30px; margin-bottom: 12px; }
        .btn { padding: 8px 16px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn:hover { background: #1b5e20; }
        .btn-success { background: #388e3c; }
        .btn-success:hover { background: #2e7d32; }
        .btn-danger { background: #c62828; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-warning { background: #f0ad4e; color: #000; }
        .btn-warning:hover { background: #ec971f; }
        .btn-voltar { background: #558b2f; }
        .btn-voltar:hover { background: #33691e; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-edit { background: transparent; border: 1px solid #2e7d32; color: #2e7d32; padding: 2px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .btn-edit:hover { background: #e8f5e9; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }

        .os-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #c8e6c9;
        }
        .os-info .info-row {
            display: flex;
            flex-wrap: wrap;
            padding: 4px 0;
            border-bottom: 1px solid #e8f5e9;
            align-items: center;
        }
        .os-info .info-row:last-child { border-bottom: none; }
        .os-info .info-label {
            font-weight: 600;
            color: #1b5e20;
            width: 140px;
            flex-shrink: 0;
        }
        .os-info .info-value {
            flex: 1;
            word-break: break-word;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .os-info .info-value .edit-field {
            margin-left: auto;
            flex-shrink: 0;
        }
        .os-info .info-value .badge,
        .card .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .badge-grupo { background: #ced4da; color: #000; }
        .badge-admin { background: #ffe082; color: #000; }
        .badge-diretor { background: #a5d6a7; color: #000; }
        .badge-master { background: #ffcc80; color: #000; }
        .badge-aberta { background: #e3f2fd; color: #0d47a1; }
        .badge-em_andamento { background: #fff3e0; color: #e65100; }
        .badge-concluida { background: #c8e6c9; color: #1b5e20; }
        .badge-cancelada { background: #e0e0e0; color: #424242; }
        .badge-emergencial { background: #ffcdd2; color: #b71c1c; font-weight: bold; }
        .badge-urgente { background: #fff9c4; color: #f57f17; font-weight: bold; }
        .badge-normal { background: #c8e6c9; color: #1b5e20; font-weight: bold; }
        .edit-historico {
            font-size: 12px;
            color: #888;
            font-style: italic;
            margin-left: 6px;
        }

        select option.grupo { background-color: #ced4da; }
        select option.admin { background-color: #ffe082; }
        select option.diretor { background-color: #a5d6a7; }

        .historico-container { margin: 20px 0; display: flex; flex-direction: column; gap: 12px; }
        .historico-container .card {
            border-radius: 8px;
            padding: 12px 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid #e8f5e9;
            border-left-width: 4px;
            border-left-style: solid;
        }
        .card-admin { background: #fffde7; border-left-color: #ffe082; }
        .card-diretor { background: #f1f8e9; border-left-color: #a5d6a7; }
        .card-master { background: #fff8e1; border-left-color: #ffcc80; }
        .card-outros { background: #f8f9fa; border-left-color: #ced4da; }
        .card-ultimo { background: #ffebee; border-left-color: #c62828; border: 2px solid #ef9a9a; }

        .card .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
            flex-wrap: wrap;
            align-items: center;
        }
        .card .card-header .usuario {
            font-weight: 600;
            color: #1b5e20;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card .card-header .tempo {
            font-size: 12px;
            color: #888;
        }
        .card .card-body { font-size: 14px; }
        .card .card-body .direcionado {
            font-size: 13px;
            color: #555;
            margin-top: 4px;
        }
        .card .card-body .mensagem {
            margin-top: 4px;
        }

        .nova-acao .form-group { margin-bottom: 10px; }
        .nova-acao label { font-weight: 600; font-size: 13px; color: #1b5e20; display: block; margin-bottom: 2px; }
        .nova-acao textarea, .nova-acao select {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #a5d6a7;
            border-radius: 6px;
            font-size: 14px;
            background: #fafffe;
        }
        .nova-acao textarea { resize: vertical; min-height: 50px; }
        .acoes-rodape {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
            align-items: center;
        }
        .acoes-rodape .btn { margin-right: 0; }
        .message { margin-top: 8px; padding: 6px 10px; border-radius: 6px; display: none; font-size: 13px; }
        .message.error { display: block; background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
        .message.success { display: block; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }

        .edit-field {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .edit-field input, .edit-field select {
            padding: 2px 6px;
            border: 1px solid #a5d6a7;
            border-radius: 4px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container { padding: 14px; }
            .page-title { font-size: 20px; }
            .os-info .info-label { width: 100px; }
            .os-info .info-value { font-size: 13px; flex-wrap: wrap; }
            .acoes-rodape { flex-direction: column; align-items: stretch; }
            .acoes-rodape .btn { width: 100%; text-align: center; }
            .card .card-header { flex-direction: column; align-items: flex-start; gap: 4px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-actions">
        <a href="os-list.html" class="btn btn-voltar">← Voltar</a>
        <span style="flex:1;"></span>
        <span id="osStatusBadge" class="badge badge-aberta" style="font-size:16px; padding:6px 16px;">Aberta</span>
    </div>

    <h1 class="page-title" id="osTitulo">📋 OS #<span id="osNumero">---</span></h1>

    <div class="os-info" id="osInfoContainer"></div>
    <div id="historicoContainer" class="historico-container"><p>Carregando...</p></div>
</div>

<script>
    // ================================================================
    // FIREBASE CONFIG
    // ================================================================
    const firebaseConfig = {
        apiKey: "AIzaSyDx_6oWO30Drh8GkuQA9jk2Oym7H8J3ABg",
        authDomain: "villa-bosque1.firebaseapp.com",
        projectId: "villa-bosque1",
        storageBucket: "villa-bosque1.firebasestorage.app",
        messagingSenderId: "372474036025",
        appId: "1:372474036025:web:bbbee10723469d77cbb2e8"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ================================================================
    // TIMEOUT GLOBAL
    // ================================================================
    const TIMEOUT_MS = 4 * 60 * 60 * 1000;
    function verificarTimeout() {
        const lastActivity = sessionStorage.getItem('lastActivity');
        if (!lastActivity) {
            sessionStorage.setItem('lastActivity', Date.now().toString());
            return;
        }
        const diff = Date.now() - parseInt(lastActivity);
        if (diff > TIMEOUT_MS) {
            sessionStorage.removeItem('lastActivity');
            sessionStorage.removeItem('userLoggedIn');
            auth.signOut().then(() => {
                alert('Sessão expirada por inatividade.');
                window.location.href = 'index.html';
            });
        } else {
            sessionStorage.setItem('lastActivity', Date.now().toString());
        }
    }
    function resetTimeoutGlobal() {
        sessionStorage.setItem('lastActivity', Date.now().toString());
    }
    ['click','mousemove','keydown','scroll','touchstart'].forEach(ev => {
        document.addEventListener(ev, resetTimeoutGlobal);
    });
    verificarTimeout();

    // ================================================================
    // VARIÁVEIS GLOBAIS
    // ================================================================
    const MASTER_EMAIL = 'administracaovilladobosque@gmail.com';
    let currentUser = null;
    let currentUserData = null;
    let osId = null;
    let osData = null;
    let userMap = {};
    let editando = { campo: null, original: null };

    // ================================================================
    // ELEMENTOS
    // ================================================================
    const osNumero = document.getElementById('osNumero');
    const osTitulo = document.getElementById('osTitulo');
    const osStatusBadge = document.getElementById('osStatusBadge');
    const osInfoContainer = document.getElementById('osInfoContainer');
    const historicoContainer = document.getElementById('historicoContainer');

    // ================================================================
    // UTILITÁRIOS
    // ================================================================
    function formatarDataHora(dataISO) {
        if (!dataISO) return '—';
        const d = new Date(dataISO);
        if (isNaN(d)) return '—';
        const dia = String(d.getDate()).padStart(2, '0');
        const mes = String(d.getMonth()+1).padStart(2, '0');
        const ano = d.getFullYear();
        const hora = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${dia}/${mes}/${ano} ${hora}:${min}`;
    }

    function formatarDataCurta(dataISO) {
        if (!dataISO) return '—';
        const d = new Date(dataISO);
        if (isNaN(d)) return '—';
        return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }

    function getFuncao(uid) {
        if (uid && userMap[uid]) return userMap[uid].funcao;
        return null;
    }

    function getNome(uid) {
        if (uid && userMap[uid]) return userMap[uid].nome;
        return uid || '—';
    }

    function getBadgePerfil(uid, nome) {
        let texto = nome || '—';
        let classe = 'badge-grupo';
        if (uid && userMap[uid]) {
            const funcao = userMap[uid].funcao;
            if (funcao === 'admin') classe = 'badge-admin';
            else if (funcao === 'diretor') classe = 'badge-diretor';
            else if (funcao === 'master') classe = 'badge-master';
            else classe = 'badge-grupo';
        } else {
            const nomeLower = (nome || '').toLowerCase();
            if (nomeLower.includes('admin')) classe = 'badge-admin';
            else if (nomeLower.includes('diretor')) classe = 'badge-diretor';
            else if (nomeLower.includes('master')) classe = 'badge-master';
            else classe = 'badge-grupo';
        }
        return `<span class="badge ${classe}">${texto}</span>`;
    }

    function getBadgeDirecionado(data) {
        const target = data.direcionado_para;
        let texto = data.direcionado_para_nome || '—';
        let classe = 'badge-grupo';
        if (target && target.startsWith('group:')) {
            classe = 'badge-grupo';
        } else if (target && userMap[target]) {
            const funcao = userMap[target].funcao;
            if (funcao === 'admin') classe = 'badge-admin';
            else if (funcao === 'diretor') classe = 'badge-diretor';
            else classe = 'badge-grupo';
        } else {
            const nome = (data.direcionado_para_nome || '').toLowerCase();
            if (nome.includes('admin')) classe = 'badge-admin';
            else if (nome.includes('diretor')) classe = 'badge-diretor';
            else classe = 'badge-grupo';
        }
        return `<span class="badge ${classe}">${texto}</span>`;
    }

    function formatarLote(valor) {
        if (!valor) return '';
        const num = parseInt(valor.trim(), 10);
        if (isNaN(num) || num < 1) return valor.trim();
        const limitado = Math.min(num, 99);
        return String(limitado).padStart(2, '0');
    }

    // ================================================================
    // EXIBIR HISTÓRICO DE EDIÇÕES (inline) – Última edição
    // ================================================================
    function getHistoricoEdicoes(campo) {
        if (!osData.edicoes) return null;
        const edicoes = osData.edicoes[campo];
        if (!edicoes || edicoes.length === 0) return null;
        return edicoes;
    }

    function exibirHistoricoEdicao(campo) {
        const edicoes = getHistoricoEdicoes(campo);
        if (!edicoes) return '';
        const ultima = edicoes[edicoes.length - 1];
        if (!ultima) return '';
        const data = formatarDataHora(ultima.data);
        const antigo = ultima.valor_antigo || '';
        return `<span class="edit-historico">(edit ${data}: ${antigo})</span>`;
    }

    const prioridadeMap = {
        'emergencial': '🔴 Emergencial',
        'urgente': '🟡 Urgente',
        'normal': '🟢 Normal'
    };

    function getValorExibicao(campo, valor) {
        if (campo === 'prioridade' && valor && prioridadeMap[valor]) {
            return prioridadeMap[valor];
        }
        return valor;
    }

    // ================================================================
    // PERMISSÃO DE EDIÇÃO – BLOQUEIO DEFINITIVO PARA CONCLUÍDA
    // ================================================================
    function podeEditarOS() {
        // Verifica se OS está concluída (independente de maiúsculas)
        if (!osData) return false;
        if (osData.status && osData.status.toLowerCase() === 'concluida') {
            return false;
        }

        if (!currentUser) return false;
        if (currentUser.email === MASTER_EMAIL) return true;

        const funcaoUsuario = currentUserData?.funcao;
        if (!funcaoUsuario) return false;

        const direcionadoPara = osData.direcionado_para;
        const funcaoDestino = osData.direcionado_para_funcao;
        const criadorFuncao = getFuncao(osData.aberto_por);

        if (funcaoUsuario === 'admin') {
            if (direcionadoPara === 'group:admin') return true;
            if (funcaoDestino === 'admin') return true;
            if (criadorFuncao === 'admin') return true;
            return false;
        }

        if (funcaoUsuario === 'diretor') {
            if (direcionadoPara === 'group:diretor') return true;
            if (funcaoDestino === 'diretor') return true;
            if (criadorFuncao === 'diretor') return true;
            return false;
        }

        return false;
    }

    // ================================================================
    // CARREGAR USUÁRIOS
    // ================================================================
    function carregarUsuarios() {
        return db.collection('usuarios').where('status', '==', 'ativo').get()
            .then(snapshot => {
                userMap = {};
                snapshot.forEach(doc => {
                    const data = doc.data();
                    userMap[doc.id] = { nome: data.nome, funcao: data.funcao };
                });
            });
    }

    // ================================================================
    // CARREGAR DETALHE DA OS
    // ================================================================
    function carregarOS() {
        if (!osId) return;
        historicoContainer.innerHTML = '<p>Carregando...</p>';
        db.collection('ordens_servico').doc(osId).get()
            .then(doc => {
                if (!doc.exists) {
                    historicoContainer.innerHTML = '<p style="color:red;">OS não encontrada.</p>';
                    return;
                }
                osData = { id: doc.id, ...doc.data() };
                if (!osData.edicoes) osData.edicoes = {};
                renderizarDetalhe();
            })
            .catch(err => {
                console.error(err);
                historicoContainer.innerHTML = `<p style="color:red;">Erro ao carregar: ${err.message}</p>`;
            });
    }

    // ================================================================
    // RENDERIZAR DETALHE
    // ================================================================
    function renderizarDetalhe() {
        if (!osData) return;

        osNumero.textContent = osData.numero || '---';
        osTitulo.textContent = `📋 OS #${osData.numero || '---'}`;

        const statusMap = {
            'aberta': 'Aberta',
            'em_andamento': 'Em andamento',
            'concluida': 'Concluída',
            'cancelada': 'Cancelada'
        };
        const statusLabel = statusMap[osData.status] || osData.status;
        osStatusBadge.textContent = statusLabel;
        osStatusBadge.className = `badge badge-${osData.status || 'aberta'}`;

        // ---- INFORMAÇÕES DA OS ----
        const nomeAbertura = getNome(osData.aberto_por);
        const abertoPorBadge = getBadgePerfil(osData.aberto_por, nomeAbertura);

        let tipoCapitalizado = osData.tipo || '—';
        if (tipoCapitalizado !== '—') {
            tipoCapitalizado = tipoCapitalizado.charAt(0).toUpperCase() + tipoCapitalizado.slice(1);
        }

        const prioridadeLabel = getValorExibicao('prioridade', osData.prioridade) || osData.prioridade;

        // ---- Direcionado original (sempre fixo) ----
        const dirOriginal = osData.direcionado_para_original || osData.direcionado_para || '—';
        const dirNomeOriginal = osData.direcionado_para_nome_original || osData.direcionado_para_nome || '—';
        const dirBadgeOriginal = getBadgeDirecionado({
            direcionado_para: dirOriginal,
            direcionado_para_nome: dirNomeOriginal
        });

        // Campos – Abertura primeiro, depois editáveis, e por fim Direcionado (fixo)
        const campos = [
            { label: 'Abertura', value: formatarDataHora(osData.criado_em), campo: 'criado_em', edit: false },
            { label: 'Título', value: osData.titulo || '—', campo: 'titulo', edit: true },
            { label: 'Descrição', value: osData.descricao || '—', campo: 'descricao', edit: true },
            { label: 'Tipo', value: tipoCapitalizado, campo: 'tipo', edit: true },
            { label: 'Prioridade', value: prioridadeLabel, campo: 'prioridade', edit: true },
            { label: 'Aberto por', value: abertoPorBadge, campo: 'aberto_por', edit: false },
        ];

        const reclamante = osData.quadra_reclamante && osData.lote_reclamante
            ? `${osData.quadra_reclamante} ${osData.lote_reclamante}`
            : (osData.quadra_reclamante || osData.lote_reclamante || '—');
        const reclamado = osData.quadra_reclamada && osData.lote_reclamada
            ? `${osData.quadra_reclamada} ${osData.lote_reclamada}`
            : (osData.quadra_reclamada || osData.lote_reclamada || '—');

        campos.push(
            { label: 'Reclamante', value: reclamante, campo: 'quadra_reclamante', campo2: 'lote_reclamante', edit: true },
            { label: 'Reclamado', value: reclamado, campo: 'quadra_reclamada', campo2: 'lote_reclamada', edit: true },
            { label: 'Direcionado para', value: dirBadgeOriginal, campo: 'direcionado_original', edit: false }
        );

        // Verifica permissão de edição (considerando status concluída)
        const podeEditar = podeEditarOS();

        let infoHTML = '';
        campos.forEach(campo => {
            let valor = campo.value;
            // Adiciona histórico de edição (última alteração) se houver
            if (campo.campo && campo.campo !== 'direcionado_original') {
                const hist = exibirHistoricoEdicao(campo.campo);
                if (hist) valor += ' ' + hist;
            }
            if (campo.campo2) {
                const hist = exibirHistoricoEdicao(campo.campo2);
                if (hist) valor += ' ' + hist;
            }

            let editHtml = '';
            if (campo.edit && podeEditar) {
                if (campo.campo2) {
                    editHtml = `<span class="edit-field">
                        <button class="btn-edit" data-campo="${campo.campo}" data-campo2="${campo.campo2}" data-valor="${campo.value}">✏️</button>
                    </span>`;
                } else {
                    editHtml = `<span class="edit-field">
                        <button class="btn-edit" data-campo="${campo.campo}" data-valor="${campo.value}">✏️</button>
                    </span>`;
                }
            }
            infoHTML += `
                <div class="info-row">
                    <div class="info-label">${campo.label}</div>
                    <div class="info-value" id="info-${campo.campo || 'static'}">
                        <span id="display-${campo.campo || 'static'}">${valor}</span>
                        ${editHtml}
                    </div>
                </div>
            `;
        });

        osInfoContainer.innerHTML = infoHTML;
        const funcaoAbertura = getFuncao(osData.aberto_por);
        const corAbertura = funcaoAbertura === 'admin' ? '#ffe082' :
                            funcaoAbertura === 'diretor' ? '#a5d6a7' :
                            funcaoAbertura === 'master' ? '#ffcc80' : '#ced4da';
        osInfoContainer.style.borderLeft = `6px solid ${corAbertura}`;
        osInfoContainer.style.backgroundColor = corAbertura + '22';

        // ---- HISTÓRICO (CARDS) ----
        const historico = osData.historico || [];
        if (historico.length === 0) {
            historicoContainer.innerHTML = '<p>Nenhuma ação registrada.</p>';
            return;
        }

        historico.sort((a, b) => (a.data || '').localeCompare(b.data || ''));

        const dataAbertura = osData.criado_em ? new Date(osData.criado_em).getTime() : null;

        let html = '';
        let dataAnterior = dataAbertura;
        let cardIndex = 0;

        historico.forEach((item) => {
            if (item.acao === 'abertura') return;

            const uid = item.usuario_uid;
            const nome = getNome(uid) || item.usuario || 'Anônimo';
            const funcao = getFuncao(uid) || 'outros';
            const dataFormat = formatarDataHora(item.data);
            const acao = item.acao || 'ação';
            let mensagem = item.mensagem || '';

            if (acao === 'edicao') return;

            let direcionadoHtml = '';
            if (item.direcionado_para) {
                const direcionadoData = {
                    direcionado_para: item.direcionado_para,
                    direcionado_para_nome: item.direcionado_para_nome || item.direcionado_para
                };
                direcionadoHtml = `<div class="direcionado">Direcionado para: ${getBadgeDirecionado(direcionadoData)}</div>`;
            }

            let tempoDecorrido = '';
            const dataItem = new Date(item.data).getTime();
            if (dataAnterior !== null) {
                const diffMs = dataItem - dataAnterior;
                const diffHoras = Math.round(diffMs / (1000 * 60 * 60));
                if (cardIndex === 0) {
                    if (diffHoras === 0) tempoDecorrido = ' (menos de 1 hora após abertura)';
                    else if (diffHoras === 1) tempoDecorrido = ' (1 hora após abertura)';
                    else tempoDecorrido = ` (${diffHoras} horas após abertura)`;
                } else {
                    if (diffHoras === 0) tempoDecorrido = ' (menos de 1 hora após resposta anterior)';
                    else if (diffHoras === 1) tempoDecorrido = ' (1 hora após resposta anterior)';
                    else tempoDecorrido = ` (${diffHoras} horas após resposta anterior)`;
                }
            }
            dataAnterior = dataItem;
            cardIndex++;

            const autorBadge = getBadgePerfil(uid, nome);

            let cardClass = 'card-outros';
            if (funcao === 'admin') cardClass = 'card-admin';
            else if (funcao === 'diretor') cardClass = 'card-diretor';
            else if (funcao === 'master') cardClass = 'card-master';

            html += `
                <div class="card ${cardClass}">
                    <div class="card-header">
                        <span class="usuario">Resposta por ${autorBadge}</span>
                        <span class="tempo">${dataFormat}${tempoDecorrido}</span>
                    </div>
                    <div class="card-body">
                        <strong>${acao.toUpperCase()}</strong>
                        ${direcionadoHtml}
                        <div class="mensagem">${mensagem}</div>
                    </div>
                </div>
            `;
        });

        // ---- ÚLTIMO CARD ----
        html += `<div class="card card-ultimo">`;
        html += `<div class="card-header"><span class="usuario" style="font-size:15px;">➕ Adicionar Ação</span></div>`;
        html += `<div class="card-body">`;
        html += `
            <form id="formNovaAcao" class="nova-acao">
                <div class="form-group">
                    <label for="acaoDescricao">Descrição da ação *</label>
                    <textarea id="acaoDescricao" placeholder="Descreva a ação realizada..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="acaoDirecionar">Direcionar para (opcional)</label>
                    <select id="acaoDirecionar">
                        <option value="">Manter destino atual</option>
                    </select>
                </div>
                <div class="acoes-rodape">
                    <button type="submit" class="btn btn-success">➕ Adicionar Ação</button>
        `;
        const funcaoUsuario = currentUserData?.funcao || 'tecnico';
        const isDiretor = (funcaoUsuario === 'diretor');
        const isAdmin = (funcaoUsuario === 'admin');
        const isMaster = (currentUser && currentUser.email === MASTER_EMAIL);
        const podeConcluir = isDiretor || isMaster;
        const podeReabrir = isDiretor || isAdmin || isMaster;
        const statusConcluida = (osData.status && osData.status.toLowerCase() === 'concluida');

        if (!statusConcluida && podeConcluir) {
            html += `<button type="button" class="btn btn-success" id="btnConcluir">✅ Concluir OS</button>`;
        }
        if (statusConcluida && podeReabrir) {
            html += `<button type="button" class="btn btn-warning" id="btnReabrir">🔄 Reabrir OS</button>`;
        }
        html += `</div>`;
        html += `<div id="acaoMessage" class="message"></div>`;
        html += `</form>`;
        html += `</div></div>`;

        historicoContainer.innerHTML = html;

        document.getElementById('btnConcluir')?.addEventListener('click', concluirOS);
        document.getElementById('btnReabrir')?.addEventListener('click', reabrirOS);
        popularDirecionamento();

        document.getElementById('formNovaAcao').addEventListener('submit', (e) => {
            e.preventDefault();
            const descricao = document.getElementById('acaoDescricao').value.trim();
            if (!descricao) {
                mostrarMensagemAcao('A descrição é obrigatória.', 'error');
                return;
            }
            const direcionarPara = document.getElementById('acaoDirecionar').value;
            adicionarAcao(descricao, direcionarPara);
        });

        document.querySelectorAll('.btn-edit').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const campo = btn.dataset.campo;
                const campo2 = btn.dataset.campo2;
                const valorAtual = btn.dataset.valor;
                iniciarEdicao(campo, campo2, valorAtual, btn);
            });
        });
    }

    // ================================================================
    // EDIÇÃO DE CAMPO
    // ================================================================
    function iniciarEdicao(campo, campo2, valorAtual, btn) {
        if (editando.campo) cancelarEdicao();
        editando.campo = campo;
        editando.campo2 = campo2;
        editando.original = valorAtual;

        const displayEl = btn.closest('.info-value').querySelector('span[id^="display-"]');
        if (!displayEl) return;
        const container = displayEl.parentElement;

        displayEl.style.display = 'none';
        btn.style.display = 'none';

        let wrapper = document.createElement('span');
        wrapper.className = 'edit-field-wrapper';

        if (campo2) {
            const input1 = document.createElement('input');
            input1.type = 'text';
            input1.placeholder = 'Quadra';
            input1.value = osData[campo] || '';
            input1.style.width = '60px';
            const input2 = document.createElement('input');
            input2.type = 'text';
            input2.placeholder = 'Lote';
            input2.value = osData[campo2] || '';
            input2.style.width = '60px';
            const salvarBtn = document.createElement('button');
            salvarBtn.textContent = 'Salvar';
            salvarBtn.className = 'btn btn-sm btn-success';
            const cancelarBtn = document.createElement('button');
            cancelarBtn.textContent = 'Cancelar';
            cancelarBtn.className = 'btn btn-sm btn-secondary';

            wrapper.appendChild(input1);
            wrapper.appendChild(input2);
            wrapper.appendChild(salvarBtn);
            wrapper.appendChild(cancelarBtn);
            container.appendChild(wrapper);

            salvarBtn.addEventListener('click', () => {
                let novo1 = input1.value.trim().toUpperCase();
                let novo2 = input2.value.trim();
                if (novo2) novo2 = formatarLote(novo2);
                if (novo1 === osData[campo] && novo2 === osData[campo2]) {
                    cancelarEdicao();
                    return;
                }
                salvarEdicaoDupla(campo, campo2, osData[campo], osData[campo2], novo1, novo2);
            });
            cancelarBtn.addEventListener('click', cancelarEdicao);
        } else {
            let input;
            if (campo === 'prioridade') {
                input = document.createElement('select');
                ['emergencial', 'urgente', 'normal'].forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    if (opt === valorAtual) option.selected = true;
                    input.appendChild(option);
                });
            } else if (campo === 'tipo') {
                input = document.createElement('select');
                ['serviço', 'reclamação', 'infração', 'análise'].forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt.charAt(0).toUpperCase() + opt.slice(1);
                    if (opt === valorAtual) option.selected = true;
                    input.appendChild(option);
                });
            } else if (campo === 'direcionado_para') {
                const selectAcao = document.getElementById('acaoDirecionar');
                if (selectAcao) {
                    input = document.createElement('select');
                    input.innerHTML = selectAcao.innerHTML;
                    const opt = input.querySelector(`option[value="${osData.direcionado_para || ''}"]`);
                    if (opt) opt.selected = true;
                } else {
                    input = document.createElement('select');
                    input.innerHTML = `<option value="">Manter destino atual</option>
                        <option value="group:admin">Administradores</option>
                        <option value="group:diretor">Diretores</option>`;
                }
            } else {
                input = document.createElement('input');
                input.type = 'text';
                input.value = valorAtual || '';
            }
            input.className = 'edit-field-input';
            input.style.minWidth = '150px';

            const salvarBtn = document.createElement('button');
            salvarBtn.textContent = 'Salvar';
            salvarBtn.className = 'btn btn-sm btn-success';
            const cancelarBtn = document.createElement('button');
            cancelarBtn.textContent = 'Cancelar';
            cancelarBtn.className = 'btn btn-sm btn-secondary';

            wrapper.appendChild(input);
            wrapper.appendChild(salvarBtn);
            wrapper.appendChild(cancelarBtn);
            container.appendChild(wrapper);

            salvarBtn.addEventListener('click', () => {
                let novoValor = input.tagName === 'SELECT' ? input.value : input.value.trim();
                if (campo === 'tipo' && novoValor) {
                    novoValor = novoValor.charAt(0).toUpperCase() + novoValor.slice(1);
                }
                if (novoValor === '' && campo !== 'tipo' && campo !== 'prioridade' && campo !== 'direcionado_para') {
                    alert('O campo não pode ficar vazio.');
                    return;
                }
                if (novoValor === editando.original) {
                    cancelarEdicao();
                    return;
                }
                salvarEdicao(campo, editando.original, novoValor);
            });
            cancelarBtn.addEventListener('click', cancelarEdicao);
        }
        if (input && input.focus) input.focus();
    }

    function cancelarEdicao() {
        if (!editando.campo && !editando.campo2) return;
        const displayEl = document.getElementById(`display-${editando.campo || editando.campo2 || 'static'}`);
        if (displayEl) {
            displayEl.style.display = 'inline';
            const container = displayEl.parentElement;
            const wrapper = container.querySelector('.edit-field-wrapper');
            if (wrapper) wrapper.remove();
            const btn = container.querySelector('.btn-edit');
            if (btn) btn.style.display = 'inline-block';
        }
        editando.campo = null;
        editando.campo2 = null;
        editando.original = null;
    }

    function salvarEdicao(campo, valorAntigo, valorNovo) {
        if (campo === 'tipo' && valorNovo) {
            valorNovo = valorNovo.charAt(0).toUpperCase() + valorNovo.slice(1);
        }
        const updateData = {};
        updateData[campo] = valorNovo;

        if (campo === 'direcionado_para') {
            let nome = '';
            let funcao = '';
            if (valorNovo === 'group:admin') {
                nome = 'Administradores';
                funcao = 'admin';
            } else if (valorNovo === 'group:diretor') {
                nome = 'Diretores';
                funcao = 'diretor';
            } else {
                const user = userMap[valorNovo];
                if (user) {
                    nome = user.nome;
                    funcao = user.funcao;
                }
            }
            updateData.direcionado_para_nome = nome || valorNovo;
            updateData.direcionado_para_funcao = funcao || '';
        }

        const edicoes = osData.edicoes || {};
        if (!edicoes[campo]) edicoes[campo] = [];
        edicoes[campo].push({
            data: new Date().toISOString(),
            valor_antigo: valorAntigo,
            valor_novo: valorNovo
        });
        updateData.edicoes = edicoes;
        updateData.atualizado_em = new Date().toISOString();

        db.collection('ordens_servico').doc(osId).update(updateData)
            .then(() => {
                osData[campo] = valorNovo;
                osData.edicoes = edicoes;
                osData.atualizado_em = new Date().toISOString();
                if (campo === 'direcionado_para') {
                    osData.direcionado_para_nome = updateData.direcionado_para_nome || '';
                    osData.direcionado_para_funcao = updateData.direcionado_para_funcao || '';
                }
                cancelarEdicao();
                renderizarDetalhe();
            })
            .catch(err => alert('Erro ao salvar: ' + err.message));
    }

    function salvarEdicaoDupla(campo1, campo2, antigo1, antigo2, novo1, novo2) {
        if (novo2) novo2 = formatarLote(novo2);
        const updateData = {};
        updateData[campo1] = novo1;
        updateData[campo2] = novo2;

        const edicoes = osData.edicoes || {};
        if (!edicoes[campo1]) edicoes[campo1] = [];
        edicoes[campo1].push({
            data: new Date().toISOString(),
            valor_antigo: antigo1,
            valor_novo: novo1
        });
        if (!edicoes[campo2]) edicoes[campo2] = [];
        edicoes[campo2].push({
            data: new Date().toISOString(),
            valor_antigo: antigo2,
            valor_novo: novo2
        });
        updateData.edicoes = edicoes;
        updateData.atualizado_em = new Date().toISOString();

        db.collection('ordens_servico').doc(osId).update(updateData)
            .then(() => {
                osData[campo1] = novo1;
                osData[campo2] = novo2;
                osData.edicoes = edicoes;
                osData.atualizado_em = new Date().toISOString();
                cancelarEdicao();
                renderizarDetalhe();
            })
            .catch(err => alert('Erro ao salvar: ' + err.message));
    }

    // ================================================================
    // POPULAR DIRECIONAMENTO (com cores)
    // ================================================================
    function popularDirecionamento() {
        const select = document.getElementById('acaoDirecionar');
        if (!select) return;

        select.innerHTML = '';

        const optDefault = document.createElement('option');
        optDefault.value = '';
        optDefault.textContent = 'Manter destino atual';
        select.appendChild(optDefault);

        const optGroupAdmin = document.createElement('option');
        optGroupAdmin.value = 'group:admin';
        optGroupAdmin.textContent = 'GRUPO: Administradores';
        optGroupAdmin.className = 'grupo';
        optGroupAdmin.style.backgroundColor = '#ced4da';
        select.appendChild(optGroupAdmin);

        const optGroupDiretor = document.createElement('option');
        optGroupDiretor.value = 'group:diretor';
        optGroupDiretor.textContent = 'GRUPO: Diretores';
        optGroupDiretor.className = 'grupo';
        optGroupDiretor.style.backgroundColor = '#ced4da';
        select.appendChild(optGroupDiretor);

        const admins = [], diretores = [];
        Object.keys(userMap).forEach(uid => {
            const u = userMap[uid];
            if (u.funcao === 'admin') admins.push({uid, nome: u.nome});
            else if (u.funcao === 'diretor') diretores.push({uid, nome: u.nome});
        });
        admins.sort((a,b) => a.nome.localeCompare(b.nome));
        diretores.sort((a,b) => a.nome.localeCompare(b.nome));

        admins.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a.uid;
            opt.textContent = `${a.nome} (admin)`;
            opt.className = 'admin';
            opt.style.backgroundColor = '#ffe082';
            select.appendChild(opt);
        });

        diretores.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.uid;
            opt.textContent = `${d.nome} (diretor)`;
            opt.className = 'diretor';
            opt.style.backgroundColor = '#a5d6a7';
            select.appendChild(opt);
        });
    }

    // ================================================================
    // ADICIONAR AÇÃO
    // ================================================================
    function adicionarAcao(descricao, direcionarPara) {
        const agora = new Date().toISOString();
        const historico = osData.historico || [];
        const novaAcao = {
            data: agora,
            acao: 'ação',
            usuario_uid: currentUser.uid,
            usuario: currentUserData?.nome || 'Usuário',
            mensagem: descricao,
        };
        if (direcionarPara) {
            const select = document.getElementById('acaoDirecionar');
            const destinoNome = select?.options[select.selectedIndex]?.text || direcionarPara;
            novaAcao.direcionado_para = direcionarPara;
            novaAcao.direcionado_para_nome = destinoNome;
            if (direcionarPara !== 'group:admin' && direcionarPara !== 'group:diretor' && userMap[direcionarPara]) {
                novaAcao.direcionado_para_funcao = userMap[direcionarPara].funcao;
            } else if (direcionarPara === 'group:admin') {
                novaAcao.direcionado_para_funcao = 'admin';
            } else if (direcionarPara === 'group:diretor') {
                novaAcao.direcionado_para_funcao = 'diretor';
            }
        }
        historico.push(novaAcao);

        const updateData = {
            historico: historico,
            atualizado_em: agora
        };
        if (direcionarPara) {
            updateData.direcionado_para = direcionarPara;
            updateData.direcionado_para_nome = novaAcao.direcionado_para_nome;
            updateData.direcionado_para_funcao = novaAcao.direcionado_para_funcao;
        }

        db.collection('ordens_servico').doc(osId).update(updateData)
            .then(() => {
                osData.historico = historico;
                if (direcionarPara) {
                    osData.direcionado_para = updateData.direcionado_para;
                    osData.direcionado_para_nome = updateData.direcionado_para_nome;
                    osData.direcionado_para_funcao = updateData.direcionado_para_funcao;
                }
                osData.atualizado_em = agora;
                document.getElementById('acaoDescricao').value = '';
                document.getElementById('acaoDirecionar').value = '';
                mostrarMensagemAcao('✅ Ação adicionada com sucesso!', 'success');
                renderizarDetalhe();
                setTimeout(() => { esconderMensagemAcao(); }, 3000);
            })
            .catch(err => {
                mostrarMensagemAcao('Erro: ' + err.message, 'error');
            });
    }

    function mostrarMensagemAcao(texto, tipo) {
        const el = document.getElementById('acaoMessage');
        if (!el) return;
        el.textContent = texto;
        el.className = 'message';
        if (tipo === 'error') el.classList.add('error');
        else if (tipo === 'success') el.classList.add('success');
        el.style.display = 'block';
    }
    function esconderMensagemAcao() {
        const el = document.getElementById('acaoMessage');
        if (el) el.style.display = 'none';
    }

    // ================================================================
    // CONCLUIR OS
    // ================================================================
    function concluirOS() {
        if (!confirm('Deseja concluir esta OS?')) return;
        const agora = new Date().toISOString();
        const historico = osData.historico || [];
        historico.push({
            data: agora,
            acao: 'conclusão',
            usuario_uid: currentUser.uid,
            usuario: currentUserData?.nome || 'Usuário',
            mensagem: 'OS concluída'
        });

        db.collection('ordens_servico').doc(osId).update({
            status: 'concluida',
            historico: historico,
            atualizado_em: agora
        })
        .then(() => {
            osData.status = 'concluida';
            osData.historico = historico;
            osData.atualizado_em = agora;
            renderizarDetalhe();
        })
        .catch(err => alert('Erro: ' + err.message));
    }

    // ================================================================
    // REABRIR OS
    // ================================================================
    function reabrirOS() {
        if (!confirm('Deseja reabrir esta OS?')) return;
        const agora = new Date().toISOString();
        const historico = osData.historico || [];
        historico.push({
            data: agora,
            acao: 'reabertura',
            usuario_uid: currentUser.uid,
            usuario: currentUserData?.nome || 'Usuário',
            mensagem: 'OS reaberta'
        });

        db.collection('ordens_servico').doc(osId).update({
            status: 'em_andamento',
            historico: historico,
            atualizado_em: agora
        })
        .then(() => {
            osData.status = 'em_andamento';
            osData.historico = historico;
            osData.atualizado_em = agora;
            renderizarDetalhe();
        })
        .catch(err => alert('Erro: ' + err.message));
    }

    // ================================================================
    // INICIALIZAÇÃO
    // ================================================================
    function init() {
        const params = new URLSearchParams(window.location.search);
        osId = params.get('id');
        if (!osId) {
            historicoContainer.innerHTML = '<p style="color:red;">ID da OS não fornecido.</p>';
            return;
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                db.collection('usuarios').doc(user.uid).get()
                    .then(doc => {
                        if (doc.exists) currentUserData = doc.data();
                        else currentUserData = { nome: user.displayName || 'Usuário', funcao: 'tecnico' };
                        carregarUsuarios().then(() => carregarOS());
                    })
                    .catch(() => {
                        currentUserData = { nome: user.displayName || 'Usuário', funcao: 'tecnico' };
                        carregarUsuarios().then(() => carregarOS());
                    });
            } else {
                window.location.href = 'index.html';
            }
        });
    }

    init();
</script>
</body>
</html>
