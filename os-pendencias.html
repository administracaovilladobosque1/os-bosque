<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Log de Pendências - Villa do Bosque</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Calibri', 'Segoe UI', Tahoma, sans-serif; }
        body { background: #e8f5e9; padding: 16px 12px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: #fff; max-width: 780px; width: 100%; padding: 20px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,80,0,0.12); border: 1px solid #a5d6a7; transition: border-color 0.2s, box-shadow 0.2s; }
        .container.modo-restritas {
            border-color: #212121;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }

        .user-header {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #1b5e20;
        }
        .user-header .uh-label { font-weight: 500; color: #558b2f; }
        .uh-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #000;
            white-space: nowrap;
        }
        .uh-badge.master { background: #ffcc80; }
        .uh-badge.admin { background: #ffe082; }
        .uh-badge.diretor { background: #a5d6a7; }
        .uh-badge.tecnico { background: #ced4da; }

        .page-title { font-size: 24px; color: #1b5e20; background: #c8e6c9; display: inline-block; padding: 4px 18px; border-radius: 30px; margin-bottom: 12px; }
        .container.modo-restritas .page-title {
            background: #212121;
            color: #ffd54f;
            border: 2px solid #ffd54f;
        }

        .btn { padding: 10px 16px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn:hover { background: #1b5e20; }
        .btn-success { background: #388e3c; }
        .btn-success:hover { background: #2e7d32; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-voltar { background: #558b2f; padding: 6px 14px; font-size: 13px; margin-bottom: 12px; }
        .btn-voltar:hover { background: #33691e; }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; font-size: 13px; color: #1b5e20; margin-bottom: 4px; }
        select {
            width: 100%; padding: 10px 12px;
            border: 1px solid #a5d6a7; border-radius: 8px;
            font-size: 15px; background: #fafffe;
            font-family: inherit;
        }
        select:focus { outline: none; border-color: #2e7d32; box-shadow: 0 0 0 2px rgba(46,125,50,0.15); }
        select option[value="restritas"] {
            background: #212121;
            color: #ffd54f;
            font-weight: 700;
        }

        .nota-restritas {
            background: #212121;
            color: #ffd54f;
            border: 2px solid #000;
            border-left: 6px solid #ffd54f;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.45;
        }
        .nota-restritas .icone-lock { font-size: 22px; flex-shrink: 0; }

        .personagens-filtro { margin-bottom: 14px; }
        .personagens-bloco {
            border: 1px solid #c8e6c9;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            background: #f8fdf8;
        }
        .personagens-bloco.bloco-admin { border-left: 5px solid #ffe082; background: #fffde7; }
        .personagens-bloco.bloco-diretor { border-left: 5px solid #a5d6a7; background: #f1f8e9; }
        .personagens-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .personagens-titulo {
            font-weight: 700;
            font-size: 14.5px;
            color: #1b5e20;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .personagens-titulo .icone-role { font-size: 18px; }
        .personagens-titulo.bloco-admin-titulo { color: #4e342e; }
        .personagens-titulo.bloco-diretor-titulo { color: #1b5e20; }

        .mini-contadores {
            display: inline-flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-left: 6px;
        }
        .mini-contador {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11.5px;
            font-weight: 700;
            white-space: nowrap;
        }
        .mini-contador.mc-abertas { background: #e3f2fd; color: #0d47a1; border: 1px solid #90caf9; }
        .mini-contador.mc-atrasadas { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
        .mini-contador.mc-zero { background: #eceff1; color: #78909c; border: 1px solid #cfd8dc; }

        .personagens-contador {
            font-size: 12px;
            color: #558b2f;
            font-weight: 600;
        }
        .personagens-lista {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .personagens-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            background: #fff;
            border: 1.5px solid #c8e6c9;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            transition: 0.15s;
            line-height: 1.2;
        }
        .personagens-item:hover { background: #e8f5e9; }
        .personagens-item input[type="checkbox"] {
            margin: 0;
            cursor: pointer;
            width: 14px;
            height: 14px;
            accent-color: #2e7d32;
            flex-shrink: 0;
        }
        .personagens-item span { white-space: nowrap; }

        .personagens-item.item-admin { border-color: #ffe082; background: #fffde7; }
        .personagens-item.item-admin:hover { background: #fff9c4; }
        .personagens-item.item-diretor { border-color: #a5d6a7; background: #f1f8e9; }
        .personagens-item.item-diretor:hover { background: #dcedc8; }
        .personagens-item.item-grupo { font-weight: 700; }
        .personagens-item.item-todos {
            border-color: #2e7d32;
            background: #e8f5e9;
            font-weight: 700;
            color: #1b5e20;
        }
        .personagens-item.item-todos:hover { background: #c8e6c9; }
        .personagens-item input:checked ~ span { color: #1b5e20; font-weight: 600; }

        .info-resumo {
            background: linear-gradient(135deg, #f1f8e9 0%, #e8f5e9 100%);
            border: 1px solid #c8e6c9;
            border-left: 5px solid #2e7d32;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .info-resumo.modo-restritas {
            background: linear-gradient(135deg, #212121 0%, #2a2a2a 100%);
            border-color: #000;
            border-left-color: #ffd54f;
        }
        .info-resumo.modo-restritas .stat-numero { color: #ffd54f; }
        .info-resumo.modo-restritas .stat-label { color: #b0b0b0; }
        .info-resumo.modo-restritas .info-stat-divisor { background: #444; }
        .info-resumo.modo-restritas .info-desc { color: #ffd54f; }
        .info-resumo.modo-restritas .info-desc-sub { color: #999; }

        .info-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }
        .info-stat .stat-numero {
            font-size: 26px;
            font-weight: 800;
            line-height: 1;
            color: #1b5e20;
        }
        .info-stat .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #558b2f;
            font-weight: 700;
            margin-top: 2px;
        }
        .info-stat.info-stat-atraso .stat-numero { color: #c62828; }
        .info-stat.info-stat-atraso .stat-label { color: #c62828; }
        .info-resumo.modo-restritas .info-stat.info-stat-atraso .stat-numero { color: #ff6b6b; }
        .info-resumo.modo-restritas .info-stat.info-stat-atraso .stat-label { color: #ff6b6b; }
        .info-stat.info-stat-atraso.tem-atraso .stat-numero {
            animation: pulseAtraso 2s infinite;
        }
        @keyframes pulseAtraso {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }
        .info-stat-divisor {
            width: 1px;
            height: 38px;
            background: #c8e6c9;
        }
        .info-desc {
            font-size: 15px;
            font-weight: 700;
            color: #1b5e20;
            margin-left: auto;
            text-align: right;
        }
        .info-desc .info-desc-sub {
            display: block;
            font-size: 11.5px;
            font-weight: 500;
            color: #558b2f;
            margin-top: 2px;
        }

        textarea#textoGerado {
            width: 100%;
            min-height: 420px;
            padding: 16px;
            border: 1px solid #a5d6a7;
            border-radius: 10px;
            font-family: 'Consolas', 'Menlo', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.55;
            background: #f8fdf8;
            color: #1b3a1e;
            resize: vertical;
            white-space: pre-wrap;
            word-break: break-word;
        }
        textarea#textoGerado:focus { outline: none; border-color: #2e7d32; box-shadow: 0 0 0 3px rgba(46,125,50,0.15); }
        textarea#textoGerado.modo-restritas {
            background: #1e1e1e;
            border-color: #ffd54f;
            color: #ffd54f;
        }

        .acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
        .acoes .btn { flex: 1 1 auto; text-align: center; }

        .message { margin-top: 12px; padding: 10px 14px; border-radius: 8px; display: none; font-size: 14px; font-weight: 600; }
        .message.error { display: block; background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
        .message.success { display: block; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
        .message.info { display: block; background: #e3f2fd; color: #0d47a1; border: 1px solid #90caf9; }

        @media (max-width: 600px) {
            body { padding: 10px 8px; }
            .container { padding: 14px; border-radius: 12px; }
            .page-title { font-size: 20px; }
            .personagens-item { font-size: 12.5px; padding: 4px 10px; }
            textarea#textoGerado { min-height: 360px; font-size: 13px; padding: 12px; }
            .acoes .btn { flex: 1 1 100%; }
            .info-desc { margin-left: 0; text-align: left; }
            .info-stat .stat-numero { font-size: 22px; }
        }
    </style>
</head>
<body>
<div class="container" id="containerPrincipal">
    <div class="user-header" id="userHeader">
        <span class="uh-label">Logado como:</span>
        <span class="uh-badge tecnico" id="userHeaderBadge">—</span>
    </div>

    <h1 class="page-title" id="pageTitle">📢 Log de Pendências</h1>
    <div><a href="index.html" class="btn btn-voltar">← Voltar</a></div>

    <div class="form-group">
        <label for="tipoLog">Destino das pendências</label>
        <select id="tipoLog">
            <option value="admin">🏛️ Administração</option>
            <option value="diretor">⚖️ Diretoria</option>
            <option value="todas">📋 TODAS (admin + diretoria)</option>
            <option value="restritas" id="optRestritas">🔒 Apenas OS Restritas</option>
        </select>
    </div>

    <div id="personagensFiltro" class="personagens-filtro"></div>

    <div class="info-resumo" id="infoResumo">
        <div class="info-stat">
            <span class="stat-numero" id="contadorAbertas">0</span>
            <span class="stat-label">abertas</span>
        </div>
        <div class="info-stat-divisor"></div>
        <div class="info-stat info-stat-atraso" id="statAtraso">
            <span class="stat-numero" id="contadorAtrasadas">0</span>
            <span class="stat-label">atrasadas</span>
        </div>
        <div class="info-desc" id="contadorLabel">
            Para ADMINISTRAÇÃO
            <span class="info-desc-sub" id="contadorSub">0 em dia · 0 atrasadas</span>
        </div>
    </div>

    <textarea id="textoGerado" readonly placeholder="O texto aparecerá aqui..."></textarea>

    <div class="acoes">
        <button class="btn btn-success" id="btnCopiar" type="button">📋 Copiar texto</button>
        <button class="btn btn-secondary" id="btnAtualizar" type="button">🔄 Atualizar</button>
    </div>

    <div id="msg" class="message"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDx_6oWO30Drh8GkuQA9jk2Oym7H8J3ABg",
        authDomain: "villa-bosque1.firebaseapp.com",
        projectId: "villa-bosque1",
        storageBucket: "villa-bosque1.firebasestorage.app",
        messagingSenderId: "372474036025",
        appId: "1:372474036025:web:bbbee10723469d77cbb2e8"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    db.enablePersistence({ synchronizeTabs: true }).catch(err => {
        if (err.code === 'failed-precondition') console.warn('Persistência: múltiplas abas abertas.');
        else if (err.code === 'unimplemented') console.warn('Persistência: navegador não suporta.');
    });

    const MASTER_EMAIL = 'administracaovilladobosque@gmail.com';
    const TIMEOUT_MS = 4 * 60 * 60 * 1000;
    const TIMEOUT_KEY = 'vb_lastActivity';
    const TIMEOUT_CHECK_INTERVAL = 30 * 1000;

    const USER_CACHE_KEY = 'vb_userMapCache';
    const USER_CACHE_TTL = 10 * 60 * 1000;

    const SLA_HORAS = { 'emergencial': 24, 'urgente': 72, 'normal': 168 };

    let currentUser = null;
    let currentUserData = null;

    function salvarUserMapNoCache(map) {
        try {
            sessionStorage.setItem(USER_CACHE_KEY, JSON.stringify({
                dados: map, expiraEm: Date.now() + USER_CACHE_TTL
            }));
        } catch(e) {}
    }
    function lerUserMapDoCache() {
        try {
            const raw = sessionStorage.getItem(USER_CACHE_KEY);
            if (!raw) return null;
            const obj = JSON.parse(raw);
            if (!obj || !obj.expiraEm || obj.expiraEm < Date.now()) {
                sessionStorage.removeItem(USER_CACHE_KEY); return null;
            }
            return obj.dados || null;
        } catch(e) { return null; }
    }

    function registrarAtividade() { try { localStorage.setItem(TIMEOUT_KEY, Date.now().toString()); } catch(e) {} }
    function fazerLogoutTimeout() {
        if (window.__fazendoLogout) return;
        window.__fazendoLogout = true;
        try { localStorage.removeItem(TIMEOUT_KEY); localStorage.removeItem('vb_userLoggedIn'); sessionStorage.clear(); } catch(e) {}
        auth.signOut().finally(() => {
            alert('Sessão expirada por inatividade. Faça login novamente.');
            window.location.href = 'index.html';
        });
    }
    function fazerLogoutInativo() {
        if (window.__fazendoLogout) return;
        window.__fazendoLogout = true;
        try { localStorage.removeItem(TIMEOUT_KEY); localStorage.removeItem('vb_userLoggedIn'); sessionStorage.clear(); } catch(e) {}
        auth.signOut().finally(() => {
            alert('Sua conta está inativa. Entre em contato com o administrador.');
            window.location.href = 'index.html';
        });
    }
    function verificarTimeoutAgora() {
        const last = parseInt(localStorage.getItem(TIMEOUT_KEY) || '0', 10);
        if (!last) return false;
        if ((Date.now() - last) > TIMEOUT_MS) { fazerLogoutTimeout(); return true; }
        return false;
    }
    function iniciarMonitorTimeout() {
        if (verificarTimeoutAgora()) return;
        if (!localStorage.getItem(TIMEOUT_KEY)) registrarAtividade();
        ['click','mousemove','keydown','scroll','touchstart'].forEach(ev => {
            document.addEventListener(ev, registrarAtividade, { passive: true });
        });
        setInterval(verificarTimeoutAgora, TIMEOUT_CHECK_INTERVAL);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') verificarTimeoutAgora();
        });
    }

    const tipoLogSelect = document.getElementById('tipoLog');
    const optRestritas = document.getElementById('optRestritas');
    const personagensFiltroEl = document.getElementById('personagensFiltro');
    const textoGerado = document.getElementById('textoGerado');
    const btnCopiar = document.getElementById('btnCopiar');
    const btnAtualizar = document.getElementById('btnAtualizar');
    const msgEl = document.getElementById('msg');
    const contadorAbertas = document.getElementById('contadorAbertas');
    const contadorAtrasadas = document.getElementById('contadorAtrasadas');
    const contadorLabel = document.getElementById('contadorLabel');
    const contadorSub = document.getElementById('contadorSub');
    const statAtraso = document.getElementById('statAtraso');
    const userHeaderBadge = document.getElementById('userHeaderBadge');
    const containerPrincipal = document.getElementById('containerPrincipal');
    const pageTitle = document.getElementById('pageTitle');
    const infoResumo = document.getElementById('infoResumo');

    let userMap = {};
    let allDocs = [];

    const modoSelecao = { admin: 'todos', diretor: 'todos' };
    const sel = { admin: new Set(), diretor: new Set() };

    function getBaseUrl() {
        return window.location.origin + window.location.pathname.replace(/[^\/]*$/, '');
    }
    function getUrlOS(osId) {
        return `${getBaseUrl()}os-detalhe.html?id=${encodeURIComponent(osId)}`;
    }

    function ehDiretorOuMaster() {
        if (!currentUser) return false;
        if (currentUser.email === MASTER_EMAIL) return true;
        const f = currentUserData?.funcao;
        return f === 'diretor' || f === 'master';
    }
    function podeVerOS(os) {
        if (!os) return false;
        if (os.restrita !== true) return true;
        return ehDiretorOuMaster();
    }
    function isRestrita(os) {
        return os && os.restrita === true;
    }

    function limparSufixoFuncao(nome) {
        if (!nome) return '';
        return String(nome).replace(/\s*\([^)]*\)\s*$/, '').trim();
    }
    function detectarFuncao(nome, uid, funcaoDireta) {
        if (funcaoDireta) return funcaoDireta;
        if (uid && userMap[uid]) return userMap[uid].funcao;
        const n = (limparSufixoFuncao(nome) || '').toLowerCase();
        if (n === 'admin' || n === 'administrador' || n === 'administradores') return 'admin';
        if (n === 'diretor' || n === 'diretores' || n === 'diretoria') return 'diretor';
        if (n === 'master' || n === 'masters') return 'master';
        if (n.includes('admin')) return 'admin';
        if (n.includes('diretor')) return 'diretor';
        if (n.includes('master')) return 'master';
        return null;
    }
    function classificarDestino(alvo, nome, funcao) {
        const nomeLimpo = limparSufixoFuncao(nome);
        const base = (nomeLimpo || '').toLowerCase();

        if (alvo === 'group:admin') return { tipo:'grupo', subtipo:'admin', texto:'Administração', cor:'#ffe082' };
        if (alvo === 'group:diretor') return { tipo:'grupo', subtipo:'diretor', texto:'Diretores', cor:'#a5d6a7' };

        if (alvo && typeof alvo === 'string' && !alvo.startsWith('group:')) {
            const f = (userMap[alvo] && userMap[alvo].funcao) || funcao || detectarFuncao(nomeLimpo, alvo, null);
            let cor = '#ced4da';
            if (f === 'admin') cor = '#ffe082';
            else if (f === 'diretor') cor = '#a5d6a7';
            else if (f === 'master') cor = '#ffcc80';
            let texto = nomeLimpo || '—';
            if (f && !texto.includes('(')) texto = `${texto} (${f})`;
            return { tipo:'pessoa', funcao:f, texto, cor };
        }

        if (base === 'admin' || base === 'administrador' || base === 'administradores' ||
            base === 'administração' || base === 'administracao') {
            return { tipo:'grupo', subtipo:'admin', texto:'Administração', cor:'#ffe082' };
        }
        if (base === 'diretor' || base === 'diretores' || base === 'diretoria') {
            return { tipo:'grupo', subtipo:'diretor', texto:'Diretores', cor:'#a5d6a7' };
        }
        if (base === 'master' || base === 'masters') {
            return { tipo:'grupo', subtipo:'master', texto:'Masters', cor:'#ffcc80' };
        }

        const f = funcao || detectarFuncao(nomeLimpo, alvo, null);
        let cor = '#ced4da';
        if (f === 'admin') cor = '#ffe082';
        else if (f === 'diretor') cor = '#a5d6a7';
        else if (f === 'master') cor = '#ffcc80';
        let texto = nomeLimpo || '—';
        if (f && !texto.includes('(')) texto = `${texto} (${f})`;
        return { tipo:'pessoa', funcao:f, texto, cor };
    }
    function getPendenteCategoria(data) {
        const c = classificarDestino(data.direcionado_para, data.direcionado_para_nome, data.direcionado_para_funcao);
        if (c.tipo === 'grupo') {
            if (c.subtipo === 'diretor') return 'diretoria';
            if (c.subtipo === 'admin') return 'admin';
            return 'outros';
        }
        if (c.funcao === 'diretor') return 'diretoria';
        if (c.funcao === 'admin') return 'admin';
        return 'outros';
    }

    function getDataPendente(data) {
        return data.direcionado_em || data.criado_em;
    }
    function isAtrasada(data) {
        if (!data) return false;
        const s = (data.status || '').toLowerCase();
        if (s === 'concluida' || s === 'cancelada') return false;
        const dataBase = getDataPendente(data);
        if (!dataBase) return false;
        const limite = SLA_HORAS[data.prioridade || 'normal'] || 168;
        const horas = (Date.now() - new Date(dataBase).getTime()) / (1000 * 60 * 60);
        return horas > limite;
    }

    function formatarDataHoraAgora() {
        const d = new Date();
        const dia = String(d.getDate()).padStart(2, '0');
        const mes = String(d.getMonth()+1).padStart(2, '0');
        const ano = d.getFullYear();
        const hora = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${dia}/${mes}/${ano} às ${hora}:${min}`;
    }

    function tempoDecorrido(dataISO) {
        if (!dataISO) return '—';
        const d = new Date(dataISO);
        if (isNaN(d)) return '—';
        const diffHoras = Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60));
        if (diffHoras < 1) return 'menos de 1 hora';
        if (diffHoras < 24) return `${diffHoras} hora${diffHoras === 1 ? '' : 's'}`;
        const dias = Math.floor(diffHoras / 24);
        return `${dias} dia${dias === 1 ? '' : 's'}`;
    }

    function getUltimoCardMensagem(os) {
        const acoes = (os.historico || [])
            .filter(h => h.acao && h.acao !== 'abertura' && h.acao !== 'edicao')
            .sort((a, b) => (a.data || '').localeCompare(b.data || ''));
        if (acoes.length === 0) {
            return (os.descricao || '').trim();
        }
        const ultima = acoes[acoes.length - 1];
        return (ultima.mensagem || '').trim();
    }

    // ============================================================
    // ENQUETE ABERTA — detecta se a OS tem enquete aguardando voto
    // ============================================================
    function temEnqueteAberta(os) {
        const hist = os.historico || [];
        const agora = Date.now();
        for (let i = hist.length - 1; i >= 0; i--) {
            const h = hist[i];
            if (h.acao === 'enquete' && h.enquete) {
                const enq = h.enquete;
                if (enq.status === 'aberta' && new Date(enq.prazo).getTime() > agora) {
                    return enq;
                }
            }
        }
        return null;
    }

    function getResponsavelTexto(os) {
        const c = classificarDestino(os.direcionado_para, os.direcionado_para_nome, os.direcionado_para_funcao);
        if (c.tipo === 'grupo') {
            if (c.subtipo === 'admin') return 'Administração';
            if (c.subtipo === 'diretor') return 'Diretoria';
            if (c.subtipo === 'master') return 'Master';
            return c.texto;
        }
        return c.texto;
    }

    function getNomeDetentor(os) {
        const alvo = os.direcionado_para;
        if (!alvo) return null;
        if (alvo === 'group:admin') return 'Administração';
        if (alvo === 'group:diretor') return 'Diretoria';

        const c = classificarDestino(alvo, os.direcionado_para_nome, os.direcionado_para_funcao);
        if (c.tipo === 'grupo') {
            if (c.subtipo === 'admin') return 'Administração';
            if (c.subtipo === 'diretor') return 'Diretoria';
            if (c.subtipo === 'master') return 'Master';
            return c.texto;
        }
        const nomeLimpo = limparSufixoFuncao(os.direcionado_para_nome);
        if (nomeLimpo) return nomeLimpo;
        if (userMap[alvo] && userMap[alvo].nome) return userMap[alvo].nome;
        return alvo;
    }

    function getDetentoresTexto(listaOS) {
        if (!listaOS || listaOS.length === 0) return '';
        const mapa = {};
        listaOS.forEach(os => {
            const nome = getNomeDetentor(os);
            if (!nome) return;
            mapa[nome] = (mapa[nome] || 0) + 1;
        });
        const entries = Object.entries(mapa).sort((a, b) => {
            if (b[1] !== a[1]) return b[1] - a[1];
            return a[0].localeCompare(b[0]);
        });
        return entries.map(([nome, qtd]) => `${nome}: ${qtd} OS`).join('; ');
    }

    function getPersonagensPorFuncao(role) {
        const catEsperada = role === 'admin' ? 'admin' : 'diretoria';
        const mapa = {};

        Object.keys(userMap).forEach(uid => {
            if (userMap[uid].funcao === role) {
                mapa[uid] = userMap[uid].nome || uid;
            }
        });

        allDocs.forEach(os => {
            const s = (os.status || '').toLowerCase();
            if (s !== 'aberta' && s !== 'em_andamento') return;
            if (isRestrita(os)) return;
            const alvo = os.direcionado_para;
            if (!alvo || alvo.startsWith('group:')) return;
            if (mapa[alvo]) return;
            if (getPendenteCategoria(os) !== catEsperada) return;
            mapa[alvo] = os.direcionado_para_nome || alvo;
        });

        return Object.keys(mapa)
            .map(uid => ({ uid, nome: mapa[uid] }))
            .sort((a, b) => a.nome.localeCompare(b.nome));
    }

    function getGrupoKey(role) {
        return role === 'admin' ? 'group:admin' : 'group:diretor';
    }

    function getAllKeys(role) {
        const grupoKey = getGrupoKey(role);
        const pessoas = getPersonagensPorFuncao(role);
        return [grupoKey, ...pessoas.map(p => p.uid)];
    }

    function sincronizarSel(role) {
        const allKeys = getAllKeys(role);
        if (modoSelecao[role] === 'todos') {
            sel[role] = new Set(allKeys);
        } else {
            const novo = new Set();
            sel[role].forEach(k => { if (allKeys.includes(k)) novo.add(k); });
            sel[role] = novo;
        }
    }

    function contarPorRole(role, incluirRestritas) {
        const catEsperada = role === 'admin' ? 'admin' : 'diretoria';
        sincronizarSel(role);
        let abertas = 0, atrasadas = 0, emDia = 0;
        allDocs.forEach(os => {
            const s = (os.status || '').toLowerCase();
            if (s !== 'aberta' && s !== 'em_andamento') return;
            if (!podeVerOS(os)) return;
            if (!incluirRestritas && isRestrita(os)) return;
            if (getPendenteCategoria(os) !== catEsperada) return;
            const alvo = os.direcionado_para;
            if (!alvo) return;
            if (!sel[role].has(alvo)) return;
            abertas++;
            if (isAtrasada(os)) atrasadas++;
            else emDia++;
        });
        return { abertas, atrasadas, emDia };
    }

    function renderPersonagensFiltro() {
        const tipo = tipoLogSelect.value;
        personagensFiltroEl.innerHTML = '';

        if (tipo === 'restritas') {
            personagensFiltroEl.innerHTML = `
                <div class="nota-restritas">
                    <span class="icone-lock">🔒</span>
                    <span>Exibindo <strong>somente as OS restritas</strong> à diretoria. Este log deve ser tratado com sigilo — não compartilhe fora do grupo de diretores.</span>
                </div>
            `;
            atualizarTela();
            return;
        }

        const roles = [];
        if (tipo === 'todas') roles.push('admin', 'diretor');
        else roles.push(tipo);

        roles.forEach(role => {
            sincronizarSel(role);
            const bloco = criarBlocoPersonagens(role);
            personagensFiltroEl.appendChild(bloco);
        });

        atualizarTela();
    }

    function criarBlocoPersonagens(role) {
        const grupoKey = getGrupoKey(role);
        const pessoas = getPersonagensPorFuncao(role);
        const allKeys = getAllKeys(role);
        const todosMarcados = allKeys.length > 0 && allKeys.every(k => sel[role].has(k));

        const contagens = contarPorRole(role, false);

        const bloco = document.createElement('div');
        bloco.className = 'personagens-bloco bloco-' + role;

        const icone = role === 'admin' ? '🏛️' : '⚖️';
        const titulo = role === 'admin' ? 'Administração' : 'Diretoria';
        const grupoLabel = role === 'admin' ? 'Administração (grupo)' : 'Diretoria (grupo)';
        const classeTitulo = role === 'admin' ? 'bloco-admin-titulo' : 'bloco-diretor-titulo';

        const badgeAbertas = contagens.abertas > 0
            ? `<span class="mini-contador mc-abertas">📂 ${contagens.abertas} aberta${contagens.abertas === 1 ? '' : 's'}</span>`
            : `<span class="mini-contador mc-zero">📂 0 abertas</span>`;

        const badgeAtrasadas = contagens.atrasadas > 0
            ? `<span class="mini-contador mc-atrasadas">⚠️ ${contagens.atrasadas} atrasada${contagens.atrasadas === 1 ? '' : 's'}</span>`
            : `<span class="mini-contador mc-zero">✓ sem atraso</span>`;

        let html = `
            <div class="personagens-header">
                <span class="personagens-titulo ${classeTitulo}">
                    <span class="icone-role">${icone}</span>
                    ${titulo}
                    <span class="mini-contadores">
                        ${badgeAbertas}
                        ${badgeAtrasadas}
                    </span>
                </span>
                <span class="personagens-contador" data-contador="${role}"></span>
            </div>
            <div class="personagens-lista">
                <label class="personagens-item item-todos">
                    <input type="checkbox" data-todos="${role}" ${todosMarcados ? 'checked' : ''}>
                    <span>✓ Todos</span>
                </label>
                <label class="personagens-item item-${role} item-grupo">
                    <input type="checkbox" data-role="${role}" data-key="${grupoKey}" ${sel[role].has(grupoKey) ? 'checked' : ''}>
                    <span>${grupoLabel}</span>
                </label>
        `;

        pessoas.forEach(p => {
            html += `
                <label class="personagens-item item-${role}">
                    <input type="checkbox" data-role="${role}" data-key="${p.uid}" ${sel[role].has(p.uid) ? 'checked' : ''}>
                    <span>${p.nome}</span>
                </label>
            `;
        });

        html += `</div>`;
        bloco.innerHTML = html;

        atualizarContadorBloco(bloco, role);
        return bloco;
    }

    function atualizarContadorBloco(bloco, role) {
        const el = bloco.querySelector(`[data-contador="${role}"]`);
        if (!el) return;
        const total = getAllKeys(role).length;
        const marcados = sel[role].size;
        if (total === 0) {
            el.textContent = 'nenhum cadastrado';
        } else if (marcados === total) {
            el.textContent = `todos (${total})`;
        } else {
            el.textContent = `${marcados} de ${total}`;
        }
    }

    personagensFiltroEl.addEventListener('change', (e) => {
        const input = e.target;
        if (!input.matches('input[type="checkbox"]')) return;

        const roleTodos = input.dataset.todos;
        const role = input.dataset.role;
        const key = input.dataset.key;

        if (roleTodos) {
            sincronizarSel(roleTodos);
            if (input.checked) {
                modoSelecao[roleTodos] = 'todos';
                sel[roleTodos] = new Set(getAllKeys(roleTodos));
            } else {
                modoSelecao[roleTodos] = 'custom';
                sel[roleTodos] = new Set();
            }
            atualizarCheckboxesDoBloco(roleTodos);
            atualizarTodosOsContadores();
        } else if (role && key) {
            sincronizarSel(role);
            if (input.checked) sel[role].add(key);
            else sel[role].delete(key);

            const allKeys = getAllKeys(role);
            const todosMarcados = allKeys.length > 0 && allKeys.every(k => sel[role].has(k));
            modoSelecao[role] = todosMarcados ? 'todos' : 'custom';

            atualizarMasterCheckbox(role);
            atualizarTodosOsContadores();
        }

        renderPersonagensFiltroLeve();
    });

    function renderPersonagensFiltroLeve() {
        ['admin', 'diretor'].forEach(role => {
            const blocoEl = personagensFiltroEl.querySelector('.bloco-' + role);
            if (!blocoEl) return;
            const contagens = contarPorRole(role, false);
            const wrap = blocoEl.querySelector('.mini-contadores');
            if (!wrap) return;
            const badgeAbertas = contagens.abertas > 0
                ? `<span class="mini-contador mc-abertas">📂 ${contagens.abertas} aberta${contagens.abertas === 1 ? '' : 's'}</span>`
                : `<span class="mini-contador mc-zero">📂 0 abertas</span>`;
            const badgeAtrasadas = contagens.atrasadas > 0
                ? `<span class="mini-contador mc-atrasadas">⚠️ ${contagens.atrasadas} atrasada${contagens.atrasadas === 1 ? '' : 's'}</span>`
                : `<span class="mini-contador mc-zero">✓ sem atraso</span>`;
            wrap.innerHTML = badgeAbertas + badgeAtrasadas;
        });
        atualizarTela();
    }

    function atualizarCheckboxesDoBloco(role) {
        const inputs = personagensFiltroEl.querySelectorAll(`input[data-role="${role}"][data-key]`);
        inputs.forEach(inp => {
            inp.checked = sel[role].has(inp.dataset.key);
        });
    }

    function atualizarMasterCheckbox(role) {
        const master = personagensFiltroEl.querySelector(`input[data-todos="${role}"]`);
        if (!master) return;
        const allKeys = getAllKeys(role);
        master.checked = allKeys.length > 0 && allKeys.every(k => sel[role].has(k));
    }

    function atualizarTodosOsContadores() {
        personagensFiltroEl.querySelectorAll('[data-contador]').forEach(el => {
            atualizarContadorBloco(el.closest('.personagens-bloco'), el.dataset.contador);
        });
    }

    function matchSelecao(os, role) {
        const alvo = os.direcionado_para;
        if (!alvo) return false;
        sincronizarSel(role);
        return sel[role].has(alvo);
    }

    function cabecalhoAdmin(listaOS) {
        const linha = '▬▬▬▬▬▬▬▬▬▬';
        const qtdAbertas = listaOS.length;
        const qtdAtrasadas = listaOS.filter(isAtrasada).length;
        const atraso = qtdAtrasadas > 0 ? ` · ⚠️ ${qtdAtrasadas} atrasada${qtdAtrasadas === 1 ? '' : 's'}` : ' · ✓ sem atraso';
        const detentores = getDetentoresTexto(listaOS);
        const linhas = [
            linha,
            `🏛️  *ADMINISTRAÇÃO — PENDÊNCIAS*`,
            `📊 ${qtdAbertas} aberta${qtdAbertas === 1 ? '' : 's'}${atraso}`
        ];
        if (detentores) linhas.push(`👥 ${detentores}`);
        linhas.push(linha);
        return linhas;
    }

    function cabecalhoDiretor(listaOS) {
        const linha = '══════════';
        const qtdAbertas = listaOS.length;
        const qtdAtrasadas = listaOS.filter(isAtrasada).length;
        const atraso = qtdAtrasadas > 0 ? ` · ⚠️ ${qtdAtrasadas} atrasada${qtdAtrasadas === 1 ? '' : 's'}` : ' · ✓ sem atraso';
        const detentores = getDetentoresTexto(listaOS);
        const linhas = [
            linha,
            `⚖️  _DIRETORIA — PENDÊNCIAS_`,
            `📊 ${qtdAbertas} aberta${qtdAbertas === 1 ? '' : 's'}${atraso}`
        ];
        if (detentores) linhas.push(`👥 ${detentores}`);
        linhas.push(linha);
        return linhas;
    }

    function cabecalhoRestritas(listaOS) {
        const linha = '██████████';
        const qtdAbertas = listaOS.length;
        const qtdAtrasadas = listaOS.filter(isAtrasada).length;
        const atraso = qtdAtrasadas > 0 ? ` · ⚠️ ${qtdAtrasadas} atrasada${qtdAtrasadas === 1 ? '' : 's'}` : ' · ✓ sem atraso';
        const detentores = getDetentoresTexto(listaOS);
        const linhas = [
            linha,
            `🔒  *RESTRITAS — PENDÊNCIAS*`,
            `📊 ${qtdAbertas} aberta${qtdAbertas === 1 ? '' : 's'}${atraso}`
        ];
        if (detentores) linhas.push(`👥 ${detentores}`);
        linhas.push(linha);
        return linhas;
    }

    function linhaSeparadorOS() {
        return '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━';
    }

    function gerarBlocoOS(os, contexto) {
        const linhas = [];
        const atrasada = isAtrasada(os);
        linhas.push(`*#OS ${os.numero || '—'} - ${os.titulo || 'Sem título'}*`);
        const pend = getUltimoCardMensagem(os);
        linhas.push(`Pendência: ${pend || '(sem descrição)'}`);

        // ↓↓↓ Linha da enquete aberta ↓↓↓
        const enqAberta = temEnqueteAberta(os);
        if (enqAberta) {
            const prazo = new Date(enqAberta.prazo);
            const pad = n => String(n).padStart(2, '0');
            const prazoFmt = `${pad(prazo.getDate())}/${pad(prazo.getMonth()+1)} ${pad(prazo.getHours())}:${pad(prazo.getMinutes())}`;
            linhas.push(`📊 *Enquete aberta — diretores devem votar* (prazo: ${prazoFmt})`);
        }
        // ↑↑↑ Linha da enquete aberta ↑↑↑

        linhas.push(`Responsável: ${getResponsavelTexto(os)}`);
        linhas.push(atrasada ? `Status: 🔴 *ATRASADA*` : `Status: 🟢 *Em dia*`);
        const abertaHa = tempoDecorrido(os.criado_em);
        const pendenteHa = tempoDecorrido(os.direcionado_em || os.criado_em);
        linhas.push(`OS aberta a ${abertaHa}, pendente há ${pendenteHa}`);
        linhas.push(`🔗 Ver OS: ${getUrlOS(os.id)}`);
        return linhas;
    }

    function ordenarPendentes(lista) {
        return lista.sort((a, b) => {
            const da = a.direcionado_em || a.criado_em || '';
            const dbb = b.direcionado_em || b.criado_em || '';
            return da.localeCompare(dbb);
        });
    }

    function gerarTextoLog() {
        const tipo = tipoLogSelect.value;

        const pendentesBase = allDocs.filter(d => {
            const s = (d.status || '').toLowerCase();
            if (s !== 'aberta' && s !== 'em_andamento') return false;
            if (!podeVerOS(d)) return false;
            return true;
        });

        if (tipo === 'restritas') {
            const restritas = ordenarPendentes(pendentesBase.filter(isRestrita));
            const total = restritas.length;
            const totalAtrasadas = restritas.filter(isAtrasada).length;

            const linhas = [];
            linhas.push(...cabecalhoRestritas(restritas));
            linhas.push(`_Atualizado em ${formatarDataHoraAgora()}_`);
            linhas.push('');

            if (restritas.length === 0) {
                linhas.push('✅ Nenhuma OS restrita pendente.');
                return {
                    texto: linhas.join('\n'),
                    total: 0,
                    atrasadas: 0,
                    emDia: 0,
                    titulo: 'RESTRITAS'
                };
            }

            restritas.forEach((os, i) => {
                linhas.push(linhaSeparadorOS());
                linhas.push(...gerarBlocoOS(os, 'restritas'));
                if (i < restritas.length - 1) linhas.push('');
            });

            linhas.push(linhaSeparadorOS());
            linhas.push(`_Total: ${total} OS restrita${total === 1 ? '' : 's'} · ${total - totalAtrasadas} em dia · ${totalAtrasadas} atrasada${totalAtrasadas === 1 ? '' : 's'}_`);

            return {
                texto: linhas.join('\n'),
                total,
                atrasadas: totalAtrasadas,
                emDia: total - totalAtrasadas,
                titulo: 'RESTRITAS'
            };
        }

        const pendentesNormais = pendentesBase.filter(d => !isRestrita(d));

        const linhas = [];

        if (tipo === 'todas') {
            const adminList = ordenarPendentes(pendentesNormais.filter(d =>
                getPendenteCategoria(d) === 'admin' && matchSelecao(d, 'admin')));
            const dirList = ordenarPendentes(pendentesNormais.filter(d =>
                getPendenteCategoria(d) === 'diretoria' && matchSelecao(d, 'diretor')));

            const adminAtrasadas = adminList.filter(isAtrasada).length;
            const dirAtrasadas = dirList.filter(isAtrasada).length;
            const total = adminList.length + dirList.length;
            const totalAtrasadas = adminAtrasadas + dirAtrasadas;

            const todos = [...adminList, ...dirList];
            const detentoresTotal = getDetentoresTexto(todos);

            const linhaTopo = '▬▬▬▬▬▬▬▬▬▬';
            linhas.push(linhaTopo);
            linhas.push('📋  *LISTA DE PENDÊNCIAS*');
            linhas.push(`📊 ${total} aberta${total === 1 ? '' : 's'}` + (totalAtrasadas > 0 ? ` · ⚠️ ${totalAtrasadas} atrasada${totalAtrasadas === 1 ? '' : 's'}` : ' · ✓ sem atraso'));
            if (detentoresTotal) linhas.push(`👥 ${detentoresTotal}`);
            linhas.push(`_Atualizado em ${formatarDataHoraAgora()}_`);
            linhas.push(linhaTopo);
            linhas.push('');
            linhas.push('');
            linhas.push(...cabecalhoAdmin(adminList));
            linhas.push('');
            if (adminList.length === 0) {
                linhas.push('✅ Nenhuma pendência.');
            } else {
                adminList.forEach((os, i) => {
                    if (i > 0) linhas.push('');
                    linhas.push(...gerarBlocoOS(os, 'admin'));
                });
            }

            linhas.push('');
            linhas.push('');
            linhas.push(...cabecalhoDiretor(dirList));
            linhas.push('');
            if (dirList.length === 0) {
                linhas.push('✅ Nenhuma pendência.');
            } else {
                dirList.forEach((os, i) => {
                    if (i > 0) linhas.push('');
                    linhas.push(...gerarBlocoOS(os, 'diretor'));
                });
            }

            linhas.push('');
            linhas.push(linhaSeparadorOS());
            linhas.push(`_Total: ${total} pendência(s) — 🏛️ ${adminList.length} admin · ⚖️ ${dirList.length} diretoria_`);

            return {
                texto: linhas.join('\n'),
                total,
                atrasadas: totalAtrasadas,
                emDia: total - totalAtrasadas,
                titulo: 'TODAS',
                admin: adminList.length,
                diretor: dirList.length
            };
        }

        const role = tipo;
        const cat = tipo === 'admin' ? 'admin' : 'diretoria';

        const pendentes = ordenarPendentes(pendentesNormais.filter(d =>
            getPendenteCategoria(d) === cat && matchSelecao(d, role)));

        const qtdAtrasadas = pendentes.filter(isAtrasada).length;
        const qtdEmDia = pendentes.length - qtdAtrasadas;

        if (tipo === 'admin') {
            linhas.push(...cabecalhoAdmin(pendentes));
        } else {
            linhas.push(...cabecalhoDiretor(pendentes));
        }
        linhas.push(`_Atualizado em ${formatarDataHoraAgora()}_`);
        linhas.push('');

        if (pendentes.length === 0) {
            linhas.push('✅ Nenhuma pendência no momento.');
            return {
                texto: linhas.join('\n'),
                total: 0,
                atrasadas: 0,
                emDia: 0,
                titulo: tipo === 'admin' ? 'ADMINISTRAÇÃO' : 'DIRETORIA'
            };
        }

        pendentes.forEach((os, i) => {
            linhas.push(linhaSeparadorOS());
            linhas.push(...gerarBlocoOS(os, tipo));
            if (i < pendentes.length - 1) linhas.push('');
        });

        linhas.push(linhaSeparadorOS());
        linhas.push(`_Total: ${pendentes.length} pendência(s) · ${qtdEmDia} em dia · ${qtdAtrasadas} atrasada(s)_`);

        return {
            texto: linhas.join('\n'),
            total: pendentes.length,
            atrasadas: qtdAtrasadas,
            emDia: qtdEmDia,
            titulo: tipo === 'admin' ? 'ADMINISTRAÇÃO' : 'DIRETORIA'
        };
    }

    function atualizarTela() {
        const r = gerarTextoLog();
        const modoRestritas = (r.titulo === 'RESTRITAS');

        textoGerado.value = r.texto;

        if (modoRestritas) {
            containerPrincipal.classList.add('modo-restritas');
            pageTitle.textContent = '🔒 Log de Pendências Restritas';
            infoResumo.classList.add('modo-restritas');
            textoGerado.classList.add('modo-restritas');
        } else {
            containerPrincipal.classList.remove('modo-restritas');
            pageTitle.textContent = '📢 Log de Pendências';
            infoResumo.classList.remove('modo-restritas');
            textoGerado.classList.remove('modo-restritas');
        }

        contadorAbertas.textContent = r.total;
        contadorAtrasadas.textContent = r.atrasadas;
        contadorSub.textContent = `${r.emDia} em dia · ${r.atrasadas} atrasada${r.atrasadas === 1 ? '' : 's'}`;

        if (r.titulo === 'TODAS') {
            contadorLabel.innerHTML = `Para TODAS as áreas <span class="info-desc-sub" id="contadorSub">${r.emDia} em dia · ${r.atrasadas} atrasada${r.atrasadas === 1 ? '' : 's'}</span>`;
        } else if (r.titulo === 'ADMINISTRAÇÃO') {
            contadorLabel.innerHTML = `Para ADMINISTRAÇÃO <span class="info-desc-sub" id="contadorSub">${r.emDia} em dia · ${r.atrasadas} atrasada${r.atrasadas === 1 ? '' : 's'}</span>`;
        } else if (r.titulo === 'DIRETORIA') {
            contadorLabel.innerHTML = `Para DIRETORIA <span class="info-desc-sub" id="contadorSub">${r.emDia} em dia · ${r.atrasadas} atrasada${r.atrasadas === 1 ? '' : 's'}</span>`;
        } else if (r.titulo === 'RESTRITAS') {
            contadorLabel.innerHTML = `🔒 Apenas OS RESTRITAS <span class="info-desc-sub" id="contadorSub">${r.emDia} em dia · ${r.atrasadas} atrasada${r.atrasadas === 1 ? '' : 's'}</span>`;
        }

        if (r.atrasadas > 0) statAtraso.classList.add('tem-atraso');
        else statAtraso.classList.remove('tem-atraso');
    }

    function mostrarMsg(texto, tipo) {
        msgEl.textContent = texto;
        msgEl.className = 'message ' + tipo;
        setTimeout(() => { msgEl.className = 'message'; }, 3000);
    }

    async function copiarTexto() {
        const txt = textoGerado.value;
        if (!txt) { mostrarMsg('Nada para copiar.', 'error'); return; }
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(txt);
            } else {
                textoGerado.removeAttribute('readonly');
                textoGerado.select();
                textoGerado.setSelectionRange(0, 99999);
                document.execCommand('copy');
                textoGerado.setAttribute('readonly', 'readonly');
                window.getSelection().removeAllRanges();
            }
            mostrarMsg('✅ Texto copiado! Cole no WhatsApp.', 'success');
        } catch (e) {
            console.error(e);
            try {
                textoGerado.removeAttribute('readonly');
                textoGerado.select();
                textoGerado.setSelectionRange(0, 99999);
                document.execCommand('copy');
                textoGerado.setAttribute('readonly', 'readonly');
                window.getSelection().removeAllRanges();
                mostrarMsg('✅ Texto copiado!', 'success');
            } catch (e2) {
                mostrarMsg('Não foi possível copiar automaticamente. Selecione o texto e use Ctrl+C.', 'error');
            }
        }
    }

    tipoLogSelect.addEventListener('change', () => {
        renderPersonagensFiltro();
    });
    btnCopiar.addEventListener('click', copiarTexto);
    btnAtualizar.addEventListener('click', () => {
        mostrarMsg('🔄 Recarregando...', 'info');
        carregarTudo();
    });

    function atualizarHeader(nome, funcao) {
        const f = funcao || 'tecnico';
        userHeaderBadge.className = 'uh-badge ' + f;
        userHeaderBadge.textContent = `${nome || 'Usuário'} (${f})`;
    }

    async function carregarTudo() {
        try {
            const cache = lerUserMapDoCache();
            const promises = [];

            if (cache) {
                userMap = cache;
                promises.push(Promise.resolve());
            } else {
                promises.push(
                    db.collection('usuarios').where('status', '==', 'ativo').get()
                        .then(snap => {
                            userMap = {};
                            snap.forEach(doc => {
                                const d = doc.data();
                                userMap[doc.id] = { nome: d.nome, funcao: d.funcao };
                            });
                            salvarUserMapNoCache(userMap);
                        })
                );
            }

            promises.push(
                db.collection('ordens_servico')
                    .where('status', 'in', ['aberta', 'em_andamento'])
                    .get()
                    .then(snap => {
                        const docs = [];
                        snap.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
                        return docs;
                    })
                    .catch(err => {
                        console.warn('Query filtrada falhou. Caindo para query completa.', err.message);
                        return db.collection('ordens_servico').get().then(snap => {
                            const docs = [];
                            snap.forEach(doc => {
                                const data = doc.data();
                                const s = (data.status || '').toLowerCase();
                                if (s === 'aberta' || s === 'em_andamento') {
                                    docs.push({ id: doc.id, ...data });
                                }
                            });
                            return docs;
                        });
                    })
            );

            const [, docs] = await Promise.all(promises);
            allDocs = docs;

            renderPersonagensFiltro();
        } catch (err) {
            console.error(err);
            mostrarMsg('Erro ao carregar: ' + err.message, 'error');
            textoGerado.value = 'Erro ao carregar ordens de serviço.';
            contadorAbertas.textContent = '0';
            contadorAtrasadas.textContent = '0';
        }
    }

    auth.onAuthStateChanged((user) => {
        if (!user) { window.location.href = 'index.html'; return; }
        currentUser = user;
        registrarAtividade();
        iniciarMonitorTimeout();

        db.collection('usuarios').doc(user.uid).get()
            .then(doc => {
                let nome = user.displayName || user.email;
                let funcao = 'tecnico';
                if (doc.exists) {
                    const d = doc.data();
                    if (user.email !== MASTER_EMAIL && d.status && d.status !== 'ativo') {
                        fazerLogoutInativo();
                        return;
                    }
                    nome = d.nome || nome;
                    funcao = d.funcao || 'tecnico';
                }
                if (user.email === MASTER_EMAIL) funcao = 'master';
                currentUserData = { nome, funcao };
                atualizarHeader(nome, funcao);

                if (!ehDiretorOuMaster()) {
                    if (optRestritas && optRestritas.parentNode) {
                        optRestritas.parentNode.removeChild(optRestritas);
                    }
                }

                carregarTudo();
            })
            .catch(() => {
                const funcao = user.email === MASTER_EMAIL ? 'master' : 'tecnico';
                currentUserData = { nome: user.displayName || user.email, funcao };
                atualizarHeader(user.displayName || user.email, funcao);

                if (!ehDiretorOuMaster()) {
                    if (optRestritas && optRestritas.parentNode) {
                        optRestritas.parentNode.removeChild(optRestritas);
                    }
                }

                carregarTudo();
            });
    });
</script>
