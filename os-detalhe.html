<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Detalhe da OS - Villa do Bosque</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Calibri', 'Segoe UI', Tahoma, sans-serif; }
        body { background: #e8f5e9; padding: 16px 12px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: #fff; max-width: 900px; width: 100%; padding: 20px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,80,0,0.12); border: 1px solid #a5d6a7; }
        .page-title { font-size: 24px; color: #1b5e20; background: #c8e6c9; display: inline-block; padding: 4px 18px; border-radius: 30px; margin-bottom: 12px; }
        .btn { padding: 8px 16px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn:hover { background: #1b5e20; }
        .btn-success { background: #388e3c; }
        .btn-success:hover { background: #2e7d32; }
        .btn-danger { background: #c62828; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-warning { background: #f0ad4e; color: #000; }
        .btn-warning:hover { background: #ec971f; }
        .btn-voltar { background: #558b2f; }
        .btn-voltar:hover { background: #33691e; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-edit { background: transparent; border: 1px solid #2e7d32; color: #2e7d32; padding: 2px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .btn-edit:hover { background: #e8f5e9; }

        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }

        /* INFORMAÇÕES DA OS */
        .os-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #c8e6c9;
        }
        .os-info .info-row {
            display: flex;
            flex-wrap: wrap;
            padding: 4px 0;
            border-bottom: 1px solid #e8f5e9;
        }
        .os-info .info-row:last-child { border-bottom: none; }
        .os-info .info-label {
            font-weight: 600;
            color: #1b5e20;
            width: 140px;
            flex-shrink: 0;
        }
        .os-info .info-value {
            flex: 1;
            word-break: break-word;
        }
        .os-info .info-value .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-aberta { background: #e3f2fd; color: #0d47a1; }
        .badge-em_andamento { background: #fff3e0; color: #e65100; }
        .badge-concluida { background: #c8e6c9; color: #1b5e20; }
        .badge-cancelada { background: #e0e0e0; color: #424242; }
        .badge-emergencial { background: #ffcdd2; color: #b71c1c; font-weight: bold; }
        .badge-urgente { background: #fff9c4; color: #f57f17; font-weight: bold; }
        .badge-normal { background: #c8e6c9; color: #1b5e20; font-weight: bold; }

        /* HISTÓRICO - CARDS */
        .historico-container {
            margin: 20px 0;
        }
        .historico-container .card {
            background: #fff;
            border-left: 4px solid #a5d6a7;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid #e8f5e9;
        }
        .card-admin { border-left-color: #ffe082; background: #fffde7; }
        .card-diretor { border-left-color: #a5d6a7; background: #f1f8e9; }
        .card-master { border-left-color: #ffcc80; background: #fff8e1; }
        .card-outros { border-left-color: #ced4da; background: #f8f9fa; }

        .card .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
        }
        .card .card-header .usuario { font-weight: 600; color: #1b5e20; }
        .card .card-body { font-size: 14px; }
        .card .card-footer {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
            border-top: 1px solid #e8f5e9;
            padding-top: 6px;
        }

        /* EDIÇÃO */
        .edit-field {
            display: inline-block;
            margin-left: 8px;
        }
        .edit-field input, .edit-field select {
            padding: 2px 6px;
            border: 1px solid #a5d6a7;
            border-radius: 4px;
            font-size: 14px;
        }
        .edit-field .btn-sm { margin-left: 4px; }

        /* FORMULÁRIO DE AÇÃO */
        .nova-acao {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #c8e6c9;
            margin: 16px 0;
        }
        .nova-acao .form-group { margin-bottom: 10px; }
        .nova-acao label { font-weight: 600; font-size: 13px; color: #1b5e20; display: block; margin-bottom: 2px; }
        .nova-acao textarea, .nova-acao select {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #a5d6a7;
            border-radius: 6px;
            font-size: 14px;
            background: #fafffe;
        }
        .nova-acao textarea { resize: vertical; min-height: 50px; }
        .nova-acao .btn { margin-top: 6px; }

        .acoes-rodape {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 600px) {
            .container { padding: 14px; }
            .page-title { font-size: 20px; }
            .os-info .info-label { width: 100px; }
            .os-info .info-value { font-size: 13px; }
            .acoes-rodape { flex-direction: column; align-items: stretch; }
            .acoes-rodape .btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-actions">
        <a href="os-list.html" class="btn btn-voltar">← Voltar</a>
        <span style="flex:1;"></span>
        <span id="osStatusBadge" class="badge badge-aberta" style="font-size:16px; padding:6px 16px;">Aberta</span>
    </div>

    <h1 class="page-title" id="osTitulo">📋 OS #<span id="osNumero">---</span></h1>

    <!-- INFORMAÇÕES DA OS -->
    <div class="os-info" id="osInfoContainer">
        <!-- preenchido via JS -->
    </div>

    <!-- HISTÓRICO -->
    <h2 style="color:#2e7d32; margin:16px 0 8px;">📜 Histórico</h2>
    <div id="historicoContainer" class="historico-container">
        <p>Carregando...</p>
    </div>

    <!-- NOVA AÇÃO -->
    <div class="nova-acao" id="novaAcaoArea">
        <h3 style="color:#2e7d32; margin-bottom:8px;">➕ Adicionar Ação</h3>
        <form id="formNovaAcao">
            <div class="form-group">
                <label>Descrição da ação *</label>
                <textarea id="acaoDescricao" placeholder="Descreva a ação realizada..." required></textarea>
            </div>
            <div class="form-group">
                <label>Direcionar para (opcional)</label>
                <select id="acaoDirecionar">
                    <option value="">Manter destino atual</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Adicionar Ação</button>
            <div id="acaoMessage" class="message" style="margin-top:8px; display:none;"></div>
        </form>
    </div>

    <!-- RODAPÉ: CONCLUIR / REABRIR -->
    <div class="acoes-rodape" id="rodapeAcoes">
        <!-- preenchido via JS -->
    </div>
</div>

<script>
    // ================================================================
    // FIREBASE CONFIG
    // ================================================================
    const firebaseConfig = {
        apiKey: "AIzaSyDx_6oWO30Drh8GkuQA9jk2Oym7H8J3ABg",
        authDomain: "villa-bosque1.firebaseapp.com",
        projectId: "villa-bosque1",
        storageBucket: "villa-bosque1.firebasestorage.app",
        messagingSenderId: "372474036025",
        appId: "1:372474036025:web:bbbee10723469d77cbb2e8"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ================================================================
    // TIMEOUT GLOBAL
    // ================================================================
    const TIMEOUT_MS = 4 * 60 * 60 * 1000;
    function verificarTimeout() {
        const lastActivity = sessionStorage.getItem('lastActivity');
        if (!lastActivity) {
            sessionStorage.setItem('lastActivity', Date.now().toString());
            return;
        }
        const diff = Date.now() - parseInt(lastActivity);
        if (diff > TIMEOUT_MS) {
            sessionStorage.removeItem('lastActivity');
            sessionStorage.removeItem('userLoggedIn');
            auth.signOut().then(() => {
                alert('Sessão expirada por inatividade.');
                window.location.href = 'index.html';
            });
        } else {
            sessionStorage.setItem('lastActivity', Date.now().toString());
        }
    }
    function resetTimeoutGlobal() {
        sessionStorage.setItem('lastActivity', Date.now().toString());
    }
    ['click','mousemove','keydown','scroll','touchstart'].forEach(ev => {
        document.addEventListener(ev, resetTimeoutGlobal);
    });
    verificarTimeout();

    // ================================================================
    // VARIÁVEIS GLOBAIS
    // ================================================================
    const MASTER_EMAIL = 'administracaovilladobosque@gmail.com';
    let currentUser = null;
    let currentUserData = null;
    let osId = null;
    let osData = null;
    let userMap = {}; // uid -> { nome, funcao }
    let editando = { campo: null, original: null };

    // ================================================================
    // ELEMENTOS
    // ================================================================
    const osNumero = document.getElementById('osNumero');
    const osTitulo = document.getElementById('osTitulo');
    const osStatusBadge = document.getElementById('osStatusBadge');
    const osInfoContainer = document.getElementById('osInfoContainer');
    const historicoContainer = document.getElementById('historicoContainer');
    const rodapeAcoes = document.getElementById('rodapeAcoes');
    const formNovaAcao = document.getElementById('formNovaAcao');
    const acaoDescricao = document.getElementById('acaoDescricao');
    const acaoDirecionar = document.getElementById('acaoDirecionar');
    const acaoMessage = document.getElementById('acaoMessage');

    // ================================================================
    // UTILITÁRIOS
    // ================================================================
    function formatarDataHora(dataISO) {
        if (!dataISO) return '—';
        const d = new Date(dataISO);
        if (isNaN(d)) return '—';
        const dia = String(d.getDate()).padStart(2, '0');
        const mes = String(d.getMonth()+1).padStart(2, '0');
        const ano = d.getFullYear();
        const hora = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${dia}/${mes}/${ano} ${hora}:${min}`;
    }

    function formatarDataCurta(dataISO) {
        if (!dataISO) return '—';
        const d = new Date(dataISO);
        if (isNaN(d)) return '—';
        return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }

    function getFuncao(uid) {
        if (uid && userMap[uid]) return userMap[uid].funcao;
        return null;
    }

    function getNome(uid) {
        if (uid && userMap[uid]) return userMap[uid].nome;
        return uid || '—';
    }

    function getCorPerfil(funcao) {
        if (funcao === 'admin') return '#ffe082';
        if (funcao === 'diretor') return '#a5d6a7';
        if (funcao === 'master') return '#ffcc80';
        return '#ced4da';
    }

    function getClasseCard(funcao) {
        if (funcao === 'admin') return 'card-admin';
        if (funcao === 'diretor') return 'card-diretor';
        if (funcao === 'master') return 'card-master';
        return 'card-outros';
    }

    // ================================================================
    // CARREGAR USUÁRIOS PARA MAPA
    // ================================================================
    function carregarUsuarios() {
        return db.collection('usuarios').where('status', '==', 'ativo').get()
            .then(snapshot => {
                userMap = {};
                snapshot.forEach(doc => {
                    const data = doc.data();
                    userMap[doc.id] = { nome: data.nome, funcao: data.funcao };
                });
            });
    }

    // ================================================================
    // CARREGAR DETALHE DA OS
    // ================================================================
    function carregarOS() {
        if (!osId) return;
        historicoContainer.innerHTML = '<p>Carregando...</p>';
        db.collection('ordens_servico').doc(osId).get()
            .then(doc => {
                if (!doc.exists) {
                    historicoContainer.innerHTML = '<p style="color:red;">OS não encontrada.</p>';
                    return;
                }
                osData = { id: doc.id, ...doc.data() };
                renderizarDetalhe();
            })
            .catch(err => {
                console.error(err);
                historicoContainer.innerHTML = `<p style="color:red;">Erro ao carregar: ${err.message}</p>`;
            });
    }

    // ================================================================
    // RENDERIZAR DETALHE
    // ================================================================
    function renderizarDetalhe() {
        if (!osData) return;

        // Número e título
        osNumero.textContent = osData.numero || '---';
        osTitulo.textContent = `📋 OS #${osData.numero || '---'}`;

        // Status badge
        const statusMap = {
            'aberta': 'Aberta',
            'em_andamento': 'Em andamento',
            'concluida': 'Concluída',
            'cancelada': 'Cancelada'
        };
        const statusLabel = statusMap[osData.status] || osData.status;
        osStatusBadge.textContent = statusLabel;
        osStatusBadge.className = `badge badge-${osData.status || 'aberta'}`;

        // ---- INFORMAÇÕES ----
        let infoHTML = '';
        const campos = [
            { label: 'Número', value: osData.numero || '—' },
            { label: 'Título', value: osData.titulo || '—', edit: 'titulo' },
            { label: 'Descrição', value: osData.descricao || '—', edit: 'descricao' },
            { label: 'Tipo', value: osData.tipo || '—', edit: 'tipo' },
            { label: 'Prioridade', value: osData.prioridade || 'normal', edit: 'prioridade' },
            { label: 'Status', value: statusLabel },
            { label: 'Aberto por', value: getNome(osData.aberto_por) },
            { label: 'Data/Hora abertura', value: formatarDataHora(osData.criado_em) },
            { label: 'Reclamante - Quadra', value: osData.quadra_reclamante || '—' },
            { label: 'Reclamante - Lote', value: osData.lote_reclamante || '—' },
            { label: 'Reclamado - Quadra', value: osData.quadra_reclamada || '—' },
            { label: 'Reclamado - Lote', value: osData.lote_reclamada || '—' },
            { label: 'Direcionado para', value: osData.direcionado_para_nome || '—' },
        ];

        // Determina se o usuário atual pode editar
        const podeEditar = podeEditarOS();

        campos.forEach(campo => {
            let valor = campo.value;
            let editHtml = '';
            if (campo.edit && podeEditar) {
                editHtml = `<span class="edit-field">
                    <button class="btn-edit" data-campo="${campo.edit}" data-valor="${campo.value || ''}">✏️</button>
                </span>`;
            }
            infoHTML += `
                <div class="info-row">
                    <div class="info-label">${campo.label}</div>
                    <div class="info-value" id="info-${campo.edit || 'static'}">
                        ${campo.edit ? `<span id="display-${campo.edit}">${valor}</span>` : valor}
                        ${editHtml}
                    </div>
                </div>
            `;
        });

        osInfoContainer.innerHTML = infoHTML;

        // ---- HISTÓRICO ----
        const historico = osData.historico || [];
        if (historico.length === 0) {
            historicoContainer.innerHTML = '<p>Nenhuma ação registrada.</p>';
        } else {
            // Ordenar por data crescente (mais antigo primeiro)
            historico.sort((a, b) => (a.data || '').localeCompare(b.data || ''));
            let html = '';
            historico.forEach(item => {
                const funcao = getFuncao(item.usuario_uid) || 'outros';
                const cor = getCorPerfil(funcao);
                const classe = getClasseCard(funcao);
                const nome = getNome(item.usuario_uid) || item.usuario || 'Anônimo';
                const dataFormat = formatarDataHora(item.data);
                const acao = item.acao || 'ação';
                const mensagem = item.mensagem || '';
                let direcionado = item.direcionado_para ? ` → ${item.direcionado_para}` : '';

                // Se for edição, exibe tachado
                let corpo = mensagem;
                if (acao === 'edicao') {
                    const detalhes = item.detalhes || {};
                    const antigo = detalhes.valor_antigo || '';
                    const novo = detalhes.valor_novo || '';
                    corpo = `<span style="text-decoration:line-through; color:#999; font-style:italic;">${antigo}</span> → ${novo} <span style="color:#999; font-size:12px;">(edit em ${formatarDataCurta(item.data)})</span>`;
                }

                html += `
                    <div class="card ${classe}" style="border-left-color:${cor};">
                        <div class="card-header">
                            <span class="usuario">${nome}</span>
                            <span>${dataFormat}</span>
                        </div>
                        <div class="card-body">
                            <strong>${acao.toUpperCase()}</strong>${direcionado}
                            <div>${corpo}</div>
                        </div>
                        <div class="card-footer">${item.acao === 'edicao' ? '✏️ Edição' : ''}</div>
                    </div>
                `;
            });
            historicoContainer.innerHTML = html;
        }

        // ---- RODAPÉ (Concluir / Reabrir) ----
        const funcaoUsuario = currentUserData?.funcao || 'tecnico';
        const isDiretor = (funcaoUsuario === 'diretor');
        const isAdmin = (funcaoUsuario === 'admin');
        const isMaster = (currentUser && currentUser.email === MASTER_EMAIL);
        const podeConcluir = isDiretor || isMaster;
        const podeReabrir = isAdmin || isDiretor || isMaster;
        const statusConcluida = (osData.status === 'concluida');

        let rodapeHtml = '';
        if (!statusConcluida && podeConcluir) {
            rodapeHtml += `<button class="btn btn-success" id="btnConcluir">✅ Concluir OS</button>`;
        }
        if (statusConcluida && podeReabrir) {
            rodapeHtml += `<button class="btn btn-warning" id="btnReabrir">🔄 Reabrir OS</button>`;
        }
        rodapeHtml += `<span style="flex:1;"></span>`;
        rodapeAcoes.innerHTML = rodapeHtml;

        if (rodapeHtml) {
            document.getElementById('btnConcluir')?.addEventListener('click', concluirOS);
            document.getElementById('btnReabrir')?.addEventListener('click', reabrirOS);
        }

        // ---- POPULAR DROPDOWN DE DIRECIONAMENTO ----
        popularDirecionamento();

        // ---- EVENTOS DE EDIÇÃO ----
        document.querySelectorAll('.btn-edit').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const campo = btn.dataset.campo;
                const valorAtual = btn.dataset.valor;
                iniciarEdicao(campo, valorAtual);
            });
        });
    }

    // ================================================================
    // PERMISSÃO DE EDIÇÃO
    // ================================================================
    function podeEditarOS() {
        if (!currentUser || !osData) return false;
        // Master pode editar sempre
        if (currentUser.email === MASTER_EMAIL) return true;
        // Se a OS foi criada por um admin, apenas admins podem editar
        const criadorUid = osData.aberto_por;
        const funcaoCriador = getFuncao(criadorUid);
        const funcaoUsuario = currentUserData?.funcao;
        if (funcaoCriador === 'admin' && funcaoUsuario === 'admin') return true;
        if (funcaoCriador === 'diretor' && funcaoUsuario === 'diretor') return true;
        return false;
    }

    // ================================================================
    // EDIÇÃO DE CAMPO
    // ================================================================
    function iniciarEdicao(campo, valorAtual) {
        if (editando.campo) {
            cancelarEdicao();
        }
        editando.campo = campo;
        editando.original = valorAtual;

        const displayEl = document.getElementById(`display-${campo}`);
        if (!displayEl) return;
        const container = displayEl.parentElement;

        let input;
        if (campo === 'prioridade') {
            input = document.createElement('select');
            const opcoes = ['emergencial', 'urgente', 'normal'];
            opcoes.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt;
                option.textContent = opt;
                if (opt === valorAtual) option.selected = true;
                input.appendChild(option);
            });
        } else if (campo === 'tipo') {
            input = document.createElement('select');
            const opcoes = ['serviço', 'reclamação', 'infração', 'análise'];
            opcoes.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt;
                option.textContent = opt;
                if (opt === valorAtual) option.selected = true;
                input.appendChild(option);
            });
        } else {
            input = document.createElement('input');
            input.type = 'text';
            input.value = valorAtual || '';
        }
        input.className = 'edit-field-input';
        input.style.width = 'auto';
        input.style.minWidth = '150px';

        const salvarBtn = document.createElement('button');
        salvarBtn.textContent = 'Salvar';
        salvarBtn.className = 'btn btn-sm btn-success';
        salvarBtn.style.marginLeft = '4px';

        const cancelarBtn = document.createElement('button');
        cancelarBtn.textContent = 'Cancelar';
        cancelarBtn.className = 'btn btn-sm btn-secondary';
        cancelarBtn.style.marginLeft = '4px';

        displayEl.style.display = 'none';
        const editBtn = container.querySelector('.btn-edit');
        if (editBtn) editBtn.style.display = 'none';

        const wrapper = document.createElement('span');
        wrapper.className = 'edit-field-wrapper';
        wrapper.appendChild(input);
        wrapper.appendChild(salvarBtn);
        wrapper.appendChild(cancelarBtn);
        container.appendChild(wrapper);

        salvarBtn.addEventListener('click', () => {
            const novoValor = input.value.trim();
            if (novoValor === '' && campo !== 'tipo' && campo !== 'prioridade') {
                alert('O campo não pode ficar vazio.');
                return;
            }
            if (novoValor === editando.original) {
                cancelarEdicao();
                return;
            }
            salvarEdicao(campo, editando.original, novoValor);
        });

        cancelarBtn.addEventListener('click', cancelarEdicao);

        if (input.focus) input.focus();
    }

    function cancelarEdicao() {
        if (!editando.campo) return;
        const campo = editando.campo;
        const displayEl = document.getElementById(`display-${campo}`);
        if (displayEl) {
            displayEl.style.display = 'inline';
            const container = displayEl.parentElement;
            const wrapper = container.querySelector('.edit-field-wrapper');
            if (wrapper) wrapper.remove();
            const editBtn = container.querySelector('.btn-edit');
            if (editBtn) editBtn.style.display = 'inline-block';
        }
        editando.campo = null;
        editando.original = null;
    }

    function salvarEdicao(campo, valorAntigo, valorNovo) {
        const updateData = {};
        updateData[campo] = valorNovo;

        const historico = osData.historico || [];
        historico.push({
            data: new Date().toISOString(),
            acao: 'edicao',
            usuario_uid: currentUser.uid,
            usuario: currentUserData?.nome || 'Usuário',
            mensagem: `Editou ${campo}`,
            detalhes: {
                campo: campo,
                valor_antigo: valorAntigo,
                valor_novo: valorNovo
            }
        });

        updateData.historico = historico;
        updateData.atualizado_em = new Date().toISOString();

        db.collection('ordens_servico').doc(osId).update(updateData)
            .then(() => {
                osData[campo] = valorNovo;
                osData.historico = historico;
                osData.atualizado_em = new Date().toISOString();
                cancelarEdicao();
                renderizarDetalhe();
            })
            .catch(err => {
                alert('Erro ao salvar: ' + err.message);
            });
    }

    // ================================================================
    // POPULAR DIRECIONAMENTO
    // ================================================================
    function popularDirecionamento() {
        acaoDirecionar.innerHTML = '<option value="">Manter destino atual</option>';
        acaoDirecionar.innerHTML += `<option value="group:admin">GRUPO: Administradores</option>`;
        acaoDirecionar.innerHTML += `<option value="group:diretor">GRUPO: Diretores</option>`;
        const admins = [];
        const diretores = [];
        Object.keys(userMap).forEach(uid => {
            const u = userMap[uid];
            if (u.funcao === 'admin') admins.push({uid, nome: u.nome});
            else if (u.funcao === 'diretor') diretores.push({uid, nome: u.nome});
        });
        admins.sort((a,b) => a.nome.localeCompare(b.nome));
        diretores.sort((a,b) => a.nome.localeCompare(b.nome));
        admins.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a.uid;
            opt.textContent = `👤 ${a.nome} (admin)`;
            acaoDirecionar.appendChild(opt);
        });
        diretores.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.uid;
            opt.textContent = `👤 ${d.nome} (diretor)`;
            acaoDirecionar.appendChild(opt);
        });
    }

    // ================================================================
    // ADICIONAR AÇÃO
    // ================================================================
    formNovaAcao.addEventListener('submit', (e) => {
        e.preventDefault();
        const descricao = acaoDescricao.value.trim();
        if (!descricao) {
            mostrarMensagemAcao('A descrição é obrigatória.', 'error');
            return;
        }

        const direcionarPara = acaoDirecionar.value;
        const agora = new Date().toISOString();

        const historico = osData.historico || [];
        const novaAcao = {
            data: agora,
            acao: 'ação',
            usuario_uid: currentUser.uid,
            usuario: currentUserData?.nome || 'Usuário',
            mensagem: descricao,
        };
        if (direcionarPara) {
            novaAcao.direcionado_para = direcionarPara;
            const destinoNome = acaoDirecionar.options[acaoDirecionar.selectedIndex]?.text || direcionarPara;
            novaAcao.direcionado_para_nome = destinoNome;
        }

        historico.push(novaAcao);

        const updateData = {
            historico: historico,
            atualizado_em: agora
        };

        if (direcionarPara) {
            updateData.direcionado_para = direcionarPara;
            const destinoNome = acaoDirecionar.options[acaoDirecionar.selectedIndex]?.text || direcionarPara;
            updateData.direcionado_para_nome = destinoNome;
            const uid = direcionarPara;
            if (uid && userMap[uid]) {
                updateData.direcionado_para_funcao = userMap[uid].funcao;
            } else if (direcionarPara === 'group:admin') {
                updateData.direcionado_para_funcao = 'admin';
            } else if (direcionarPara === 'group:diretor') {
                updateData.direcionado_para_funcao = 'diretor';
            }
        }

        db.collection('ordens_servico').doc(osId).update(updateData)
            .then(() => {
                osData.historico = historico;
                if (direcionarPara) {
                    osData.direcionado_para = updateData.direcionado_para;
                    osData.direcionado_para_nome = updateData.direcionado_para_nome;
                    osData.direcionado_para_funcao = updateData.direcionado_para_funcao;
                }
                osData.atualizado_em = agora;
                acaoDescricao.value = '';
                acaoDirecionar.value = '';
                mostrarMensagemAcao('Ação adicionada com sucesso!', 'success');
                renderizarDetalhe();
                setTimeout(() => { esconderMensagemAcao(); }, 3000);
            })
            .catch(err => {
                mostrarMensagemAcao('Erro: ' + err.message, 'error');
            });
    });

    function mostrarMensagemAcao(texto, tipo) {
        acaoMessage.textContent = texto;
        acaoMessage.className = 'message';
        if (tipo === 'error') acaoMessage.classList.add('error');
        else if (tipo === 'success') acaoMessage.classList.add('success');
        acaoMessage.style.display = 'block';
    }
    function esconderMensagemAcao() {
        acaoMessage.style.display = 'none';
    }

    // ================================================================
    // CONCLUIR OS
    // ================================================================
    function concluirOS() {
        if (!confirm('Deseja concluir esta OS?')) return;
        const agora = new Date().toISOString();
        const historico = osData.historico || [];
        historico.push({
            data: agora,
            acao: 'conclusão',
            usuario_uid: currentUser.uid,
            usuario: currentUserData?.nome || 'Usuário',
            mensagem: 'OS concluída'
        });

        db.collection('ordens_servico').doc(osId).update({
            status: 'concluida',
            historico: historico,
            atualizado_em: agora
        })
        .then(() => {
            osData.status = 'concluida';
            osData.historico = historico;
            osData.atualizado_em = agora;
            renderizarDetalhe();
        })
        .catch(err => alert('Erro: ' + err.message));
    }

    // ================================================================
    // REABRIR OS (Admin ou Diretor)
    // ================================================================
    function reabrirOS() {
        if (!confirm('Deseja reabrir esta OS?')) return;
        const agora = new Date().toISOString();
        const historico = osData.historico || [];
        historico.push({
            data: agora,
            acao: 'reabertura',
            usuario_uid: currentUser.uid,
            usuario: currentUserData?.nome || 'Usuário',
            mensagem: 'OS reaberta'
        });

        db.collection('ordens_servico').doc(osId).update({
            status: 'em_andamento',
            historico: historico,
            atualizado_em: agora
        })
        .then(() => {
            osData.status = 'em_andamento';
            osData.historico = historico;
            osData.atualizado_em = agora;
            renderizarDetalhe();
        })
        .catch(err => alert('Erro: ' + err.message));
    }

    // ================================================================
    // INICIALIZAÇÃO
    // ================================================================
    function init() {
        const params = new URLSearchParams(window.location.search);
        osId = params.get('id');
        if (!osId) {
            historicoContainer.innerHTML = '<p style="color:red;">ID da OS não fornecido.</p>';
            return;
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                db.collection('usuarios').doc(user.uid).get()
                    .then(doc => {
                        if (doc.exists) {
                            currentUserData = doc.data();
                        } else {
                            currentUserData = { nome: user.displayName || 'Usuário', funcao: 'tecnico' };
                        }
                        carregarUsuarios().then(() => {
                            carregarOS();
                        });
                    })
                    .catch(() => {
                        currentUserData = { nome: user.displayName || 'Usuário', funcao: 'tecnico' };
                        carregarUsuarios().then(() => {
                            carregarOS();
                        });
                    });
            } else {
                window.location.href = 'index.html';
            }
        });
    }

    init();
</script>
</body>
</html>
