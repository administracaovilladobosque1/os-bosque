<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Abrir OS - Villa do Bosque</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Calibri', 'Segoe UI', Tahoma, sans-serif; }
        body { background: #e8f5e9; padding: 16px 12px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: #fff; max-width: 650px; width: 100%; padding: 18px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,80,0,0.12); border: 1px solid #a5d6a7; }

        /* Cabeçalho "Logado como" — linha simples */
        .user-header {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #1b5e20;
        }
        .user-header .uh-label { font-weight: 500; color: #558b2f; }
        .user-header .uh-nome { font-weight: 700; color: #1b5e20; }
        .user-header .uh-funcao {
            display: inline-block; padding: 2px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
        }
        .uh-funcao.master { background: #ffcc80; color: #4e342e; }
        .uh-funcao.admin { background: #ffe082; color: #4e342e; }
        .uh-funcao.diretor { background: #a5d6a7; color: #1b5e20; }
        .uh-funcao.tecnico { background: #ced4da; color: #333; }

        .page-title { font-size: 24px; color: #1b5e20; background: #c8e6c9; display: inline-block; padding: 4px 18px; border-radius: 30px; margin-bottom: 12px; }
        .btn { padding: 8px 16px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #1b5e20; }
        .btn-success { background: #388e3c; }
        .btn-success:hover { background: #2e7d32; }
        .btn-voltar { background: #558b2f; display: inline-block; text-decoration: none; color: white; padding: 5px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
        .btn-voltar:hover { background: #33691e; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: 600; font-size: 13px; color: #1b5e20; margin-bottom: 2px; }
        input, select, textarea { width: 100%; padding: 6px 10px; border: 1px solid #a5d6a7; border-radius: 6px; font-size: 14px; background: #fafffe; }
        textarea { resize: vertical; min-height: 50px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2e7d32; box-shadow: 0 0 0 2px rgba(46,125,50,0.15); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-row .form-group input { width: 70%; margin: 0 auto; display: block; }
        .message { margin-top: 12px; padding: 8px; border-radius: 6px; display: none; font-size: 13px; }
        .message.error { display: block; background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
        .message.success { display: block; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }

        .bloco { border: 1.5px solid #a5d6a7; border-radius: 10px; padding: 10px 12px 6px 12px; margin-bottom: 14px; }
        .bloco-reclamante { border-color: #66bb6a; }
        .bloco-reclamado { border-color: #ffa726; }
        .bloco-title { font-weight: 700; font-size: 14px; color: #1b5e20; margin-bottom: 6px; display: block; }
        .bloco-reclamante .bloco-title { color: #2e7d32; }
        .bloco-reclamado .bloco-title { color: #e65100; }
        .bloco .form-group { margin-bottom: 6px; }

        @media (max-width: 600px) {
            .container { padding: 14px; }
            .form-row { grid-template-columns: 1fr; gap: 4px; }
            .form-row .form-group input { width: 100%; }
            .page-title { font-size: 20px; }
            .bloco { padding: 8px 10px 4px 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="user-header" id="userHeader">
        <span class="uh-label">Logado como:</span>
        <span class="uh-nome" id="userHeaderName">—</span>
        <span class="uh-funcao tecnico" id="userHeaderRole">—</span>
    </div>

    <h1 class="page-title">📝 Nova OS</h1>
    <a href="index.html" class="btn-voltar">← Voltar</a>

    <form id="osForm">
        <div class="form-group">
            <label>Título</label>
            <input type="text" id="titulo" placeholder="Ex: Reclamação barulho" required>
        </div>
        <div class="form-group">
            <label>Descrição / Relato</label>
            <textarea id="descricao" placeholder="Descreva o problema" required></textarea>
        </div>
        <div class="form-group">
            <label>Tipo</label>
            <select id="tipo" required>
                <option value="serviço">Serviço</option>
                <option value="reclamação">Reclamação</option>
                <option value="infração">Infração</option>
                <option value="análise">Análise</option>
            </select>
        </div>

        <div class="bloco bloco-reclamante">
            <span class="bloco-title">📌 Reclamante</span>
            <div class="form-row">
                <div class="form-group">
                    <label>Quadra (opcional)</label>
                    <input type="text" id="quadraReclamante" placeholder="Ex: C" class="quadra-input">
                </div>
                <div class="form-group">
                    <label>Lote (opcional)</label>
                    <input type="text" id="loteReclamante" placeholder="Ex: 09" maxlength="2" pattern="\d{1,2}">
                </div>
            </div>
        </div>

        <div class="bloco bloco-reclamado">
            <span class="bloco-title">📍 Reclamado</span>
            <div class="form-row">
                <div class="form-group">
                    <label>Quadra (opcional)</label>
                    <input type="text" id="quadraReclamada" placeholder="Ex: D" class="quadra-input">
                </div>
                <div class="form-group">
                    <label>Lote (opcional)</label>
                    <input type="text" id="loteReclamado" placeholder="Ex: 12" maxlength="2" pattern="\d{1,2}">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Direcionar para</label>
            <select id="direcionadoPara" required>
                <option value="">Carregando...</option>
            </select>
        </div>
        <div class="form-group">
            <label>Prioridade</label>
            <select id="prioridade" required>
                <option value="emergencial">🔴 Emergencial (resolver hoje)</option>
                <option value="urgente" selected>🟡 Urgente (resolver logo)</option>
                <option value="normal">🟢 Normal (resolver)</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success" id="btnAbrir" style="width:100%;">Abrir OS</button>
        <div id="formMessage" class="message"></div>
    </form>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDx_6oWO30Drh8GkuQA9jk2Oym7H8J3ABg",
        authDomain: "villa-bosque1.firebaseapp.com",
        projectId: "villa-bosque1",
        storageBucket: "villa-bosque1.firebasestorage.app",
        messagingSenderId: "372474036025",
        appId: "1:372474036025:web:bbbee10723469d77cbb2e8"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const MASTER_EMAIL = 'administracaovilladobosque@gmail.com';
    const TIMEOUT_MS = 4 * 60 * 60 * 1000;
    const TIMEOUT_KEY = 'vb_lastActivity';
    const TIMEOUT_CHECK_INTERVAL = 30 * 1000;

    const roleMap = { 'master':'Master', 'admin':'Administrador', 'diretor':'Diretor', 'tecnico':'Técnico' };

    function registrarAtividade() { try { localStorage.setItem(TIMEOUT_KEY, Date.now().toString()); } catch(e) {} }
    function fazerLogoutTimeout() {
        if (window.__fazendoLogout) return;
        window.__fazendoLogout = true;
        try { localStorage.removeItem(TIMEOUT_KEY); localStorage.removeItem('vb_userLoggedIn'); sessionStorage.clear(); } catch(e) {}
        auth.signOut().finally(() => {
            alert('Sessão expirada por inatividade. Faça login novamente.');
            window.location.href = 'index.html';
        });
    }
    function verificarTimeoutAgora() {
        const last = parseInt(localStorage.getItem(TIMEOUT_KEY) || '0', 10);
        if (!last) return false;
        if ((Date.now() - last) > TIMEOUT_MS) { fazerLogoutTimeout(); return true; }
        return false;
    }
    function iniciarMonitorTimeout() {
        if (verificarTimeoutAgora()) return;
        if (!localStorage.getItem(TIMEOUT_KEY)) registrarAtividade();
        ['click','mousemove','keydown','scroll','touchstart'].forEach(ev => {
            document.addEventListener(ev, registrarAtividade, { passive: true });
        });
        setInterval(verificarTimeoutAgora, TIMEOUT_CHECK_INTERVAL);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') verificarTimeoutAgora();
        });
    }

    const form = document.getElementById('osForm');
    const tituloInput = document.getElementById('titulo');
    const descricaoInput = document.getElementById('descricao');
    const tipoSelect = document.getElementById('tipo');
    const quadraReclamante = document.getElementById('quadraReclamante');
    const loteReclamante = document.getElementById('loteReclamante');
    const quadraReclamada = document.getElementById('quadraReclamada');
    const loteReclamado = document.getElementById('loteReclamado');
    const direcionadoSelect = document.getElementById('direcionadoPara');
    const prioridadeSelect = document.getElementById('prioridade');
    const formMsg = document.getElementById('formMessage');
    const btnAbrir = document.getElementById('btnAbrir');
    const userHeaderName = document.getElementById('userHeaderName');
    const userHeaderRole = document.getElementById('userHeaderRole');

    let currentUser = null;
    let currentUserNome = '';
    let personagensList = [];

    function formatarLote(valor) {
        if (!valor) return '';
        const num = parseInt(valor.trim(), 10);
        if (isNaN(num) || num < 1) return valor.trim();
        return String(Math.min(num, 99)).padStart(2, '0');
    }
    function atualizarHeader(nome, funcao) {
        userHeaderName.textContent = nome || 'Usuário';
        userHeaderRole.className = 'uh-funcao ' + (funcao || 'tecnico');
        userHeaderRole.textContent = roleMap[funcao] || funcao || 'Técnico';
    }

    document.querySelectorAll('.quadra-input').forEach(input => {
        input.addEventListener('input', function() { this.value = this.value.toUpperCase(); });
    });

    function aplicarFormatacaoLotes() {
        if (loteReclamante.value.trim()) loteReclamante.value = formatarLote(loteReclamante.value);
        if (loteReclamado.value.trim()) loteReclamado.value = formatarLote(loteReclamado.value);
    }
    loteReclamante.addEventListener('blur', aplicarFormatacaoLotes);
    loteReclamado.addEventListener('blur', aplicarFormatacaoLotes);

    function carregarPersonagens() {
        direcionadoSelect.innerHTML = '<option value="">Carregando...</option>';
        db.collection('usuarios').where('status', '==', 'ativo').get()
            .then(snapshot => {
                const admins = [], diretores = [];
                snapshot.forEach(doc => {
                    const d = doc.data();
                    if (d.funcao !== 'admin' && d.funcao !== 'diretor') return;
                    const item = { id: doc.id, nome: d.nome, funcao: d.funcao };
                    if (d.funcao === 'admin') admins.push(item);
                    else diretores.push(item);
                });
                admins.sort((a,b) => a.nome.localeCompare(b.nome));
                diretores.sort((a,b) => a.nome.localeCompare(b.nome));
                personagensList = [...admins, ...diretores];

                let html = '<option value="">Selecione um destino...</option>';
                html += `<option value="group:admin" style="background-color:#ffe082;">GRUPO: Administradores</option>`;
                html += `<option value="group:diretor" style="background-color:#a5d6a7;">GRUPO: Diretores</option>`;

                admins.forEach(item => {
                    const isMe = (item.id === currentUser.uid);
                    const label = isMe ? `${item.nome} (você) (${item.funcao})` : `${item.nome} (${item.funcao})`;
                    html += `<option value="${item.id}" style="background-color:#ffe082;">${label}</option>`;
                });
                diretores.forEach(item => {
                    const isMe = (item.id === currentUser.uid);
                    const label = isMe ? `${item.nome} (você) (${item.funcao})` : `${item.nome} (${item.funcao})`;
                    html += `<option value="${item.id}" style="background-color:#a5d6a7;">${label}</option>`;
                });

                if (admins.length === 0 && diretores.length === 0) {
                    html = '<option value="">Nenhum Administrador ou Diretor ativo</option>';
                }
                direcionadoSelect.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                direcionadoSelect.innerHTML = `<option value="">Erro: ${err.message}</option>`;
            });
    }

    function gerarNumeroOS() {
        return db.collection('ordens_servico').orderBy('numero','desc').limit(1).get()
            .then(snapshot => snapshot.empty ? 1 : (snapshot.docs[0].data().numero || 0) + 1);
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        aplicarFormatacaoLotes();

        const titulo = tituloInput.value.trim();
        const descricao = descricaoInput.value.trim();
        const tipo = tipoSelect.value;
        const qR = quadraReclamante.value.trim().toUpperCase();
        const lR = loteReclamante.value.trim();
        const qA = quadraReclamada.value.trim().toUpperCase();
        const lA = loteReclamado.value.trim();
        const valSel = direcionadoSelect.value;
        const prioridade = prioridadeSelect.value;

        if (!titulo || !descricao) { showMessage(formMsg, 'Preencha título e descrição.', 'error'); return; }
        if (!valSel) { showMessage(formMsg, 'Selecione para quem direcionar a OS.', 'error'); return; }

        btnAbrir.disabled = true;
        btnAbrir.textContent = 'Abrindo...';

        let dirPara = valSel;
        let dirNome = '';
        let dirFuncao = '';

        if (valSel === 'group:admin') { dirNome = 'Administradores'; dirFuncao = 'admin'; }
        else if (valSel === 'group:diretor') { dirNome = 'Diretores'; dirFuncao = 'diretor'; }
        else {
            const found = personagensList.find(p => p.id === valSel);
            if (!found) {
                showMessage(formMsg, 'Personagem não encontrado.', 'error');
                btnAbrir.disabled = false; btnAbrir.textContent = 'Abrir OS';
                return;
            }
            dirNome = found.nome; dirFuncao = found.funcao || '';
        }

        gerarNumeroOS().then(numero => {
            const agora = new Date().toISOString();
            const osData = {
                numero, titulo, descricao, tipo,
                quadra_reclamante: qR || null, lote_reclamante: lR || null,
                quadra_reclamada: qA || null, lote_reclamada: lA || null,
                prioridade, status: 'aberta',
                aberto_por: currentUser.uid,
                aberto_por_nome: currentUserNome,
                direcionado_para: dirPara,
                direcionado_para_nome: dirNome,
                direcionado_para_funcao: dirFuncao,
                direcionado_para_original: dirPara,
                direcionado_para_nome_original: dirNome,
                direcionado_para_funcao_original: dirFuncao,
                historico: [{
                    data: agora, acao: 'abertura',
                    usuario_uid: currentUser.uid, usuario: currentUserNome,
                    mensagem: `OS aberta por ${currentUserNome}`,
                    direcionado_para: dirPara, direcionado_para_nome: dirNome
                }],
                criado_em: agora, atualizado_em: agora
            };
            return db.collection('ordens_servico').add(osData);
        })
        .then((docRef) => {
            showMessage(formMsg, `✅ OS #${docRef.id} aberta com sucesso!`, 'success');
            form.reset();
            btnAbrir.disabled = false; btnAbrir.textContent = 'Abrir OS';
            carregarPersonagens();
            setTimeout(() => { window.location.href = 'os-list.html'; }, 2000);
        })
        .catch(err => {
            console.error(err);
            showMessage(formMsg, 'Erro ao abrir OS: ' + err.message, 'error');
            btnAbrir.disabled = false; btnAbrir.textContent = 'Abrir OS';
        });
    });

    function showMessage(el, text, type) { el.textContent = text; el.className = 'message ' + type; }

    auth.onAuthStateChanged((user) => {
        if (!user) { window.location.href = 'index.html'; return; }
        currentUser = user;
        registrarAtividade();
        iniciarMonitorTimeout();

        db.collection('usuarios').doc(user.uid).get()
            .then(doc => {
                let nome = user.displayName || user.email;
                let funcao = 'tecnico';
                if (doc.exists) {
                    const d = doc.data();
                    nome = d.nome || nome;
                    funcao = d.funcao || 'tecnico';
                }
                if (user.email === MASTER_EMAIL) funcao = 'master';
                currentUserNome = nome;
                atualizarHeader(nome, funcao);
                carregarPersonagens();
            })
            .catch(() => {
                currentUserNome = user.displayName || user.email;
                const f = user.email === MASTER_EMAIL ? 'master' : 'tecnico';
                atualizarHeader(currentUserNome, f);
                carregarPersonagens();
            });
    });
</script>
</body>
</html>
