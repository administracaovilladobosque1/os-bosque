<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Sistema de OS - Villa do Bosque</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Calibri', 'Segoe UI', Tahoma, sans-serif; }
        body { background: #e8f5e9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px 15px; }
        .container { background: #fff; padding: 30px 25px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,80,0,0.15); width: 100%; max-width: 480px; border: 1px solid #a5d6a7; }
        .logo-area { text-align: center; margin-bottom: 25px; }
        .logo-area img { max-width: 180px; height: auto; display: block; margin: 0 auto 10px; }
        .logo-area .main-title { font-size: 28px; font-weight: 700; color: #1b5e20; line-height: 1.2; margin-top: 5px; }
        .logo-area .main-title span { background: #c8e6c9; padding: 6px 18px; border-radius: 30px; display: inline-block; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 5px; color: #1b5e20; }
        input { width: 100%; padding: 14px 15px; border: 1px solid #a5d6a7; border-radius: 10px; font-size: 16px; background: #fafffe; }
        input:focus { outline: none; border-color: #2e7d32; box-shadow: 0 0 0 3px rgba(46,125,50,0.2); }
        .btn { display: block; width: 100%; padding: 14px 20px; background: #2e7d32; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; text-decoration: none; text-align: center; white-space: normal; word-wrap: break-word; margin-bottom: 10px; }
        .btn:hover { background: #1b5e20; }
        .btn-danger { background: #c62828; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-success { background: #388e3c; }
        .btn-success:hover { background: #2e7d32; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .message { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; }
        .message.error { display: block; background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
        .message.success { display: block; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
        .hidden { display: none !important; }

        #dashboard { display: none; }
        .dashboard-logo { text-align: center; margin-bottom: 10px; }
        .dashboard-logo .main-title { font-size: 22px; font-weight: 700; color: #1b5e20; line-height: 1.2; }
        .dashboard-logo .main-title span { background: #c8e6c9; padding: 4px 16px; border-radius: 30px; display: inline-block; }
        .user-info { background: #e8f5e9; padding: 15px; border-radius: 12px; margin: 20px 0; text-align: center; border: 1px solid #a5d6a7; }
        .user-info strong { color: #1b5e20; }
        .logout-area { text-align: center; margin-top: 20px; }
        .logout-area .btn { display: inline-block; width: auto; padding: 12px 40px; margin-bottom: 0; }
        .timeout-warning { font-size: 13px; color: #558b2f; text-align: right; margin-top: 10px; }

        /* Cabeçalho "Logado como" — linha simples, sem caixa */
        .user-header {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #1b5e20;
        }
        .user-header .uh-label { font-weight: 500; color: #558b2f; }
        .user-header .uh-nome { font-weight: 700; color: #1b5e20; }
        .user-header .uh-funcao {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .uh-funcao.master { background: #ffcc80; color: #4e342e; }
        .uh-funcao.admin { background: #ffe082; color: #4e342e; }
        .uh-funcao.diretor { background: #a5d6a7; color: #1b5e20; }
        .uh-funcao.tecnico { background: #ced4da; color: #333; }

        .menu-panel { background: #f1f8e9; border-radius: 16px; padding: 20px; margin-top: 20px; border: 1px solid #a5d6a7; }
        .menu-panel h2 { font-size: 20px; margin: 0 0 15px; color: #2e7d32; border-bottom: 2px solid #c8e6c9; padding-bottom: 10px; }
        .menu-panel .btn:last-child { margin-bottom: 0; }
        @media (max-width: 600px) {
            body { padding: 10px 8px; }
            .container { padding: 20px 15px; max-width: 100%; }
            .logo-area img { max-width: 120px; }
            .logo-area .main-title { font-size: 22px; }
            .dashboard-logo .main-title { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- TELA DE LOGIN -->
    <div id="loginScreen">
        <div class="logo-area">
            <img src="logo.png" alt="Logo Villa do Bosque">
            <div class="main-title"><span>SISTEMA<br>ORDEM DE SERVIÇO</span></div>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Entrar</button>
        </form>
        <div id="loginMessage" class="message"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <div class="user-header" id="userHeader">
            <span class="uh-label">Logado como:</span>
            <span class="uh-nome" id="userHeaderName">—</span>
            <span class="uh-funcao tecnico" id="userHeaderRole">—</span>
        </div>

        <div class="dashboard-logo">
            <div class="main-title"><span>SISTEMA<br>ORDEM DE SERVIÇO</span></div>
        </div>
        <h1 style="font-size:26px; color:#1b5e20; text-align:center;">📋 Painel de Controle</h1>
        <div class="user-info">
            <p>👋 Olá, <strong id="userName">Usuário</strong>!</p>
            <p style="font-size:13px; color:#2e7d32;" id="userEmail"></p>
            <p style="font-size:12px; color:#558b2f; margin-top:5px;">⏳ Sessão ativa por <span id="timerDisplay">4h00</span></p>
        </div>

        <div id="menuArea" class="menu-panel">
            <h2 id="menuTitle">📌 Ações disponíveis</h2>
            <div id="menuButtons"></div>
        </div>

        <div class="logout-area">
            <button class="btn btn-danger" id="logoutBtn">Sair</button>
        </div>
        <div class="timeout-warning">⏱️ Sessão expira após 4 horas de inatividade.</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDx_6oWO30Drh8GkuQA9jk2Oym7H8J3ABg",
        authDomain: "villa-bosque1.firebaseapp.com",
        projectId: "villa-bosque1",
        storageBucket: "villa-bosque1.firebasestorage.app",
        messagingSenderId: "372474036025",
        appId: "1:372474036025:web:bbbee10723469d77cbb2e8"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const MASTER_EMAIL = 'administracaovilladobosque@gmail.com';
    const TIMEOUT_MS = 4 * 60 * 60 * 1000;
    const TIMEOUT_KEY = 'vb_lastActivity';
    const TIMEOUT_CHECK_INTERVAL = 30 * 1000;
    let timerInterval = null;

    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboard');
    const timerDisplay = document.getElementById('timerDisplay');
    const loginForm = document.getElementById('loginForm');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginMessage = document.getElementById('loginMessage');
    const userName = document.getElementById('userName');
    const userEmail = document.getElementById('userEmail');
    const menuButtons = document.getElementById('menuButtons');
    const menuTitle = document.getElementById('menuTitle');
    const userHeaderName = document.getElementById('userHeaderName');
    const userHeaderRole = document.getElementById('userHeaderRole');

    const roleMap = { 'master':'Master', 'admin':'Administrador', 'diretor':'Diretor', 'tecnico':'Técnico' };
    const roleMapFull = { 'master':'Master (Controle Total)', 'admin':'Administrador', 'diretor':'Diretor', 'tecnico':'Técnico' };

    // ============================================================
    // TIMEOUT
    // ============================================================
    function registrarAtividade() {
        try { localStorage.setItem(TIMEOUT_KEY, Date.now().toString()); } catch(e) {}
    }
    function fazerLogoutTimeout() {
        if (window.__fazendoLogout) return;
        window.__fazendoLogout = true;
        try {
            localStorage.removeItem(TIMEOUT_KEY);
            localStorage.removeItem('vb_userLoggedIn');
            sessionStorage.clear();
        } catch(e) {}
        if (timerInterval) clearInterval(timerInterval);
        auth.signOut().finally(() => {
            alert('Sessão expirada por inatividade. Faça login novamente.');
            window.location.href = 'index.html';
        });
    }
    function verificarTimeoutAgora() {
        const last = parseInt(localStorage.getItem(TIMEOUT_KEY) || '0', 10);
        if (!last) return false;
        if ((Date.now() - last) > TIMEOUT_MS) { fazerLogoutTimeout(); return true; }
        return false;
    }
    function iniciarMonitorTimeout() {
        if (verificarTimeoutAgora()) return;
        if (!localStorage.getItem(TIMEOUT_KEY)) registrarAtividade();
        ['click','mousemove','keydown','scroll','touchstart'].forEach(ev => {
            document.addEventListener(ev, registrarAtividade, { passive: true });
        });
        setInterval(verificarTimeoutAgora, TIMEOUT_CHECK_INTERVAL);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') verificarTimeoutAgora();
        });
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const last = parseInt(localStorage.getItem(TIMEOUT_KEY) || '0', 10);
            const remaining = Math.max(0, TIMEOUT_MS - (Date.now() - (last || Date.now())));
            const h = String(Math.floor(remaining/3600000)).padStart(2,'0');
            const m = String(Math.floor((remaining%3600000)/60000)).padStart(2,'0');
            const s = String(Math.floor((remaining%60000)/1000)).padStart(2,'0');
            if (timerDisplay) timerDisplay.textContent = `${h}h${m}m${s}s`;
        }, 1000);
    }

    // ============================================================
    // TELAS
    // ============================================================
    function showLoginScreen() {
        loginScreen.classList.remove('hidden');
        dashboardScreen.style.display = 'none';
        loginMessage.className = 'message';
        loginMessage.textContent = '';
        if (timerInterval) clearInterval(timerInterval);
        try {
            localStorage.removeItem(TIMEOUT_KEY);
            localStorage.removeItem('vb_userLoggedIn');
            sessionStorage.clear();
        } catch(e) {}
    }

    function atualizarHeader(nome, funcao) {
        userHeaderName.textContent = nome || 'Usuário';
        userHeaderRole.className = 'uh-funcao ' + (funcao || 'tecnico');
        userHeaderRole.textContent = roleMap[funcao] || funcao;
    }

    function showDashboard(user, userData) {
        loginScreen.classList.add('hidden');
        dashboardScreen.style.display = 'block';

        const emailAtual = (user.email || '').trim().toLowerCase();
        const masterEmailLower = MASTER_EMAIL.trim().toLowerCase();
        let nomeExibicao = 'Usuário';
        if (emailAtual === masterEmailLower) nomeExibicao = 'Master';
        else nomeExibicao = userData?.nome || user.displayName || 'Usuário';

        userName.textContent = nomeExibicao;
        userEmail.textContent = user.email;
        try { localStorage.setItem('vb_userLoggedIn', 'true'); } catch(e) {}

        let funcao = userData?.funcao || 'tecnico';
        if (emailAtual === masterEmailLower) funcao = 'master';

        atualizarHeader(nomeExibicao, funcao);

        let html = '';
        if (funcao === 'master') {
            html += `<a href="personagens.html" class="btn btn-success">👥 Gerenciar Personagens</a>`;
            html += `<a href="os-list.html" class="btn btn-secondary">📋 Listar Ordens de Serviço</a>`;
            html += `<a href="os-abrir.html" class="btn" style="background:#2e7d32;">📝 Nova Ordem de Serviço</a>`;
            menuTitle.textContent = '👑 Painel do Master';
        } else if (funcao === 'admin' || funcao === 'diretor') {
            html += `<a href="os-list.html" class="btn btn-secondary">📋 Listar Ordens de Serviço</a>`;
            html += `<a href="os-abrir.html" class="btn" style="background:#2e7d32;">📝 Nova Ordem de Serviço</a>`;
            menuTitle.textContent = `📌 Painel do ${roleMapFull[funcao]}`;
        } else {
            html += `<a href="os-list.html" class="btn btn-secondary">📋 Listar Ordens de Serviço</a>`;
            menuTitle.textContent = `📌 Painel do ${roleMapFull[funcao]}`;
        }
        menuButtons.innerHTML = html;

        registrarAtividade();
        iniciarMonitorTimeout();
    }

    function showMessage(el, text, type) { el.textContent = text; el.className = 'message ' + type; }

    // ============================================================
    // LOGIN / LOGOUT
    // ============================================================
    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = loginEmail.value.trim();
        const password = loginPassword.value;
        if (!email || !password) { showMessage(loginMessage, 'Preencha todos os campos.', 'error'); return; }
        auth.signInWithEmailAndPassword(email, password)
            .then(() => showMessage(loginMessage, 'Login realizado!', 'success'))
            .catch((error) => {
                let msg = 'Erro ao fazer login.';
                if (error.code === 'auth/user-not-found') msg = 'Usuário não encontrado.';
                else if (error.code === 'auth/wrong-password') msg = 'Senha incorreta.';
                else if (error.code === 'auth/invalid-email') msg = 'E-mail inválido.';
                showMessage(loginMessage, msg, 'error');
            });
    });

    logoutBtn.addEventListener('click', () => {
        if (timerInterval) clearInterval(timerInterval);
        try {
            localStorage.removeItem(TIMEOUT_KEY);
            localStorage.removeItem('vb_userLoggedIn');
            sessionStorage.clear();
        } catch(e) {}
        auth.signOut();
    });

    auth.onAuthStateChanged((user) => {
        if (user) {
            const last = parseInt(localStorage.getItem(TIMEOUT_KEY) || '0', 10);
            if (last && (Date.now() - last) > TIMEOUT_MS) {
                fazerLogoutTimeout();
                return;
            }
            registrarAtividade();

            db.collection('usuarios').doc(user.uid).get()
                .then(doc => {
                    if (doc.exists) {
                        showDashboard(user, doc.data());
                    } else {
                        const defaultData = { nome: user.displayName || 'Usuário', funcao: 'tecnico', status: 'ativo' };
                        db.collection('usuarios').doc(user.uid).set(defaultData)
                            .then(() => showDashboard(user, defaultData))
                            .catch(() => showDashboard(user, defaultData));
                    }
                })
                .catch(() => {
                    const defaultData = { nome: user.displayName || 'Usuário', funcao: 'tecnico' };
                    showDashboard(user, defaultData);
                });
        } else {
            showLoginScreen();
            loginForm.reset();
            loginMessage.className = 'message';
            loginMessage.textContent = '';
            if (timerInterval) clearInterval(timerInterval);
        }
    });

    showLoginScreen();
</script>
</body>
</html>
